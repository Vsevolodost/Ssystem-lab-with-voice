long:`Разберём по звеньям цепочки — потерять можно на каждом.<br><br><b>Продюсер.</b> <code>acks=all</code> — ждём подтверждения от всех синхронизированных реплик, а не только от лидера. <code>acks=1</code> означает: лидер подтвердил и тут же упал до репликации — сообщение потеряно. Плюс <code>enable.idempotence=true</code>, чтобы ретраи продюсера не создавали дубли.<br><br><b>Брокер.</b> <code>replication.factor=3</code> — три копии на разных брокерах. <code>min.insync.replicas=2</code> — если живых реплик меньше двух, брокер откажет в записи, а не примет её без гарантий. Это осознанный выбор в пользу консистентности.<br><br><b>ISR (In-Sync Replicas)</b> — реплики, не отстающие от лидера. При падении лидера новый выбирается из ISR. Если разрешить <code>unclean.leader.election</code>, лидером может стать отставшая реплика — и часть данных потеряется. В финтехе это отключают.<br><br><b>Консьюмер.</b> <code>enable.auto.commit=false</code> и коммит offset вручную <b>после</b> успешной обработки. При автокоммите offset может уехать вперёд до того, как сообщение реально обработано.<br><br><b>Цена:</b> все эти настройки снижают пропускную способность. Для платёжных событий — оправдано. Для метрик или логов кликов — избыточно, там достаточно acks=1.`}
]},
{id:"6-2",title:"RabbitMQ — Exchange, очереди, DLQ",
theory:`<p><b>На пальцах.</b> Если Kafka — это доска объявлений, где сообщения висят и их читают все желающие, то RabbitMQ — это <b>курьерская служба</b>. Отправитель не знает адресов получателей: он приносит посылку в сортировочный центр (Exchange) с надписью на коробке (routing key). Сортировочный центр по своим правилам раскладывает копии по нужным ящикам (Queue). Получатель забрал посылку и расписался (ack) — посылка исчезает.</p>
`+D.rabbit+`
<h4>Типы Exchange</h4>
<table>
<tr><th>Тип</th><th>Правило</th><th>Пример</th></tr>
<tr><td><b>Direct</b></td><td>Точное совпадение routing key</td><td>key="sms" → очередь sms</td></tr>
<tr><td><b>Topic</b></td><td>Шаблон с * и #</td><td>"payment.#" ловит payment.created, payment.failed</td></tr>
<tr><td><b>Fanout</b></td><td>Копия во все привязанные очереди</td><td>Broadcast: «новый клиент» всем сервисам</td></tr>
<tr><td><b>Headers</b></td><td>По заголовкам сообщения</td><td>Сложные правила без routing key</td></tr>
</table>
<div class="co mem"><span class="co-i">🧠</span><span><b>Разница между * и # в topic exchange:</b> <code>*</code> — ровно одно слово, <code>#</code> — любое количество слов. <code>payment.*</code> поймает <code>payment.created</code>, но не <code>payment.card.created</code>. А <code>payment.#</code> поймает оба.</span></div>
<h4>DLQ — Dead Letter Queue</h4>
<p>Сообщение попадает в DLQ, если: консьюмер отклонил его с <code>requeue=false</code>, истёк TTL, очередь переполнилась. Без DLQ «ядовитое» сообщение будет бесконечно возвращаться в очередь и блокировать обработку нормальных.</p>
<div class="co tip"><span class="co-i">💡</span><span>Правильный retry в RabbitMQ делают не через простой requeue (сообщение вернётся мгновенно и снова упадёт), а через отдельную <b>retry-очередь с TTL</b>: сообщение полежит там 30 секунд, потом вернётся в основную. Это даёт паузу между попытками.</span></div>`,
prac:"Спроектируй схему очередей для уведомлений: одно событие «просрочка» должно уйти и в SMS-сервис, и в сервис аудита, и в аналитику. Какой тип exchange выберешь и почему? Что произойдёт, если SMS-сервис лежит два часа?",
questions:[
{q:"В чём разница Kafka и RabbitMQ?",
short:"RabbitMQ — брокер очередей, сообщение забирает один консьюмер и после ack оно удаляется. Kafka — распределённый лог, сообщения хранятся по retention, несколько групп читают независимо. Rabbit про задачи, Kafka про события.",
long:`Сравнение по ключевым осям:<br><br><b>Модель доставки.</b> Rabbit — push, брокер сам отправляет сообщения консьюмеру. Kafka — pull, консьюмер сам запрашивает порцию, когда готов.<br><br><b>Судьба сообщения.</b> В Rabbit после ack сообщение исчезает. В Kafka остаётся до истечения retention, можно перечитать с любого offset.<br><br><b>Маршрутизация.</b> У Rabbit богатая: exchange с правилами, приоритеты, TTL на сообщение, отложенная доставка. У Kafka маршрутизации почти нет — есть топик и партиции, вся логика в консьюмере.<br><br><b>Пропускная способность.</b> Kafka на порядки выше: сотни тысяч сообщений в секунду против десятков тысяч.<br><br><b>Как выбирать на практике:</b><br>— Нужно, чтобы задачу выполнил ровно один воркер, с приоритетами и отложенным запуском → RabbitMQ<br>— Событие интересно нескольким потребителям, нужна история и возможность перечитать → Kafka<br><br><b>Пример из взыскания:</b> «поставить задачу оператору позвонить в 14:00» — это задача, RabbitMQ с отложенной доставкой. «Клиент внёс платёж» — это событие, которое нужно и сервису долгов, и уведомлениям, и аналитике → Kafka.`},
{q:"Что такое ack/nack и зачем ручное подтверждение?",
short:"Ack — подтверждение консьюмера, что сообщение обработано, после чего брокер его удаляет. При auto-ack брокер удаляет сразу при отправке, и падение консьюмера в середине обработки теряет сообщение. Ручной ack ставится после успешной обработки.",
long:`<b>Auto-ack (autoAck=true):</b> брокер считает сообщение доставленным в момент отправки по сети. Быстро, но небезопасно: консьюмер получил сообщение, начал обработку, упал — сообщение уже удалено из очереди и никто его не переобработает.<br><br><b>Manual ack:</b> консьюмер явно вызывает <code>basicAck</code> после успешной обработки. Если соединение оборвалось до ack, брокер вернёт сообщение в очередь и отдаст другому консьюмеру.<br><br><b>Nack и reject:</b><br>— <code>nack(requeue=true)</code> — вернуть в очередь. Осторожно: если ошибка систематическая, сообщение зациклится.<br>— <code>nack(requeue=false)</code> — отправить в DLQ. Правильный путь для «ядовитых» сообщений.<br><br><b>Важное следствие:</b> manual ack даёт гарантию at-least-once, а значит дубли возможны. Консьюмер обработал, но упал до ack → сообщение придёт снова. Поэтому обработчик обязан быть идемпотентным.<br><br><b>Prefetch (QoS):</b> сколько неподтверждённых сообщений брокер отдаст одному консьюмеру. <code>prefetch=1</code> — честное распределение: медленный консьюмер не набирает лишнего. Большой prefetch — выше пропускная способность, но при падении инстанса переобрабатывается больше сообщений.`},
{q:"Как в RabbitMQ гарантировать, что сообщение не потеряется?",
short:"Нужны три уровня одновременно: durable-очередь (переживёт рестарт брокера), persistent-сообщения (пишутся на диск), publisher confirms (продюсер получает подтверждение записи). Плюс quorum queues для отказоустойчивости кластера.",
long:`Разберём, почему нужны именно все три — упустив один, теряете данные.<br><br><b>1. Durable queue.</b> Объявляем очередь с <code>durable=true</code>. Без этого сам объект очереди исчезнет при рестарте брокера вместе со всем содержимым.<br><br><b>2. Persistent message.</b> <code>delivery_mode=2</code>. Тонкий момент: durable-очередь в непереживёт своих сообщений, если они не persistent. Очередь останется, но пустая. Нужны оба флага.<br><br><b>3. Publisher confirms.</b> Продюсер отправил и считает, что всё хорошо? Не факт — брокер мог упасть до записи. С confirms брокер присылает подтверждение, что сообщение принято и записано. Аналог acks в Kafka.<br><br><b>4. Кластеризация.</b> Classic mirrored queues устарели, современный вариант — <b>quorum queues</b> на алгоритме Raft. Очередь реплицируется на нечётное число узлов, запись подтверждается большинством. Падение одного узла из трёх не теряет данные.<br><br><b>Цена:</b> запись на диск и подтверждения снижают пропускную способность в разы. Для финансовых событий — оправдано. Для «пользователь открыл экран» — нет.`}
]}
]},

{id:"b7",icon:"🔀",title:"Асинхронные паттерны",tag:"архитектура",color:"purple",
desc:"Saga, Outbox, Event Sourcing, Claim Check, Backpressure, идемпотентный консьюмер. Здесь начинается уровень сеньора.",
topics:[
{id:"7-1",title:"Saga — распределённая транзакция",
theory:`<p><b>Проблема.</b> В монолите «выдать займ» — одна транзакция БД: не получилось на третьем шаге, откатили всё. В микросервисах данные в разных базах, общей транзакции не существует. Как откатить то, что уже закоммичено в чужом сервисе?</p>
<p><b>Ответ Saga:</b> никак не откатить — но можно выполнить <b>компенсирующее действие</b>. Не «отменить списание», а «сделать возврат». Не «удалить заявку», а «перевести в статус отменённой».</p>
`+D.saga+`
<h4>Два стиля</h4>
<table>
<tr><th></th><th>Хореография</th><th>Оркестрация</th></tr>
<tr><td>Кто управляет</td><td>Никто — сервисы реагируют на события</td><td>Отдельный оркестратор</td></tr>
<tr><td>Связанность</td><td>Слабая</td><td>Выше — оркестратор знает всех</td></tr>
<tr><td>Видимость процесса</td><td>Размазана, трудно отследить</td><td>В одном месте, легко отладить</td></tr>
<tr><td>Точка отказа</td><td>Нет единой</td><td>Оркестратор</td></tr>
<tr><td>Когда выбирать</td><td>2-3 шага, простая логика</td><td>4+ шагов, сложные компенсации, деньги</td></tr>
</table>
<div class="co mem"><span class="co-i">🧠</span><span><b>Как запомнить разницу:</b> хореография — <b>танцоры</b> знают музыку и танцуют сами, дирижёра нет. Оркестрация — есть <b>дирижёр</b>, который показывает, кому когда вступать. В финтехе для денег почти всегда берут дирижёра: когда что-то пошло не так, нужно точно знать, на каком шаге и что компенсировать.</span></div>
<div class="co warn"><span class="co-i">⚠️</span><span>Saga не даёт изоляции (буква I в ACID). В середине саги система находится в промежуточном состоянии: деньги уже зарезервированы, но займ ещё не выдан. Другой процесс может это увидеть. Лечится семантическими блокировками — статусом PENDING, который бизнес-логика обязана учитывать.</span></div>`,
prac:"Опиши сагу «выдача займа» из 4 шагов и напиши компенсацию для каждого. Проверь себя каверзным вопросом: что делать, если компенсация тоже упала? (Ответ: компенсации должны быть идемпотентными и ретраиться до успеха, а на крайний случай — алерт человеку.)",
questions:[
{q:"Что такое Saga и зачем она нужна?",
short:"Это способ провести бизнес-транзакцию через несколько сервисов, когда общей транзакции БД нет. Сага — цепочка локальных транзакций, где на каждый шаг заранее описано компенсирующее действие для отката.",
long:`<b>Пример на выдаче займа:</b><br>Шаг 1 — создать заявку (компенсация: пометить отменённой)<br>Шаг 2 — зарезервировать средства (компенсация: снять резерв)<br>Шаг 3 — проверить скоринг (компенсация не нужна, ничего не меняет)<br>Шаг 4 — выдать деньги (компенсация: возврат)<br><br>Упал шаг 3 — идём назад: снимаем резерв, отменяем заявку.<br><br><b>Три правила, которые отличают хороший ответ:</b><br>1. <b>Компенсация — не откат.</b> Это новая бизнес-операция со своим следом в истории. Клиент увидит и списание, и возврат, а не «ничего не было».<br>2. <b>Компенсации идемпотентны.</b> Их придётся ретраить, и повторный вызов не должен вернуть деньги дважды.<br>3. <b>Не всё компенсируется.</b> Отправленное клиенту SMS не отзовёшь. Такие необратимые шаги ставят в конец саги.<br><br><b>Что спросят следом:</b> «а если компенсация упала?» — она ретраится с backoff, а после N попыток создаётся инцидент для ручного разбора. В финансах молча проглотить такое нельзя.`},
{q:"Хореография или оркестрация — что выбрать?",
short:"Хореография для простых цепочек из 2-3 шагов со слабой связанностью. Оркестрация — когда шагов много, компенсации сложные и нужно видеть состояние процесса целиком. Для финансовых операций обычно оркестрация.",
long:`<b>Хореография.</b> Сервис публикует событие, другие сами решают, реагировать ли. Никто не знает всей картины.<br>Плюс: добавить нового участника легко — просто подписался.<br>Минус: чтобы понять, почему процесс завис, приходится собирать логи из пяти сервисов. Риск циклов: сервис A породил событие, на которое реагирует B, а его событие снова триггерит A.<br><br><b>Оркестрация.</b> Есть Saga Orchestrator — часто реализованный как машина состояний. Он вызывает шаги, хранит текущее состояние саги в своей БД, при сбое запускает компенсации.<br>Плюс: всё видно в одном месте, легко строить мониторинг «сколько саг зависло на шаге 3».<br>Минус: оркестратор нужно самому делать отказоустойчивым, он знает про все сервисы.<br><br><b>Практический критерий:</b> задайте вопрос — «смогу ли я в 3 часа ночи по алерту быстро понять, где застрял процесс?». Если процесс длинный и денежный, ответ «да» будет только с оркестрацией.<br><br><b>Инструменты оркестрации:</b> Camunda, Temporal, или собственная state machine на таблице с состояниями саги.`}
]},
{id:"7-2",title:"Outbox и идемпотентный консьюмер",
theory:`<p><b>Проблема двойной записи.</b> Сервис должен сделать две вещи: записать в свою БД и опубликовать событие в Kafka. Это два разных хранилища, общей транзакции нет.</p>
<ul>
<li>Записали в БД → упали → событие не ушло. Другие сервисы не знают об изменении. <b>Рассинхрон.</b></li>
<li>Опубликовали событие → упали до записи в БД. Все узнали о том, чего не произошло. <b>Ещё хуже.</b></li>
</ul>
`+D.outbox+`
<h4>Как работает Outbox</h4>
<ol>
<li>В одной транзакции БД пишем и бизнес-данные, и строку в таблицу <code>outbox</code> со статусом <code>new</code></li>
<li>Транзакция закоммитилась — либо есть и то и другое, либо ничего. Атомарно.</li>
<li>Отдельный процесс (поллер или Debezium через CDC) читает <code>outbox where status='new'</code></li>
<li>Публикует в Kafka, помечает <code>sent</code></li>
</ol>
<div class="co mem"><span class="co-i">🧠</span><span><b>Метафора Outbox:</b> это лоток «на отправку» на столе. Вы не бежите на почту сами посреди работы — вы кладёте письмо в лоток (одним движением с основной работой). Курьер приходит и забирает. Ушли домой, не отправив — курьер заберёт завтра, письмо не потеряется.</span></div>
<h4>Идемпотентный консьюмер</h4>
<p>Раз Outbox даёт <b>at-least-once</b>, дубли неизбежны: поллер опубликовал, но не успел проставить <code>sent</code> — отправит ещё раз. Значит получатель обязан уметь распознавать повтор.</p>
<ol>
<li>У каждого события уникальный <code>event_id</code>, который генерирует продюсер</li>
<li>Консьюмер перед обработкой проверяет: <code>SELECT 1 FROM processed_events WHERE event_id = ?</code></li>
<li>Уже есть — подтверждаем и молча пропускаем</li>
<li>Нет — обрабатываем <b>и записываем event_id в той же транзакции</b>, что и бизнес-изменение</li>
</ol>
<div class="co fin"><span class="co-i">🏦</span><span>Почему шаг 4 критичен: если записать event_id отдельной транзакцией, останется окно, в котором бизнес-операция прошла, а отметка не записалась. Дубль «клиент внёс 5000 ₽» уменьшит долг дважды. Такие баги находит аудит, и это самый неприятный класс дефектов в финтехе.</span></div>`,
prac:"Спроектируй таблицу outbox: какие поля нужны? Минимум: id, aggregate_type, aggregate_id, event_type, payload, created_at, status, attempts. Подумай, зачем нужны attempts и что делать, когда их станет больше 5.",
questions:[
{q:"Что такое Outbox pattern и какую проблему он решает?",
short:"Решает проблему двойной записи: нельзя атомарно записать в БД и отправить событие в брокер. Outbox пишет событие в ту же БД в одной транзакции с данными, а отдельный процесс потом публикует его в Kafka.",
long:`<b>Почему нельзя просто «записать в БД, потом отправить».</b> Между этими действиями сервис может упасть, под ним может исчезнуть сеть, брокер может быть недоступен. Любой из этих случаев даёт рассинхрон между сервисами, который потом обнаруживается сверкой через неделю.<br><br><b>Механика Outbox:</b> событие становится частью той же транзакции, что и данные. Если транзакция откатилась — нет ни данных, ни события. Если прошла — гарантированно есть оба.<br><br><b>Две реализации отправителя:</b><br>1. <b>Polling publisher</b> — фоновый процесс раз в N секунд читает записи со статусом new. Просто, но создаёт нагрузку опросами и добавляет задержку.<br>2. <b>CDC (Change Data Capture)</b> — Debezium читает журнал транзакций БД (WAL в PostgreSQL) и публикует изменения в Kafka. Нет опросов, задержка минимальная, но сложнее в эксплуатации.<br><br><b>Обратная сторона — Inbox pattern.</b> На принимающей стороне таблица обработанных событий, чтобы отсекать дубли. Outbox и Inbox вместе дают надёжную доставку между сервисами.<br><br><b>Что важно сказать в конце:</b> Outbox гарантирует at-least-once, но не exactly-once. Exactly-once достигается только вместе с идемпотентным потребителем.`},
{q:"Что такое идемпотентный консьюмер и как его сделать?",
short:"Это потребитель, который безопасно переживает повторную доставку одного и того же сообщения. Реализуется через уникальный event_id: перед обработкой проверяем таблицу обработанных событий, а отметку пишем в той же транзакции, что и бизнес-изменение.",
long:`<b>Почему это не опция, а обязанность.</b> Все распространённые брокеры дают at-least-once. Дубль возникает штатно: консьюмер обработал сообщение, но упал до коммита offset — при перезапуске получит его снова.<br><br><b>Три способа обеспечить идемпотентность:</b><br><br>1. <b>Таблица обработанных событий.</b> Универсально. Ключ — event_id, есть TTL на очистку старых записей. Обязательно в одной транзакции с бизнес-операцией.<br><br>2. <b>Естественная идемпотентность операции.</b> «Установить статус = CLOSED» можно выполнить сто раз — результат один. А вот «уменьшить долг на 5000» — нет. Иногда достаточно переформулировать операцию из дельты в абсолютное значение.<br><br>3. <b>Уникальный индекс в БД.</b> Вставка платежа с уникальным ключом по (external_payment_id). Повтор упадёт на constraint — ловим ошибку и считаем успехом.<br><br><b>Частая ошибка на собесе:</b> сказать «проверю есть ли такая запись, если нет — вставлю». Между проверкой и вставкой два параллельных консьюмера могут пройти проверку одновременно. Нужен либо уникальный индекс, либо блокировка, либо upsert.`}
]},
{id:"7-3",title:"Event Sourcing, Claim Check, Backpressure",
theory:`<h4>Event Sourcing</h4>
<p><b>На пальцах:</b> обычная БД хранит <b>итог</b> — «на счету 15 000 ₽». Event Sourcing хранит <b>всю выписку</b> — все поступления и списания, а баланс вычисляется прокруткой событий. Как банковская выписка против цифры на карте.</p>
<p>Плюсы: полная история для аудита (в банке — требование регулятора), можно восстановить состояние на любой момент прошлого, легко строить новые проекции задним числом.</p>
<p>Минусы: сложно делать запросы «покажи всех должников с суммой больше X» — для этого строят отдельную read-модель (отсюда связка с CQRS). Плюс проблема версионирования событий: формат события менялся три раза за два года, а старые надо уметь читать.</p>
<h4>Claim Check — «номерок из гардероба»</h4>
<p><b>Проблема:</b> надо передать через брокер скан паспорта на 10 МБ или запись разговора. Гнать это через Kafka плохо: дефолтный лимит сообщения 1 МБ, увеличение лимита деградирует брокер для всех топиков.</p>
<p><b>Решение:</b> файл кладём в объектное хранилище (S3, MinIO), а в событие пишем только ссылку и метаданные. Получатель по ссылке забирает файл. Сдал пальто — получил номерок.</p>
<div class="co good"><span class="co-i">✅</span><span>Бонус Claim Check: у файла появляется собственный жизненный цикл. Персональные данные можно удалить по требованию 152-ФЗ, не трогая при этом лог событий, который нужен для аудита.</span></div>
<h4>Backpressure — защита от захлёбывания</h4>
<p>Продюсер пишет 10 000 событий в секунду, консьюмер переваривает 2 000. Что произойдёт? Без защиты — lag растёт бесконечно, память кончается, сервис падает.</p>
<ul>
<li><b>Kafka</b> — pull-модель уже даёт естественный backpressure: консьюмер берёт столько, сколько может. Регулируется <code>max.poll.records</code></li>
<li><b>RabbitMQ</b> — <code>prefetch</code> ограничивает число неподтверждённых сообщений на консьюмера</li>
<li><b>Масштабирование</b> — добавить консьюмеров (но в Kafka не больше числа партиций)</li>
<li><b>Rate limiting на продюсере</b> — ограничить источник</li>
<li><b>Осознанная деградация</b> — приоритетные события в быстрый топик, остальные в медленный</li>
</ul>
<div class="co mem"><span class="co-i">🧠</span><span><b>Метафора backpressure:</b> кассир в супермаркете. Push-модель — покупатели вываливают товары на ленту без остановки, кассир тонет. Pull-модель — кассир сам берёт следующий товар, когда пробил предыдущий. Kafka работает как второй вариант, поэтому её сложнее «залить».</span></div>`,
prac:"Придумай, как передать через Kafka событие «завершён звонок» с записью разговора на 15 МБ. Опиши структуру события. Подсказка: в событии должны быть call_id, длительность, результат, и ссылка на файл в S3 — но не сам файл.",
questions:[
{q:"Что такое Event Sourcing?",
short:"Подход, при котором хранится не текущее состояние объекта, а полная последовательность событий, которая к нему привела. Текущее состояние получается прокруткой событий. Даёт полный аудит и возможность восстановить состояние на любой момент.",
long:`<b>Ключевое отличие от обычного подхода.</b> В классической модели UPDATE затирает предыдущее значение — история теряется. В Event Sourcing запись только добавляется, ничего не изменяется и не удаляется.<br><br><b>Почему это ценно в финтехе:</b><br>— регулятор может запросить, как формировалась сумма долга на конкретную дату два года назад<br>— спор с клиентом: показываем всю цепочку событий, а не итоговую цифру<br>— баг в расчёте нашли через месяц: исправили логику и пересчитали проекцию с нуля, исходные события целы<br><br><b>Практические сложности, о которых стоит сказать:</b><br>1. <b>Производительность чтения.</b> Проигрывать 100 000 событий на каждый запрос нельзя. Делают <b>снапшоты</b> — снимок состояния каждые N событий, дальше догоняют только свежие.<br>2. <b>Версионирование схемы событий.</b> Через год формат события изменился, а старые события в логе остались в прежнем виде. Нужен upcasting — преобразование старых версий при чтении.<br>3. <b>Запросы.</b> «Все клиенты с долгом > 100 000» по событиям не сделать. Нужна отдельная read-модель, обновляемая из потока событий — то есть CQRS.<br><br><b>Честный вывод:</b> Event Sourcing уместен там, где история сама по себе является ценностью. Для справочника адресов это лишняя сложность.`},
{q:"Продюсер быстрее консьюмера. Что делать?",
short:"Сначала смотрю характер роста lag: всплеск или системное отставание. Дальше по порядку — масштабирую консьюмеров в пределах числа партиций, оптимизирую обработку, при необходимости увеличиваю партиции или ввожу приоритезацию потоков.",
long:`Пошаговый разбор, который хорошо звучит на собесе:<br><br><b>1. Диагностика.</b> Пилообразный lag с возвратом к нулю — пиковая нагрузка, система справляется. Линейный рост — системная нехватка мощности. Рост только на одной партиции — hot partition из-за неудачного ключа.<br><br><b>2. Горизонтальное масштабирование.</b> Добавляем инстансы консьюмера в группу. Упираемся в потолок: консьюмеров не может быть больше, чем партиций. Если партиций 3, четвёртый инстанс просто простаивает.<br><br><b>3. Увеличение партиций.</b> Помогает, но осторожно: меняется раскладка по ключам, порядок для конкретной сущности может нарушиться на переходе.<br><br><b>4. Оптимизация самого консьюмера.</b> Часто дело не в объёме, а в том, что на каждое сообщение делается синхронный вызов внешнего API с таймаутом 2 секунды. Батчинг, кэширование справочников, вынос тяжёлых операций из горячего пути дают больше, чем железо.<br><br><b>5. Осознанная деградация.</b> Если пик кратковременный и по бизнесу приемлемо отставание в аналитике, но не в платежах — разводим потоки по разным топикам с разными приоритетами.<br><br><b>Что точно не надо делать:</b> отключать проверки и коммитить offset заранее, чтобы «график был красивый». Lag исчезнет, а данные потеряются.`},
{q:"Как передать большой файл через брокер сообщений?",
short:"Никак — файл кладём в объектное хранилище (S3, MinIO), а в сообщение помещаем только ссылку и метаданные. Это паттерн Claim Check. Брокер не предназначен для больших бинарных данных.",
long:`<b>Почему нельзя просто увеличить лимит сообщения.</b> В Kafka <code>message.max.bytes</code> по умолчанию 1 МБ. Подняв его до 20 МБ, вы:<br>— увеличиваете нагрузку на память брокера и всех консьюмеров<br>— раздуваете лог, retention начинает съедать диск в разы быстрее<br>— замедляете <b>все</b> топики на этих брокерах, не только свой<br>— рискуете ребалансировкой из-за долгой передачи батчей<br><br><b>Как выглядит правильное событие:</b><br><code>{"event_id": "...", "call_id": 88123, "duration_sec": 184, "result": "PROMISE_TO_PAY", "recording": {"bucket": "calls", "key": "2025/07/88123.mp3", "size": 15728640, "checksum": "sha256:..."}}</code><br><br>Событие весит меньше килобайта, а файл лежит там, где для файлов и место.<br><br><b>Дополнительные плюсы, которые ценят на собесе:</b><br>— <b>Комплаенс.</b> Запись разговора — персональные данные. По 152-ФЗ клиент может потребовать удаления. Удалить объект из S3 легко, вычистить сообщение из середины лога Kafka — практически нет.<br>— <b>Права доступа.</b> Ссылку можно выдавать как presigned URL с ограниченным временем жизни, а не раздавать файл всем подписчикам топика.`}
]}
]},

{id:"b8",icon:"🏗️",title:"System Design",tag:"senior",color:"rose",
desc:"Алгоритм design-интервью, кэш, балансировка, CAP, шардирование, Circuit Breaker — с интерактивными схемами.",
topics:[
{id:"8-1",title:"Алгоритм design-интервью",
theory:`<p>Формат почти всегда один и тот же. Именно следование алгоритму показывает уровень — не «правильный ответ», которого не существует.</p>
<ol>
<li><b>Уточнить требования — 5 минут.</b> Не рисовать сразу! Сколько пользователей, какой RPS, что критичнее — консистентность или доступность, нужна ли история, какие устройства, есть ли регуляторные ограничения.</li>
<li><b>Прикинуть масштаб на салфетке — 2 минуты.</b> 10 млн пользователей × 5 действий в день ÷ 86 400 ≈ 580 RPS в среднем, пик ×3 ≈ 1 700 RPS.</li>
<li><b>Верхнеуровневая схема — 10 минут.</b> Клиент → балансировщик → API Gateway → сервисы → БД / кэш / очередь.</li>
<li><b>Углубиться в 1-2 узких места — 15 минут.</b> Обычно это хранилище и самый нагруженный путь.</li>
<li><b>Отказоустойчивость и эксплуатация — 5 минут.</b> Что упадёт первым, как мониторим, что при росте нагрузки в 10 раз.</li>
</ol>
<div class="co mem"><span class="co-i">🧠</span><span><b>Мнемоника этапов — «ТОСУЭ»:</b> <b>Т</b>ребования → <b>О</b>ценка масштаба → <b>С</b>хема → <b>У</b>глубление → <b>Э</b>ксплуатация. Если растеряешься на интервью, просто проговори эти пять слов вслух — интервьюер поймёт, что вы работаете по структуре.</span></div>
<div class="co tip"><span class="co-i">💡</span><span>Формула сильного ответа: <b>«Я выбираю X, потому что <i>бизнес-причина</i>. Плачу за это <i>компромисс</i>. Если бы <i>условие изменилось</i>, выбрал бы Y».</b> Именно эта конструкция отличает сеньора от мидла — не знание технологий, а умение проговорить цену решения.</span></div>
<div class="co warn"><span class="co-i">⚠️</span><span>Самая частая ошибка — начать рисовать квадратики через 10 секунд после условия задачи. Это сразу читается как «не работал с реальными требованиями». Даже если решение в голове готово, вопросы задать надо.</span></div>`,
prac:"Поставь таймер на 20 минут и вслух (обязательно вслух, не про себя) спроектируй систему уведомлений для 5 млн клиентов. Запиши себя на диктофон и переслушай. Услышишь всё: паузы, слова-паразиты, места где сам не понимаешь что говоришь. Это самое эффективное упражнение перед design-интервью.",
questions:[
{q:"Как вы подходите к задаче на System Design?",
short:"По пяти шагам: уточняю требования и ограничения, прикидываю масштаб, рисую верхнеуровневую схему, углубляюсь в узкие места, обсуждаю отказоустойчивость и мониторинг. Все решения проговариваю через trade-off.",
long:`<b>Какие вопросы задать в первые 5 минут</b> — это половина оценки:<br><br><b>Про масштаб:</b> сколько пользователей, какой RPS в пике, какой объём данных и как быстро растёт, соотношение чтения к записи.<br><b>Про требования:</b> что критичнее — не потерять данные или всегда отвечать? Какая допустимая задержка? Нужна ли история?<br><b>Про контекст:</b> это новая система или дорабатываем существующую? Есть ли ограничения по стеку? Регуляторные требования?<br><br><b>Пример trade-off, который стоит проговорить:</b> «Для баланса счёта выбираю сильную консистентность — при разрыве сети лучше ответить ошибкой, чем показать неверную сумму. Плачу доступностью: в момент партиции часть запросов не обслужится. Для ленты уведомлений выбрал бы наоборот».<br><br><b>Что делать, если понял на середине, что пошёл не туда:</b> сказать вслух. «Я заложил синхронный вызов, но при таком RPS он станет узким местом — давайте переделаю на асинхронную обработку через очередь». Это плюс, а не минус: интервьюер видит способность к самокоррекции.`}
]},
{id:"8-2",title:"Кэширование — интерактивно",
theory:`<p><b>На пальцах:</b> кэш — это записка на холодильнике. Вместо того чтобы каждый раз лезть в шкаф проверять, есть ли молоко, вы один раз посмотрели и записали. Быстро. Но если кто-то выпил молоко, а записку не обновил — вы будете уверены в неправде. Это и есть проблема инвалидации.</p>
`+D.cache+`
<h4>Три стратегии</h4>
<table>
<tr><th>Стратегия</th><th>Как работает</th><th>Плюс</th><th>Минус</th></tr>
<tr><td><b>Cache-aside</b></td><td>Приложение само: смотрит кэш → промах → БД → кладёт в кэш</td><td>Гибко, самая частая</td><td>Первый запрос медленный</td></tr>
<tr><td><b>Write-through</b></td><td>Пишем сразу и в кэш, и в БД</td><td>Кэш всегда актуален</td><td>Запись медленнее</td></tr>
<tr><td><b>Write-behind</b></td><td>Пишем в кэш, в БД асинхронно</td><td>Очень быстрая запись</td><td>Риск потери при падении</td></tr>
</table>
<h4>Инвалидация — самая сложная часть</h4>
<ul>
<li><b>TTL</b> — данные живут N секунд и протухают сами. Просто, но до истечения TTL отдаём устаревшее</li>
<li><b>Событийная инвалидация</b> — изменились данные → удалили ключ из кэша. Точно, но надо не забыть все места изменения</li>
<li><b>Версионирование ключа</b> — ключ содержит версию: <code>client:777:v12</code>. Изменились данные — версия выросла, старый ключ просто перестал запрашиваться</li>
</ul>
<div class="co warn"><span class="co-i">⚠️</span><span><b>Три классические проблемы кэша — спрашивают на сеньорских собесах:</b><br><br><b>Cache stampede (лавина).</b> Популярный ключ протух, и тысяча запросов одновременно ломанулась в БД. Лечится блокировкой на пересчёт или вероятностным ранним обновлением.<br><br><b>Cache penetration.</b> Запрашивают несуществующий ключ — кэш всегда промахивается, вся нагрузка идёт в БД. Лечится кэшированием отрицательного результата на короткий TTL.<br><br><b>Cache avalanche.</b> Много ключей с одинаковым TTL протухли одновременно. Лечится добавлением случайного разброса к TTL.</span></div>`,
prac:"Посчитай выгоду от кэша. Пусть 80% запросов попадают в кэш (1 мс), 20% идут в БД (80 мс). Среднее время: 0,8×1 + 0,2×80 = 16,8 мс вместо 80 мс. Ускорение почти в 5 раз. Теперь посчитай для hit rate 50% — увидишь, что кэш с низким попаданием почти бесполезен.",
questions:[
{q:"Какие стратегии кэширования знаете?",
short:"Cache-aside — приложение проверяет кэш, при промахе идёт в БД и записывает результат. Write-through — пишем синхронно в кэш и БД. Write-behind — в кэш сразу, в БД асинхронно. Чаще всего используют cache-aside.",
long:`<b>Cache-aside (lazy loading)</b> — стандарт де-факто. Логика в приложении, кэш ничего не знает о БД. Плюс: кэшируем только то, что реально запрашивают. Минус: первый запрос всегда медленный (cold start), и есть окно рассогласования между БД и кэшем.<br><br><b>Write-through</b> — запись идёт через кэш в БД синхронно. Кэш всегда консистентен с БД. Минус: платим за это скоростью записи, и кэшируем данные, которые могут никогда не понадобиться.<br><br><b>Write-behind (write-back)</b> — запись в кэш, а в БД пачкой асинхронно. Очень быстро, отлично для счётчиков и метрик. Но при падении узла несохранённые данные теряются. Для денег недопустимо, для счётчика просмотров — нормально.<br><br><b>Отдельно про вытеснение (eviction):</b> когда кэш заполнен, надо что-то удалять. <b>LRU</b> — вытесняем то, к чему дольше всего не обращались (самая частая политика). <b>LFU</b> — то, к чему реже обращаются. <b>TTL</b> — просто по времени.<br><br><b>Что кэшировать в системе взыскания:</b> справочники (регионы, типы задолженности) — с длинным TTL, они почти не меняются. Профиль клиента — короткий TTL. Баланс долга — не кэшировать вообще или инвалидировать по событию платежа.`},
{q:"Как инвалидировать кэш при изменении данных?",
short:"Три подхода: TTL — данные протухают по времени, просто но неточно. Событийная инвалидация — при изменении удаляем ключ, точно но легко забыть место. Версионирование ключа — меняем версию в имени ключа, старый просто перестаёт использоваться.",
long:`Известная шутка про две сложные задачи в программировании — именование и инвалидация кэша — не шутка, а точное описание.<br><br><b>Почему это сложно:</b> данные меняются в одном месте, а закэшированы могут быть в пяти разных представлениях. Изменили телефон клиента — надо инвалидировать и профиль клиента, и список контактов, и карточку в поиске.<br><br><b>Практичное решение — инвалидация по событию через брокер.</b> Сервис меняет данные и публикует событие <code>client.updated</code>. Все, кто кэширует эти данные, подписаны и чистят свои ключи. Не нужно, чтобы сервис-источник знал про всех потребителей.<br><br><b>Компромисс, который часто выбирают в реальности:</b> короткий TTL (30-60 секунд) для данных, где небольшая устаревшесть терпима. Это не идеально, но радикально проще в поддержке, чем полная событийная инвалидация. Главное — осознанно решить, где терпима, а где нет.<br><br><b>Где точно не терпима:</b> остаток долга, лимиты по 230-ФЗ (количество звонков), права доступа. Эти вещи либо не кэшируем, либо инвалидируем строго по событию.`}
]},
{id:"8-3",title:"Балансировка, CAP, шардирование",
theory:D.lb+`
<h4>Алгоритмы балансировки</h4>
<ul>
<li><b>Round Robin</b> — по кругу. Просто, но не учитывает разную мощность серверов</li>
<li><b>Weighted RR</b> — с весами: мощный сервер получает больше запросов</li>
<li><b>Least Connections</b> — тому, у кого меньше активных соединений. Хорошо при разной длительности запросов</li>
<li><b>Consistent Hashing</b> — один и тот же ключ всегда на один сервер. Нужно для sticky-сессий и распределённого кэша</li>
</ul>
<p><b>L4 против L7:</b> балансировщик четвёртого уровня видит только IP и порт — быстрый, но глупый. Седьмого уровня понимает HTTP: может маршрутизировать по URL, заголовкам, cookie — умнее, но дороже по ресурсам.</p>
<h4>CAP-теорема</h4>
<p><b>На пальцах:</b> два узла системы, между ними оборвалась связь (это Partition, и в реальной сети он неизбежен). Клиент пишет на первый узел. Второй об этом не знает. Приходит запрос на чтение ко второму узлу. Что делать?</p>
<ul>
<li>Отдать старые данные — выбрали <b>доступность (A)</b></li>
<li>Отказать «не могу гарантировать актуальность» — выбрали <b>консистентность (C)</b></li>
</ul>
<div class="co mem"><span class="co-i">🧠</span><span><b>Как запомнить выбор:</b> задай вопрос — «что хуже: показать неверные данные или не показать ничего?». Для баланса счёта хуже неверные — берём <b>C</b>. Для ленты новостей хуже пустой экран — берём <b>A</b>.</span></div>
`+D.shard+`
<div class="co warn"><span class="co-i">⚠️</span><span><b>Про выбор ключа шардирования.</b> Шардировать по дате — классическая ошибка: вся запись сегодняшнего дня летит в один шард, остальные простаивают. Хороший ключ имеет высокую кардинальность и равномерное распределение: client_id, hash от него, UUID.</span></div>`,
prac:"Тренажёр CAP: для каждой системы реши, что выбрать — C или A. 1) Баланс карты. 2) Количество лайков под постом. 3) Остаток товара на складе при оформлении заказа. 4) История звонков в CRM. Проверь свою логику: везде ли ты объяснил через «что хуже — ошибка или отказ»?",
questions:[
{q:"Объясните CAP-теорему.",
short:"В распределённой системе при разрыве сети нельзя одновременно сохранить консистентность и доступность — приходится выбирать. Разрыв сети неизбежен, поэтому реальный выбор всегда между C и A. Для денег выбирают C, для контента — A.",
long:`<b>Частая ошибка в ответе:</b> сказать «выбираем два из трёх». Это формально неверно. Partition tolerance — не опция, а данность: сети рвутся всегда. Так что выбор идёт между C и A <b>в момент разрыва</b>. В обычном режиме система может давать и то и другое.<br><br><b>Конкретный пример.</b> Два дата-центра, между ними пропала связь. Клиент снимает деньги в первом ДЦ. Второй ДЦ не видит этой операции.<br>— <b>CP-система</b> откажет в операции во втором ДЦ: «сервис временно недоступен». Денег не потеряем, но клиент недоволен.<br>— <b>AP-система</b> разрешит операцию в обоих ДЦ. Клиент снимет деньги дважды, а после восстановления связи получим конфликт, который придётся разруливать.<br><br><b>Уровни консистентности, о которых полезно знать:</b><br>— <b>Strong</b> — чтение всегда видит последнюю запись<br>— <b>Eventual</b> — рано или поздно все узлы сойдутся<br>— <b>Read-your-writes</b> — пользователь всегда видит свои изменения, чужие могут отставать. Хороший компромисс для UI<br><br><b>PACELC</b> — расширение CAP: если есть Partition, выбираем между A и C, а <b>Else</b> (в нормальном режиме) — между Latency и Consistency. Синхронная репликация даёт консистентность ценой задержки.`},
{q:"В чём разница шардирования и репликации?",
short:"Репликация — копии одних и тех же данных на разных узлах, масштабирует чтение и даёт отказоустойчивость. Шардирование — разные данные на разных узлах по ключу, масштабирует запись и объём. На практике используют оба вместе.",
long:`<b>Репликация решает две задачи:</b> отказоустойчивость (упал узел — есть копия) и масштабирование чтения (читаем с реплик, пишем в мастер).<br><br>Её главная проблема — <b>лаг репликации</b>. Записали в мастер, тут же прочитали с реплики — данных ещё нет. В интерфейсе это выглядит как «сохранил, обновил страницу — изменения пропали». Лечится чтением критичных данных с мастера или паттерном read-your-writes.<br><br><b>Шардирование решает другую задачу:</b> когда данные не помещаются на один сервер или запись упирается в потолок одного узла.<br><br>Его главные проблемы:<br>— <b>Запросы между шардами.</b> JOIN между данными в разных шардах либо невозможен, либо очень дорог. Приходится делать несколько запросов и собирать в приложении.<br>— <b>Транзакции между шардами.</b> Нужен двухфазный коммит или сага — сложно и медленно.<br>— <b>Решардинг.</b> Добавили четвёртый шард — hash % 3 превратился в hash % 4, и почти все данные надо переложить. Лечится consistent hashing или виртуальными шардами.<br><br><b>Как выглядит на проде:</b> 3 шарда, каждый реплицирован ×3 — итого 9 узлов. Шардирование даёт объём и запись, репликация внутри шарда — надёжность и чтение.`},
{q:"Что такое Circuit Breaker и как он работает?",
short:"Это предохранитель между сервисами. Считает ошибки, и после порога переходит в состояние OPEN — блокирует запросы к упавшему сервису, отвечая быстрой ошибкой. Через таймаут пробует один запрос и, если успешно, восстанавливает работу.",
long:`<b>Проблема, которую решает.</b> Сервис A вызывает сервис B, тот лежит и отвечает по таймауту 30 секунд. Каждый запрос к A занимает поток на 30 секунд. Через минуту все потоки A заняты ожиданием, и A перестаёт отвечать вообще — хотя сам исправен. Это <b>каскадный отказ</b>: падение одного сервиса тянет за собой остальные.<br><br><b>Три состояния:</b><br>— <b>CLOSED</b> — всё работает, считаем долю ошибок в скользящем окне<br>— <b>OPEN</b> — порог превышен, все вызовы отклоняем мгновенно, не нагружая B и не занимая свои потоки<br>— <b>HALF-OPEN</b> — после таймаута пропускаем один пробный запрос. Успех → CLOSED, провал → снова OPEN<br><br><b>Что настраивают:</b> порог ошибок (например, 50% за последние 20 запросов), длительность OPEN (30 секунд), минимальное число запросов для срабатывания — иначе 1 ошибка из 1 запроса даст 100%.<br><br><b>Обязательное дополнение — fallback.</b> Размыкание предохранителя не должно означать белый экран. Что показываем? Данные из кэша, урезанную функциональность, честное «сервис временно недоступен, попробуйте через минуту». Продумывание fallback — это работа аналитика, а не разработчика.<br><br><b>Рядом стоящие паттерны:</b> retry с экспоненциальной задержкой и jitter, timeout на каждый внешний вызов, bulkhead (изоляция пулов потоков, чтобы медленный сервис не съел ресурсы для быстрых).`}
]},
{id:"8-4",title:"Практика: система уведомлений",
theory:`<p>Разберём типовую задачу с интервью целиком: <b>«Спроектируйте систему уведомлений для 5 млн клиентов банка: SMS, push, звонки робота»</b>.</p>
<h4>Шаг 1. Уточняющие вопросы</h4>
<ul>
<li>Какие типы уведомлений — только про долг или все банковские?</li>
<li>Какая допустимая задержка? Секунды или минуты?</li>
<li>Нужна ли гарантия доставки и подтверждение прочтения?</li>
<li>Есть ли регуляторные ограничения на время и частоту? (для взыскания — да, 230-ФЗ)</li>
<li>Что важнее — не потерять уведомление или не отправить дубль?</li>
</ul>
<h4>Шаг 2. Оценка масштаба</h4>
<p>5 млн клиентов, пусть 10% получают уведомление в день = 500 тыс. в сутки. Но нагрузка неравномерна: пик в 9-10 утра, когда стартует дневной обзвон. Допустим, 40% суточного объёма за 2 часа: 200 000 / 7200 сек ≈ <b>28 сообщений в секунду в пике</b>. Это немного — значит узкое место не в нашей системе, а во внешних шлюзах и их лимитах.</p>
`+D.notify+`
<h4>Шаг 3. Ключевые решения и их цена</h4>
<table>
<tr><th>Решение</th><th>Почему</th><th>Цена</th></tr>
<tr><td>Kafka на входе</td><td>Развязать источник событий и отправку, пережить недоступность шлюзов</td><td>Задержка, сложность эксплуатации</td></tr>
<tr><td>Redis для дедупликации и лимитов</td><td>Проверка «уже слали сегодня?» должна быть за миллисекунды</td><td>Данные в памяти, нужен персист или пересчёт</td></tr>
<tr><td>PostgreSQL для журнала доставки</td><td>Нужен аудит: кому, когда, чем, с каким результатом</td><td>Растёт объём, нужна архивация</td></tr>
<tr><td>Каскад каналов push → SMS → звонок</td><td>Push бесплатен, SMS 2 ₽, звонок 8 ₽</td><td>Задержка на ожидание реакции</td></tr>
<tr><td>DLQ + ретраи</td><td>Шлюз может быть недоступен временно</td><td>Возможны дубли, нужна идемпотентность</td></tr>
</table>
<div class="co fin"><span class="co-i">🏦</span><span><b>Что покажет вас как человека из финтеха:</b> упомянуть на этапе требований, что для взыскания есть законодательные ограничения — время суток с учётом часового пояса клиента, лимит контактов в сутки/неделю/месяц. И заложить это в компонент Router как отдельную проверку до отправки, а не как костыль в адаптере.</span></div>`,
prac:"Спроектируй по этому же шаблону вторую систему: бэкенд робота-коллектора, который должен за день обзвонить 2 млн должников, распознать ответ и по результату либо зафиксировать обещание оплаты, либо эскалировать оператору. Обязательно посчитай RPS и найди узкое место (подсказка: оно в количестве одновременных телефонных линий, а не в вашем коде).",
questions:[
{q:"Как обеспечить, чтобы уведомление не отправилось дважды?",
short:"Каждому уведомлению присваиваем идемпотентный ключ на основе бизнес-смысла — например, client_id + тип + дата. Перед отправкой проверяем в Redis, был ли уже такой ключ. Плюс передаём idempotency key во внешний шлюз, если он поддерживает.",
long:`Дубли возникают на трёх уровнях, и защищаться надо на каждом.<br><br><b>1. Дубль события.</b> Kafka даёт at-least-once — событие «просрочка 5 дней» может прийти дважды. Защита: идемпотентный консьюмер с проверкой event_id.<br><br><b>2. Логический дубль.</b> Два разных события породили одно и то же уведомление — например, «просрочка выросла» и «наступил день напоминания». Защита: ключ дедупликации по бизнес-смыслу, а не по event_id. Например <code>notify:{client_id}:{type}:{date}</code> в Redis с TTL 24 часа. Ставим через <code>SET NX</code> — атомарно, без гонки.<br><br><b>3. Дубль при ретрае к шлюзу.</b> Отправили SMS, ответ не дошёл из-за таймаута. Отправлять снова? Защита: передаём свой уникальный message_id в шлюз — большинство провайдеров это поддерживают и не отправят повторно.<br><br><b>Важный вопрос, который стоит задать вслух на интервью:</b> «Что хуже для бизнеса — не отправить уведомление или отправить дубль?» Для маркетинговой рассылки хуже дубль (раздражает клиента). Для уведомления о списании — хуже не отправить. От ответа зависит, в какую сторону настраивать систему.`}
]}
]},

{id:"b9",icon:"🤖",title:"ML, LLM и AI-агенты",tag:"будущее",color:"purple",
desc:"Как работает ML и LLM на пальцах, как строится RAG, что такое AI-агенты и где это применимо в финтехе.",
topics:[
{id:"9-1",title:"ML — основы для аналитика",
theory:`<p><b>На пальцах.</b> Обычное программирование: человек пишет правила, программа применяет их к данным. Машинное обучение: человек даёт данные и правильные ответы, программа сама выводит правила.</p>
<div class="co ex"><span class="co-i">💡</span><span>Пример разницы. Правилами: «если просрочка > 30 дней И доход < 30к → отказать». Таких правил нужно сотни, и они устаревают. ML: показываем 100 000 исторических заявок с исходом «вернул / не вернул» — модель сама находит закономерности, включая те, о которых аналитик не догадался.</span></div>
<h4>Три типа обучения</h4>
<ul>
<li><b>Supervised (с учителем)</b> — есть размеченные данные: вход и правильный ответ. Скоринг, фрод-детекция, прогноз просрочки. 90% задач в финтехе — это оно.</li>
<li><b>Unsupervised (без учителя)</b> — разметки нет, модель ищет структуру сама. Кластеризация должников на группы со схожим поведением, поиск аномалий.</li>
<li><b>Reinforcement (с подкреплением)</b> — агент действует и получает награду. Оптимизация стратегии обзвона: какой канал и время дают лучший результат.</li>
</ul>
`+D.mlPipeline+`
<h4>Метрики — что важно понимать аналитику</h4>
<table>
<tr><th>Метрика</th><th>Смысл простыми словами</th><th>Когда критична</th></tr>
<tr><td><b>Accuracy</b></td><td>Доля правильных ответов от всех</td><td>Только при сбалансированных классах</td></tr>
<tr><td><b>Precision</b></td><td>Из тех, кого назвали мошенниками, сколько реально мошенники</td><td>Когда ложная тревога дорого стоит</td></tr>
<tr><td><b>Recall</b></td><td>Из всех реальных мошенников, скольких поймали</td><td>Когда пропустить хуже, чем перестраховаться</td></tr>
<tr><td><b>F1</b></td><td>Баланс precision и recall</td><td>Классы несбалансированы</td></tr>
<tr><td><b>ROC-AUC</b></td><td>Насколько модель в принципе умеет разделять классы</td><td>Сравнение моделей между собой</td></tr>
</table>
<div class="co warn"><span class="co-i">⚠️</span><span><b>Ловушка accuracy.</b> Мошенников среди транзакций 0,1%. Модель, которая всегда говорит «не мошенник», имеет accuracy 99,9% — и абсолютно бесполезна. Именно поэтому в финтехе смотрят на precision, recall и стоимость ошибки в деньгах, а не на accuracy.</span></div>
<div class="co mem"><span class="co-i">🧠</span><span><b>Как запомнить precision и recall:</b> <b>Precision</b> — «насколько точно бьём» (мало ложных тревог). <b>Recall</b> — «насколько полно ловим» (мало пропусков). Их всегда приходится балансировать: закрутили порог — precision вырос, recall упал.</span></div>`,
prac:"Для системы взыскания придумай 5 признаков (features) для модели «вероятность оплаты после звонка». Подсказка направления: история контактов, поведение по прошлым долгам, время суток, канал, сумма. Потом подумай, какие признаки использовать нельзя по закону (пол, возраст, национальность — дискриминация).",
questions:[
{q:"Что такое машинное обучение простыми словами?",
short:"Вместо того чтобы писать правила вручную, мы показываем программе много примеров с известными ответами, и она сама выводит закономерности. Дальше применяет их к новым данным.",
long:`<b>Аналогия для объяснения бизнесу:</b> представьте нового сотрудника в отделе взыскания. Вы не даёте ему свод из 500 правил. Вы сажаете его рядом с опытным коллегой на месяц. Он смотрит тысячу разговоров и постепенно начинает чувствовать, с кем какой тон сработает. Модель обучается так же — на примерах.<br><br><b>Где проходит граница применимости:</b><br>— <b>ML нужен</b>, когда правил слишком много, они меняются, и есть исторические данные с исходами.<br>— <b>ML не нужен</b>, когда правило одно и оно чёткое: «звонить не раньше 8 утра» — это код, а не модель.<br><br><b>Что важно знать аналитику, работающему с ML-командой:</b><br>1. Модель не даёт ответ «да/нет», она даёт <b>вероятность</b>. Где поставить порог отсечения — это бизнес-решение, а не техническое.<br>2. Модель деградирует со временем (data drift): поведение клиентов меняется, модель обученная на данных 2023 года хуже работает в 2025. Нужен мониторинг и переобучение.<br>3. Модель воспроизводит перекосы обучающих данных. Если исторически отказывали определённой группе — модель научится делать то же самое.`},
{q:"Что такое переобучение (overfitting)?",
short:"Модель слишком точно подстроилась под обучающие данные, включая их случайный шум. На обучении показывает отличный результат, а на новых данных работает плохо. Ловится разделением данных на train/validation/test.",
long:`<b>Аналогия:</b> студент, который вызубрил ответы к конкретным билетам, но не понял предмет. На знакомых вопросах отвечает идеально, на новой формулировке — теряется.<br><br><b>Как это выглядит на практике:</b> модель скоринга показала на обучающей выборке accuracy 98%, а на реальных заявках — 60%. Значит, она запомнила частные особенности обучающих данных, а не общую закономерность.<br><br><b>Как борются:</b><br>— <b>Разделение данных.</b> Train для обучения, validation для настройки, test — трогается один раз в самом конце.<br>— <b>Кросс-валидация.</b> Данные делят на K частей, обучают K раз, каждый раз на разных.<br>— <b>Регуляризация.</b> Штраф за излишнюю сложность модели.<br>— <b>Больше данных.</b> Часто самое действенное.<br><br><b>Особая ловушка в финтехе — утечка данных (data leakage).</b> В обучающую выборку случайно попал признак, которого в момент принятия решения ещё не существует. Например, «количество звонков коллектора» при прогнозе дефолта: звонки бывают только у тех, кто уже не платит. Модель покажет фантастическую точность и полностью развалится на проде.<br><br>Задача аналитика — задавать вопрос: <b>«а этот признак вообще известен на момент, когда мы принимаем решение?»</b> Это ровно тот вопрос, который часто спасает проект.`}
]},
{id:"9-2",title:"LLM и RAG — как это устроено",
theory:`<p><b>Как работает LLM на пальцах.</b> Модель обучена на огромном объёме текста и умеет ровно одно: предсказывать следующий кусочек текста (токен). Всё остальное — следствие. Она не «знает факты» и не «понимает» в человеческом смысле — она очень хорошо угадывает продолжение.</p>
<div class="co mem"><span class="co-i">🧠</span><span><b>Почему LLM галлюцинирует — теперь понятно.</b> Модель всегда предсказывает <i>правдоподобное</i> продолжение, а не <i>правдивое</i>. Если фактов нет, правдоподобное продолжение всё равно найдётся — оно будет складным и неверным. Это не баг, это устройство.</span></div>
<p><b>Механизм внимания (attention)</b> — то, что делает трансформер трансформером. Обрабатывая каждое слово, модель «смотрит» на все остальные слова и взвешивает, какие из них важны. Слово «банк» в предложении про кредит и в предложении про реку получит разное представление именно поэтому.</p>
<h4>Fine-tuning против RAG</h4>
<table>
<tr><th></th><th>Fine-tuning</th><th>RAG</th></tr>
<tr><td>Что делаем</td><td>Дообучаем модель на своих данных</td><td>Ищем документы и кладём в контекст</td></tr>
<tr><td>Стоимость</td><td>Высокая, нужны GPU и данные</td><td>Низкая</td></tr>
<tr><td>Обновление данных</td><td>Переобучение</td><td>Обновил индекс — готово</td></tr>
<tr><td>Ссылки на источник</td><td>Нет</td><td>Есть — можно показать документ</td></tr>
<tr><td>Когда выбирать</td><td>Нужен особый стиль или формат ответов</td><td>Нужны знания по своим документам</td></tr>
</table>
`+D.rag+`
<h4>RAG по шагам — что описывает аналитик в постановке</h4>
<p><b>Этап индексации (офлайн):</b></p>
<ol>
<li><b>Загрузка</b> — откуда берём документы, как часто обновляем, кто владелец источника</li>
<li><b>Chunking</b> — режем на куски 300-1000 токенов. Резать надо по смысловым границам (заголовки, абзацы), с перекрытием 10-20%, иначе ответ окажется разрезан пополам</li>
<li><b>Embeddings</b> — каждый кусок превращаем в вектор, кодирующий смысл</li>
<li><b>Запись в векторную БД</b> — вектор + исходный текст + метаданные (источник, дата, раздел, права доступа)</li>
</ol>
<p><b>Этап запроса (на каждый вопрос):</b></p>
<ol>
<li>Вопрос → тот же embedding → вектор</li>
<li><b>Retrieval</b> — ищем top-K ближайших кусков. Часто гибрид: векторный поиск + классический BM25 по ключевым словам</li>
<li><b>Re-ranking</b> — отдельная модель пересортировывает найденное, отсекает нерелевантное</li>
<li><b>Генерация</b> — промпт = инструкция + найденные куски + вопрос → ответ со ссылками</li>
</ol>
<div class="co warn"><span class="co-i">⚠️</span><span><b>Правило, которое надо запомнить:</b> если RAG отвечает плохо — в 90% случаев проблема в retrieval, а не в LLM. Прежде чем менять модель, залогируйте и посмотрите, <b>что именно</b> попало в контекст. Обычно там либо не те куски, либо нужный документ разрезан не в том месте.</span></div>`,
prac:"Спроектируй RAG для чат-бота по регламентам взыскания. Ответь на 5 вопросов: 1) Какие источники документов? 2) Как часто обновляем индекс? 3) Как режем документы (по разделам? по пунктам?)? 4) Что делать, если релевантных документов не нашлось? 5) Как разграничить доступ, чтобы оператор не увидел документы для юристов? Пятый вопрос — самый интересный и его чаще всего забывают.",
questions:[
{q:"Что такое RAG и зачем он нужен?",
short:"Retrieval Augmented Generation — перед ответом мы ищем в базе релевантные документы и кладём их в контекст модели. Так LLM отвечает по вашим актуальным данным со ссылками на источник, а не выдумывает.",
long:`<b>Проблема, которую решает.</b> LLM обучена на публичных данных до определённой даты. Она не знает ваших внутренних регламентов, свежих изменений в законе, текущих остатков по счетам. Спросите её — она уверенно ответит неправду.<br><br><b>Как решает.</b> Вопрос пользователя превращается в вектор, по нему находятся близкие по смыслу куски документов, они подставляются в промпт. Модель отвечает, опираясь на них.<br><br><b>Пример из взыскания:</b> оператор спрашивает «можно ли звонить клиенту в Иркутске в 21:00 по Москве?». RAG находит нужные пункты 230-ФЗ и внутреннего регламента, модель отвечает с учётом часового пояса и даёт ссылку на пункт документа. Оператор может проверить.<br><br><b>Три преимущества, важные для банка:</b><br>1. <b>Актуальность.</b> Изменился регламент — обновили индекс, ничего не переобучая.<br>2. <b>Проверяемость.</b> Ответ со ссылкой на документ. Регулятор или руководитель может проверить.<br>3. <b>Разграничение доступа.</b> Поиск можно фильтровать по правам пользователя — оператор не увидит юридические документы.<br><br><b>Что стоит добавить в конце:</b> RAG не отменяет проверку. Для критичных решений модель даёт черновик и ссылки, финальное решение — за человеком.`},
{q:"Как строится RAG-пайплайн?",
short:"Два этапа. Индексация: документы режутся на куски, каждый превращается в вектор и пишется в векторную БД с метаданными. Запрос: вопрос тоже становится вектором, находим ближайшие куски, отбираем лучшие и подставляем в промпт вместе с вопросом.",
long:`<b>Ключевое решение всего пайплайна — chunking.</b> Слишком мелкие куски теряют контекст (в кусок попало «не более 8 раз», а к чему относится — осталось в соседнем). Слишком крупные тащат в контекст мусор и размывают релевантность.<br><br>Практика: 300-1000 токенов, резать по структурным границам (заголовок, пункт, абзац), перекрытие 10-20% чтобы не разрывать мысль. Для юридических документов часто режут по пунктам — это естественная смысловая единица.<br><br><b>Про метаданные.</b> Это то, что аналитики обычно забывают, а без них система разваливается на проде. Каждому куску нужны: источник, дата версии, раздел, уровень доступа. Метаданные позволяют фильтровать поиск («только действующие редакции»), показывать ссылку на источник и разграничивать права.<br><br><b>Гибридный поиск.</b> Чистый векторный поиск плохо ищет точные совпадения — номера статей, коды ошибок, названия продуктов. Комбинация векторного поиска с классическим BM25 по ключевым словам работает заметно лучше.<br><br><b>Что обязательно описать в постановке:</b> поведение при отсутствии релевантных документов. Правильный ответ системы — «не нашёл информации по вашему вопросу, обратитесь к эксперту», а не выдуманный складный текст. Это отдельное требование, и его надо явно зафиксировать.`},
{q:"Что такое галлюцинации LLM и как с ними бороться?",
short:"Модель уверенно выдаёт правдоподобную, но неверную информацию. Причина в её устройстве — она предсказывает вероятное продолжение текста, а не проверяет факты. Борются через RAG, низкую temperature, structured output с валидацией и обязательную проверку человеком.",
long:`<b>Почему это происходит.</b> Модель не хранит базу фактов. Она хранит статистические закономерности языка. На вопрос «какой пункт закона регулирует X» она сгенерирует правдоподобно выглядящий номер пункта — потому что номера пунктов в её обучающих данных выглядят именно так.<br><br><b>Методы борьбы по эффективности:</b><br><br>1. <b>RAG</b> — самый действенный. Даём модели реальный текст документа, просим отвечать только по нему.<br>2. <b>Жёсткая инструкция в промпте:</b> «Отвечай ТОЛЬКО на основе предоставленных документов. Если информации нет — так и скажи». Работает не идеально, но заметно снижает выдумки.<br>3. <b>Temperature = 0</b> — модель выбирает наиболее вероятный вариант вместо случайного. Ответы стабильнее.<br>4. <b>Structured output</b> — просим ответ в JSON по схеме, валидируем программно. Что не прошло валидацию — не показываем пользователю.<br>5. <b>Ссылки на источники</b> — если модель обязана привести цитату из документа, выдумать сложнее, а пользователь может проверить.<br><br><b>Главный принцип для финтеха:</b> LLM не принимает решений, влияющих на деньги или права клиента. Она готовит черновик, находит документ, суммирует разговор. Финальное решение — правило в коде или человек. Это не осторожность ради осторожности, это требование объяснимости от регулятора.`}
]},
{id:"9-3",title:"AI-агенты — как они устроены",
theory:`<p><b>Чем агент отличается от обычного запроса к модели.</b> Обычный запрос — один шаг: вопрос → ответ из того, что модель помнит. Агент — цикл: получил задачу → подумал, что нужно → вызвал инструмент → посмотрел результат → подумал снова → ... → дал ответ.</p>
`+D.agent+`
<h4>Из чего состоит агент</h4>
<ul>
<li><b>LLM-ядро</b> — принимает решения, что делать дальше</li>
<li><b>Инструменты (tools)</b> — поиск, запрос к БД, вызов API, выполнение кода, чтение файлов</li>
<li><b>Память</b> — короткая (текущий диалог в контексте) и длинная (векторная БД с прошлым опытом)</li>
<li><b>Планировщик</b> — разбивает большую задачу на шаги</li>
</ul>
<h4>Tool calling — механика</h4>
<p>Модели описывают доступные инструменты в виде схемы: имя, назначение, параметры. Когда модель понимает, что нужен инструмент, она возвращает не текст, а структурированный вызов: <code>{"tool": "get_client_debt", "args": {"client_id": 777}}</code>. Приложение выполняет вызов, возвращает результат модели, и та продолжает рассуждение.</p>
<div class="co ex"><span class="co-i">🔎</span><span><b>Пример работы агента.</b> Задача: «Рассчитай пеню по займу 777 по актуальной ключевой ставке».<br>Шаг 1: агент понимает, что нужна ставка → вызывает поиск → получает 16%.<br>Шаг 2: нужны данные займа → вызывает запрос к БД → получает сумму и дни просрочки.<br>Шаг 3: считает → выполняет код.<br>Шаг 4: формирует ответ с обоснованием и источником ставки.<br><br>Обычный чат-бот на первом же шаге либо откажется, либо выдумает ставку.</span></div>
<h4>Фреймворки</h4>
<ul>
<li><b>LangChain / LangGraph</b> — самый распространённый, много готовых интеграций</li>
<li><b>AutoGen</b> — мультиагентные системы: несколько агентов обсуждают задачу между собой</li>
<li><b>CrewAI</b> — агенты с ролями, как команда: исследователь, аналитик, редактор</li>
<li><b>LlamaIndex</b> — фокус на RAG и работе с документами</li>
</ul>
<div class="co warn"><span class="co-i">⚠️</span><span><b>Главные риски агентов в проде:</b> зацикливание (агент бесконечно вызывает инструменты — нужен лимит шагов), стоимость (каждый шаг это запрос к модели, сложная задача = десятки долларов), непредсказуемость (агент может выбрать неожиданный инструмент). Поэтому в финтехе агентам дают инструменты <b>только на чтение</b>, а любое действие с деньгами требует подтверждения человеком.</span></div>`,
prac:"Опиши агента для помощи оператору взыскания. Какие 4 инструмента ему дать? Какие из них только на чтение, а какие меняют данные? Для меняющих — как организовать подтверждение человеком? Это ровно та постановка, которую сейчас пишут аналитики в банках.",
questions:[
{q:"Чем AI-агент отличается от обычного запроса к LLM?",
short:"Обычный запрос — один шаг: вопрос и ответ из памяти модели. Агент работает циклом: планирует, вызывает внешние инструменты, смотрит результат, корректирует план и повторяет, пока задача не решена.",
long:`<b>Разница на конкретной задаче:</b> «Проверь актуальную ключевую ставку ЦБ и рассчитай пеню по займу №777».<br><br><b>Обычная LLM:</b> либо честно откажется («у меня нет доступа к текущим данным»), либо выдумает ставку и посчитает по ней — что хуже, потому что выглядит убедительно.<br><br><b>Агент:</b> понимает, что ему не хватает двух вещей. Вызывает поиск — получает ставку. Вызывает запрос к БД — получает параметры займа. Выполняет расчёт кодом, а не «в уме» (это важно, LLM плохо считает). Возвращает результат с указанием источников.<br><br><b>Что делает агента агентом:</b><br>1. <b>Доступ к инструментам</b> — может влиять на внешний мир и получать свежие данные<br>2. <b>Итеративность</b> — если результат инструмента не подошёл, попробует иначе<br>3. <b>Память</b> — помнит, что уже делал в рамках задачи<br><br><b>Обратная сторона:</b> непредсказуемость и стоимость. Агент может уйти в цикл или выбрать не тот инструмент. Поэтому обязательны лимит шагов, таймаут и логирование каждого вызова — для разбора инцидентов.`},
{q:"Как использовать AI в работе системного аналитика прямо сейчас?",
short:"Черновики постановок и user story, поиск противоречий и пропущенных сценариев в готовом ТЗ, генерация SQL по описанию, объяснение чужого кода и легаси-интеграций, суммаризация встреч. Везде — как черновик, финальная проверка за вами.",
long:`Конкретные приёмы, которые реально экономят время:<br><br><b>1. Ревью собственной постановки.</b> Самый недооценённый сценарий. Просите: «Найди в этом ТЗ неоднозначные формулировки и пропущенные сценарии ошибок». Модель регулярно находит незакрытые кейсы — что при таймауте, что при пустом ответе, что при дубле.<br><br><b>2. Генерация альтернативных сценариев.</b> «Перечисли 10 способов, которыми этот процесс может пойти не так». Отличная страховка от туннельного мышления.<br><br><b>3. SQL по описанию.</b> Описали задачу словами — получили запрос. Обязательно проверяйте логику: модель может написать синтаксически верный, но семантически неверный запрос.<br><br><b>4. Разбор легаси.</b> Дали WSDL или кусок XSD — попросили объяснить структуру и нарисовать таблицу полей. Экономит часы.<br><br><b>5. Разные аудитории.</b> «Перепиши это объяснение для бизнеса без технических терминов».<br><br><b>Где не стоит:</b> нельзя загружать в публичные сервисы персональные данные клиентов, внутренние документы под NDA и куски продакшн-кода. В банке это прямое нарушение. Используйте корпоративный контур или обезличивайте данные.`}
]},
{id:"9-4",title:"AI в финтехе: применения и риски",
theory:`<h4>Где AI реально работает в банке</h4>
<table>
<tr><th>Задача</th><th>Что делает</th><th>Тип модели</th></tr>
<tr><td><b>Кредитный скоринг</b></td><td>Оценка вероятности дефолта по сотням признаков</td><td>Градиентный бустинг</td></tr>
<tr><td><b>Фрод-мониторинг</b></td><td>Классификация транзакции в реальном времени, миллисекунды</td><td>Бустинг + правила</td></tr>
<tr><td><b>AML / 115-ФЗ</b></td><td>Поиск схем отмывания на графе транзакций</td><td>Графовые модели</td></tr>
<tr><td><b>Взыскание</b></td><td>Прогноз вероятности оплаты, выбор канала и времени контакта</td><td>Классификация + uplift</td></tr>
<tr><td><b>Речевая аналитика</b></td><td>Распознавание разговора, оценка тональности, контроль скриптов</td><td>ASR + NLP</td></tr>
<tr><td><b>Чат-боты и ассистенты</b></td><td>Ответы по регламентам, помощь оператору</td><td>LLM + RAG</td></tr>
</table>
<div class="co fin"><span class="co-i">🏦</span><span><b>Uplift-моделирование</b> — то, о чём мало кто знает, а во взыскании это ключевое. Обычная модель предсказывает «заплатит или нет». Uplift предсказывает <b>насколько звонок увеличит вероятность оплаты</b>. Разница принципиальная: есть клиенты, которые заплатят и без звонка (тратим деньги зря), и есть те, кого звонок только разозлит. Звонить надо тем, у кого звонок реально меняет исход.</span></div>
<h4>Риски и регулирование</h4>
<ul>
<li><b>Объяснимость.</b> Регулятор требует обосновать отказ в кредите. «Так решила нейросеть» — не ответ. Инструменты: SHAP, LIME — показывают вклад каждого признака в решение.</li>
<li><b>Дискриминация.</b> Модель не должна принимать решения на основе пола, возраста, национальности. Причём косвенно тоже: почтовый индекс может оказаться прокси для этничности.</li>
<li><b>Data drift.</b> Поведение клиентов меняется, модель устаревает. Нужен мониторинг качества на проде и регулярное переобучение.</li>
<li><b>Персональные данные.</b> 152-ФЗ: обучение на данных клиентов требует правовых оснований, обезличивания, ограничения срока хранения.</li>
</ul>
<div class="co mem"><span class="co-i">🧠</span><span><b>Что запомнить про роль аналитика в ML-проекте:</b> вы не строите модель. Вы отвечаете за три вещи — <b>какие признаки допустимы</b> (юридически и этически), <b>где стоит порог отсечения</b> (это бизнес-решение), и <b>что происходит, когда модель ошиблась</b> (процесс апелляции, ручной разбор).</span></div>`,
prac:"Опиши процесс апелляции для системы автоматического отказа в реструктуризации: клиенту отказала модель, он не согласен. Кто рассматривает? В какой срок? Что видит сотрудник — только решение или и факторы? Попадает ли результат апелляции обратно в обучающую выборку? Последний вопрос — самый важный и почти всегда забывается.",
questions:[
{q:"Что такое объяснимый AI и зачем он банку?",
short:"XAI — методы, показывающие, почему модель приняла такое решение: какие признаки и насколько повлияли. Банку нужен потому, что регулятор и клиент имеют право знать причину отказа, а «так решила модель» юридически не работает.",
long:`<b>Регуляторный контекст.</b> Клиент имеет право получить обоснование отказа. Внутренний аудит и ЦБ могут проверить, что модель не использует запрещённые признаки. В ЕС это закреплено в GDPR и AI Act, в России движется в ту же сторону.<br><br><b>Как работает SHAP</b> — самый распространённый метод. Он показывает вклад каждого признака в конкретное решение: «отказ на 40% обусловлен высоким показателем долг/доход, на 25% — тремя просрочками за год, на 15% — коротким стажем». Это уже можно показать клиенту и защитить перед аудитом.<br><br><b>Компромисс, который приходится делать.</b> Самые точные модели (глубокие сети, сложные ансамбли) хуже всего объясняются. Простые (логистическая регрессия, скоринговая карта) объясняются прекрасно, но точность ниже.<br><br>В кредитовании часто сознательно выбирают менее точную, но объяснимую модель — потому что стоимость регуляторного риска выше выигрыша в точности. Это классический архитектурный trade-off, и он хорошо звучит на собеседовании.<br><br><b>Задача аналитика:</b> в постановке на ML-сервис явно прописать требование — сервис возвращает не только решение, но и топ-N факторов, повлиявших на него, в формате, пригодном для показа человеку.`}
]}
]},

{id:"b10",icon:"🏦",title:"Финтех и блокчейн",tag:"специализация",color:"rose",
desc:"Специфика работы аналитика в банке, регуляторика, блокчейн и смарт-контракты.",
topics:[
{id:"10-1",title:"Специфика аналитика в банке",
theory:`<p>В финтехе к обычной работе аналитика добавляется слой, которого нет в продуктовых компаниях.</p>
<h4>Что добавляется</h4>
<ul>
<li><b>Регуляторика.</b> 115-ФЗ (противодействие отмыванию), 152-ФЗ (персональные данные), 230-ФЗ (взаимодействие с должниками), 161-ФЗ (платёжная система), положения ЦБ. Каждое требование проверяется на соответствие.</li>
<li><b>Аудит-трейл.</b> Каждое действие логируется: кто, когда, что было до и после. Это не «хорошо бы», это обязательно.</li>
<li><b>Идемпотентность операций с деньгами.</b> Платёж не должен пройти дважды ни при каких сетевых обстоятельствах.</li>
<li><b>Сверки.</b> Ежедневная сверка с внешними системами: наши данные и их данные должны сойтись до копейки. Расхождение — инцидент.</li>
<li><b>SLA и последствия простоя.</b> Downtime платёжного сервиса — это прямые потери и потенциальные санкции.</li>
</ul>
<div class="co fin"><span class="co-i">📜</span><span><b>230-ФЗ — то, что должен знать аналитик робота-коллектора наизусть:</b><br>— Время звонков: будни 8:00–22:00, выходные 9:00–20:00 <b>по местному времени должника</b> (отсюда требование хранить часовой пояс!)<br>— Частота телефонных переговоров: не более 1 раза в сутки, 2 в неделю, 8 в месяц<br>— Запрещены скрытые номера<br>— Должник вправе отказаться от взаимодействия — и система обязана это учитывать<br><br>Всё это должно быть заложено в архитектуру как проверка <b>до</b> отправки, а не как фильтр в отчёте постфактум.</span></div>
<div class="co mem"><span class="co-i">🧠</span><span><b>Мысль, которая пригодится на собесе в банк:</b> в продуктовой компании вопрос «а что если упадёт?» — про UX. В банке — про деньги, регулятора и уголовную ответственность. Поэтому в банковской постановке раздел «исключительные сценарии» обычно длиннее основного.</span></div>`,
prac:"Возьми любую свою фичу и прогони по чек-листу банка: 1) какие ПДн обрабатываются и есть ли основание? 2) что попадает в аудит-лог? 3) идемпотентна ли операция? 4) есть ли сверка? 5) какие регуляторные ограничения применимы? Если хоть на один вопрос нет ответа — постановка не готова.",
questions:[
{q:"Чем работа аналитика в банке отличается от продуктовой компании?",
short:"Добавляется слой регуляторных требований, обязательный аудит-трейл каждого действия, требование идемпотентности для операций с деньгами и ежедневные сверки. Раздел исключительных сценариев в постановке обычно объёмнее основного.",
long:`<b>Три главных отличия по сути:</b><br><br><b>1. Цена ошибки.</b> В продукте баг = плохой UX и потеря конверсии. В банке баг в расчёте = реальные деньги клиентов, предписание регулятора, репутационный ущерб. Отсюда несравнимо больше внимания к граничным случаям и повторной обработке.<br><br><b>2. Регуляторный контур.</b> Требование может прийти не от бизнеса, а от закона — и оно не обсуждается и не приоритизируется. Аналитик должен уметь читать нормативку и превращать её в требования к системе.<br><br><b>3. Процессы согласований.</b> Информационная безопасность, юристы, комплаенс, архитектурный комитет. Медленнее, чем в стартапе, — но это плата за то, что ошибка не уходит на миллионы клиентов.<br><br><b>Что даёт взамен:</b> масштаб задач и данных, зрелая инженерная культура, и — честно — более высокая и стабильная оплата.<br><br><b>Практический совет для собеседования в банк:</b> покажите, что вы думаете про сверки, аудит и идемпотентность до того, как вас спросят. Это моментально считывается как «человек работал с деньгами».`}
]},
{id:"10-2",title:"Блокчейн и смарт-контракты",
theory:`<p><b>На пальцах.</b> Блокчейн — это общая тетрадь учёта, копия которой есть у тысяч участников. Каждая новая страница содержит отпечаток (хэш) предыдущей. Чтобы подделать запись на странице 5, надо пересчитать отпечатки страниц 6, 7, 8... и сделать это быстрее, чем вся остальная сеть пишет новые. Практически невозможно.</p>
<h4>Ключевые понятия</h4>
<ul>
<li><b>Консенсус</b> — как участники договариваются, чья версия верна. <b>PoW</b> (Proof of Work): кто первый решил вычислительную задачу — Bitcoin, огромные затраты энергии. <b>PoS</b> (Proof of Stake): вес голоса зависит от заложенных монет — Ethereum, экономичнее.</li>
<li><b>Смарт-контракт</b> — программа в блокчейне, выполняющая условия автоматически. «Если на эскроу-счёт пришла сумма И подтверждена поставка → перевести продавцу». Без посредника и без возможности передумать.</li>
<li><b>Токены</b> — взаимозаменяемые (ERC-20, как монеты) и невзаимозаменяемые (NFT, уникальные объекты).</li>
<li><b>DeFi</b> — финансовые сервисы без банка: кредит под залог криптовалюты выдаётся автоматически смарт-контрактом, обмен идёт через алгоритмический пул ликвидности.</li>
</ul>
<div class="co warn"><span class="co-i">⚠️</span><span><b>Главный риск смарт-контракта:</b> его нельзя исправить после развёртывания. Ошибка в коде становится вечной. Известны случаи потери сотен миллионов долларов из-за одной строки. Поэтому аудит смарт-контрактов — отдельная дорогая индустрия, а требования к ним пишутся с точностью, близкой к авиационным стандартам.</span></div>
<div class="co mem"><span class="co-i">🧠</span><span><b>Где блокчейн реально даёт пользу, а где это хайп.</b> Польза там, где участники <b>не доверяют друг другу</b> и нет общего арбитра: международные расчёты между банками разных юрисдикций, цепочки поставок, регистры прав. Хайп — там, где есть один владелец системы: внутренний блокчейн одной компании технически бессмысленен, обычная БД с журналом дешевле и быстрее.</span></div>`,
prac:"Придумай сценарий, где блокчейн действительно уместен в работе банка, и обоснуй за 3 предложения. Потом придумай сценарий, где его предлагают, а он не нужен, и объясни почему обычная БД лучше. Второе упражнение важнее — умение отказаться от модной технологии ценится выше умения её применить.",
questions:[
{q:"Объясните блокчейн простыми словами.",
short:"Это распределённый журнал записей, копия которого хранится у множества участников. Каждый блок содержит хэш предыдущего, поэтому изменить старую запись незаметно невозможно — придётся пересчитать всю последующую цепочку быстрее всей сети.",
long:`<b>Метафора для объяснения бизнесу:</b> представьте общую тетрадь, которую одновременно ведут тысяча человек. Каждая новая страница начинается с контрольной суммы предыдущей. Если кто-то подчистил страницу 5, у всех остальных контрольные суммы перестают сходиться — подделка видна сразу.<br><br><b>Что даёт технически:</b><br>— <b>Неизменяемость.</b> Запись нельзя изменить задним числом.<br>— <b>Отсутствие центрального доверенного лица.</b> Не нужен посредник, которому все верят.<br>— <b>Прозрачность.</b> В публичных сетях все транзакции видны всем.<br><br><b>За что платим:</b><br>— <b>Скорость.</b> Bitcoin — около 7 транзакций в секунду, Visa — десятки тысяч.<br>— <b>Стоимость.</b> Каждая операция стоит комиссию.<br>— <b>Необратимость.</b> Ошиблись адресом — деньги ушли навсегда, отменить некому.<br><br><b>Ключевой вопрос при оценке любого блокчейн-проекта:</b> «Есть ли здесь стороны, которые не доверяют друг другу, и нет ли общего арбитра?» Если ответ «нет» — обычная база данных решит задачу быстрее и дешевле. Умение задать этот вопрос ценится выше, чем знание терминов.`}
]}
]},

{id:"b11",icon:"📈",title:"Рост до архитектора",tag:"карьера",color:"green",
desc:"Паттерны GoF, DDD, ООП, trade-off мышление и как выбрать между техническим и продуктовым треком.",
topics:[
{id:"11-1",title:"ООП, паттерны и DDD",
theory:`<h4>ООП на пальцах</h4>
<ul>
<li><b>Инкапсуляция</b> — прячем внутреннее устройство за интерфейсом. Вы жмёте педаль газа, не зная про впрыск топлива.</li>
<li><b>Наследование</b> — потомок берёт свойства родителя и добавляет своё. BaseNotification → SmsNotification.</li>
<li><b>Полиморфизм</b> — один вызов, разное поведение. <code>notify()</code> одинаково вызывается для SMS и push, а внутри логика разная.</li>
<li><b>Абстракция</b> — описываем только то, что важно для задачи. Клиент в системе взыскания — это долг и контакты, а не рост и цвет глаз.</li>
</ul>
<h4>Паттерны, которые реально спрашивают</h4>
<table>
<tr><th>Паттерн</th><th>Суть</th><th>Пример из взыскания</th></tr>
<tr><td><b>Strategy</b></td><td>Взаимозаменяемые алгоритмы за общим интерфейсом</td><td>Разные способы расчёта пени</td></tr>
<tr><td><b>Observer</b></td><td>Подписчики реагируют на события</td><td>Это и есть Pub/Sub через Kafka</td></tr>
<tr><td><b>Factory</b></td><td>Создание объекта без указания конкретного класса</td><td>NotificationFactory по типу канала</td></tr>
<tr><td><b>Adapter</b></td><td>Приведение чужого интерфейса к нужному</td><td>Обёртка над SOAP-сервисом банка</td></tr>
<tr><td><b>Facade</b></td><td>Простой фасад над сложной подсистемой</td><td>API Gateway по сути это он</td></tr>
</table>
<h4>DDD — самое полезное для аналитика</h4>
<p><b>Bounded Context</b> — граница, внутри которой термин означает ровно одно. «Клиент» в скоринге — это анкета, доход, кредитная история. «Клиент» во взыскании — это долг, контакты, история звонков. Один человек, две разные модели.</p>
<div class="co mem"><span class="co-i">🧠</span><span><b>Практическая ценность DDD одной фразой:</b> границы контекстов почти всегда совпадают с границами микросервисов. Правильно нашли контексты — правильно нарезали систему. Ошиблись — получили сервисы, которые постоянно ходят друг к другу за данными.</span></div>
<p><b>Ubiquitous Language</b> — единый словарь для бизнеса и разработки. Если бизнес говорит «дело», а в базе таблица <code>collection_case_entity</code>, а на фронте «карточка» — это три разных языка, и на стыках будут потери.</p>`,
prac:"Составь глоссарий своего домена на 15 терминов. Для каждого: как называет бизнес, как называется в коде/БД, определение в одно предложение. Почти гарантированно найдёшь 2-3 термина, которые разные команды понимают по-разному — это реальная находка, а не упражнение.",
questions:[
{q:"Назовите принципы ООП.",
short:"Инкапсуляция — скрытие деталей за интерфейсом. Наследование — переиспользование через иерархию классов. Полиморфизм — один интерфейс, разные реализации. Абстракция — выделение только существенного для задачи.",
long:`Аналитику эти принципы нужны не для написания кода, а для проектирования — и лучше объяснять именно через это.<br><br><b>Инкапсуляция в проектировании API.</b> Внешний потребитель видит <code>POST /promises</code> и не знает, что внутри три таблицы и вызов скоринга. Если завтра внутренности переделают, контракт не изменится. Это ровно инкапсуляция.<br><br><b>Полиморфизм в постановке.</b> Вместо трёх отдельных описаний «отправить SMS», «отправить push», «позвонить» — одно описание «доставить уведомление по каналу», где канал параметр. Постановка короче, добавление четвёртого канала не требует переписывать логику.<br><br><b>Абстракция как навык аналитика.</b> Умение отбросить несущественное — это то, чем вы занимаетесь ежедневно. Модель клиента в системе взыскания и в CRM отличаются именно уровнем абстракции под задачу.<br><br><b>Про наследование стоит добавить нюанс:</b> в современной практике его часто заменяют композицией — «содержит» вместо «является». Глубокие иерархии наследования оказались трудными в поддержке. Знание этого нюанса выделяет ответ.`},
{q:"Что такое Bounded Context?",
short:"Это граница внутри системы, в пределах которой каждый термин имеет одно однозначное значение. За границей тот же термин может значить другое. Границы контекстов обычно совпадают с границами микросервисов.",
