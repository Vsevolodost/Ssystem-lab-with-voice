<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>System Lab — учебные модули</title>
<style>
:root{
  --sb:#0b1622;--sb2:#132436;--ink:#e6eef7;--soft:#8ba3ba;
  --bg:#eef3f9;--card:#fff;--body:#16202c;--muted:#5d7186;--line:#e3eaf2;
  --teal:#00b8a6;--teal-l:#e2f8f5;--teal-d:#00776c;
  --amber:#f59e0b;--amber-l:#fef4d8;--amber-d:#8a4a08;
  --rose:#f43f5e;--rose-l:#fff0f3;--rose-d:#96123b;
  --blue:#3b82f6;--blue-l:#eaf2ff;--blue-d:#1a4fa8;
  --purple:#8b5cf6;--purple-l:#f4f1ff;--purple-d:#4a1c96;
  --green:#10b981;--green-l:#e8fbf2;--green-d:#046049;
  --r:14px;--mono:'JetBrains Mono',Consolas,'Courier New',monospace;
  --sh-sm:0 1px 3px rgba(16,32,48,.06),0 1px 2px rgba(16,32,48,.04);
  --sh-md:0 4px 16px rgba(16,32,48,.08),0 1px 4px rgba(16,32,48,.04);
  --sh-lg:0 12px 32px rgba(16,32,48,.12),0 2px 8px rgba(16,32,48,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--body);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;display:flex}

/* ═══ SIDEBAR ═══ */
.sb{width:284px;flex-shrink:0;background:var(--sb);min-height:100vh;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden;box-shadow:2px 0 20px rgba(0,0,0,.08)}
.sb-head{padding:20px 16px 15px;background:linear-gradient(155deg,#1d4468 0%,#12283d 55%,#0b1622 100%);position:relative;overflow:hidden}
.sb-head::after{content:'';position:absolute;top:-40px;right:-40px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,rgba(0,184,166,.22),transparent 70%)}
.sb-logo{display:flex;align-items:center;gap:11px;margin-bottom:14px;position:relative}
.sb-icon{width:36px;height:36px;background:linear-gradient(135deg,#00d4bf,#00998b);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;box-shadow:0 4px 12px rgba(0,184,166,.35)}
.sb-title{font-size:15px;font-weight:700;color:#fff;letter-spacing:-.01em}
.sb-sub{font-size:10px;color:var(--soft);font-family:var(--mono);letter-spacing:.04em}
.ov-card{background:rgba(255,255,255,.07);border-radius:12px;padding:13px 14px;border:1px solid rgba(255,255,255,.09);position:relative;backdrop-filter:blur(6px);transition:box-shadow .4s}
.ov-card.flash{box-shadow:0 0 0 2px rgba(0,212,191,.5),0 0 22px rgba(0,212,191,.35)}
.ov-row{display:flex;align-items:baseline;gap:7px;margin-bottom:8px}
.ov-num{font-family:var(--mono);font-size:26px;font-weight:700;color:#00d4bf;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ov-lbl{font-size:11px;color:var(--soft)}
.trk{height:5px;background:rgba(255,255,255,.11);border-radius:3px;overflow:hidden;position:relative}
.fil{height:100%;background:linear-gradient(90deg,#00998b,#00d4bf 60%,#4ff0dd);border-radius:3px;transition:width 1s cubic-bezier(.22,.9,.28,1);position:relative;overflow:hidden}
.fil::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:translateX(-100%)}
.fil.shine::after{animation:shine 1.1s ease-out}
@keyframes shine{to{transform:translateX(100%)}}
.sb-nav{flex:1;overflow-y:auto;padding:9px;scrollbar-width:thin}
.sb-nav::-webkit-scrollbar{width:5px}.sb-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:3px}
.nb{width:100%;display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;cursor:pointer;border:none;background:none;text-align:left;transition:background .18s,transform .18s;margin-bottom:2px;position:relative}
.nb:hover{background:rgba(255,255,255,.07);transform:translateX(2px)}
.nb.on{background:linear-gradient(90deg,rgba(0,184,166,.22),rgba(0,184,166,.06))}
.nb.on::before{content:'';position:absolute;left:0;top:18%;height:64%;width:3px;border-radius:0 3px 3px 0;background:#00d4bf}
.nb-i{font-size:15px;width:21px;text-align:center;flex-shrink:0;transition:transform .18s}
.nb:hover .nb-i{transform:scale(1.16)}
.nb-t{flex:1;font-size:12.5px;color:var(--ink);line-height:1.25}
.nb.on .nb-t{color:#5ff0e0;font-weight:600}
.nb-p{font-family:var(--mono);font-size:10px;color:var(--soft);font-variant-numeric:tabular-nums}
.nb.on .nb-p{color:#00d4bf}
.nb-bar{height:2.5px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:5px;overflow:hidden}
.nb-fil{height:100%;background:linear-gradient(90deg,#00998b,#00d4bf);border-radius:2px;transition:width .9s cubic-bezier(.22,.9,.28,1)}
.sb-foot{padding:11px 13px;border-top:1px solid rgba(255,255,255,.07)}
.rst{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:var(--soft);padding:8px;border-radius:9px;font-size:11px;cursor:pointer;transition:all .18s;font-family:inherit}
.rst:hover{border-color:var(--rose);color:#ff7d95;background:rgba(244,63,94,.09)}

/* ═══ MAIN ═══ */
.main{flex:1;min-width:0;padding:28px 38px 60px;max-width:930px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
.stat{background:var(--card);border-radius:12px;border:1px solid var(--line);padding:13px 15px;box-shadow:var(--sh-sm);transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden}
.stat:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}
.stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--teal);opacity:.85}
.stat.s2::before{background:var(--green)}.stat.s3::before{background:var(--rose)}.stat.s4::before{background:var(--purple)}
.stat-v{font-family:var(--mono);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat-l{font-size:11px;color:var(--muted);margin-top:1px}

.hero{margin-bottom:22px;padding:20px 22px;border-radius:16px;position:relative;overflow:hidden;box-shadow:var(--sh-sm)}
.hero::after{content:'';position:absolute;top:-60px;right:-30px;width:190px;height:190px;border-radius:50%;opacity:.14;background:currentColor}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 13px;border-radius:20px;font-size:10.5px;font-family:var(--mono);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px;background:rgba(255,255,255,.75);backdrop-filter:blur(4px)}
.h1{font-size:24px;font-weight:800;letter-spacing:-.025em;margin-bottom:6px;position:relative}
.hdesc{font-size:14px;max-width:640px;opacity:.82;position:relative}
.hprow{display:flex;align-items:center;gap:12px;margin-top:15px;position:relative}
.hprow .trk{flex:1;height:6px;background:rgba(255,255,255,.55)}
.hprow .fil{background:currentColor;opacity:.9}
.hpct{font-family:var(--mono);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}

/* ═══ TOPIC ═══ */
.tp{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:11px;overflow:hidden;box-shadow:var(--sh-sm);transition:box-shadow .22s,transform .22s;position:relative}
.tp::before{content:'';position:absolute;left:0;top:0;bottom:0;width:0;background:var(--teal);transition:width .3s cubic-bezier(.34,1.4,.5,1)}
.tp.dn::before{width:3.5px}
.tp:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}
.tp.open{box-shadow:var(--sh-lg)}
.tp-h{display:flex;align-items:flex-start;gap:13px;padding:16px 18px;cursor:pointer}
.chk{width:23px;height:23px;border-radius:7px;border:1.8px solid #cfdae6;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .2s cubic-bezier(.34,1.5,.5,1);cursor:pointer;background:#fff}
.chk:hover{border-color:var(--teal);transform:scale(1.13);box-shadow:0 0 0 4px rgba(0,184,166,.13)}
.chk.d{background:linear-gradient(135deg,#00d4bf,#00998b);border-color:transparent;box-shadow:0 3px 9px rgba(0,184,166,.4)}
.chk svg{opacity:0;transform:scale(.4);transition:all .22s cubic-bezier(.34,1.6,.5,1)}
.chk.d svg{opacity:1;transform:scale(1)}
.chk.burst{animation:burst .5s cubic-bezier(.34,1.5,.5,1)}
@keyframes burst{0%{transform:scale(1)}35%{transform:scale(1.35)}100%{transform:scale(1)}}
.tm{flex:1;min-width:0}
.tt{font-size:14.5px;font-weight:700;line-height:1.3;transition:color .25s}
.tt.done-t{color:var(--muted)}
.ts{font-size:11px;color:var(--teal-d);margin-top:2px;font-weight:600;opacity:0;max-height:0;transition:all .3s}
.tp.dn .ts{opacity:1;max-height:20px}
.cv{color:#9fb0c2;transition:transform .25s;margin-top:3px;flex-shrink:0;font-size:12px}
.tp.open .cv{transform:rotate(180deg);color:var(--teal)}
.tb{display:none;padding:0 18px 22px 54px}
.tp.open .tb{display:block;animation:slideIn .3s cubic-bezier(.22,.9,.28,1)}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ═══ THEORY ═══ */
.th{font-size:14px;margin-bottom:16px}
.th p{margin-bottom:9px}
.th ul,.th ol{margin:6px 0 11px 19px}
.th li{margin-bottom:5px}
.th code{background:#eef3f9;padding:2px 6px;border-radius:5px;font-family:var(--mono);font-size:12.5px;color:var(--teal-d);border:1px solid #dde7f0}
.th h4{font-size:11px;font-weight:700;color:var(--teal-d);text-transform:uppercase;letter-spacing:.09em;margin:17px 0 8px;display:flex;align-items:center;gap:8px}
.th h4::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.th table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;margin:11px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.th th{background:linear-gradient(180deg,#f5f9fd,#eef3f9);padding:9px 11px;text-align:left;font-size:12px;color:var(--teal-d);font-weight:700;border-bottom:1px solid var(--line)}
.th td{padding:8px 11px;border-bottom:1px solid #f0f4f9;vertical-align:top}
.th tbody tr:last-child td,.th tr:last-child td{border-bottom:none}
.th tr:hover td{background:#fafcfe}

/* ═══ CALLOUTS ═══ */
.co{border-radius:11px;padding:12px 15px;margin:12px 0;font-size:13.5px;line-height:1.58;display:flex;gap:11px;align-items:flex-start;border:1px solid transparent;transition:transform .2s}
.co:hover{transform:translateX(2px)}
.co-i{font-size:16px;flex-shrink:0;margin-top:1px}
.co.tip{background:linear-gradient(135deg,#e2f8f5,#f0fdfb);color:#045c50;border-color:#b9ece5}
.co.warn{background:linear-gradient(135deg,#fef4d8,#fffbf0);color:#7a3f06;border-color:#fbe2a8}
.co.ex{background:linear-gradient(135deg,#eaf2ff,#f5f9ff);color:var(--blue-d);border-color:#c9dcfb}
.co.fin{background:linear-gradient(135deg,#fff0f3,#fff7f9);color:var(--rose-d);border-color:#fbcdd8}
.co.ai{background:linear-gradient(135deg,#f4f1ff,#faf8ff);color:var(--purple-d);border-color:#ddd2fb}
.co.good{background:linear-gradient(135deg,#e8fbf2,#f3fdf8);color:var(--green-d);border-color:#b7ecd4}
.co.mem{background:linear-gradient(135deg,#fdf6d3,#fefbeb);color:#6b4408;border:1px dashed #e8bf4d}

/* ═══ PRACTICE ═══ */
.prac{background:linear-gradient(135deg,#fff5eb,#fffaf4);border:1px solid #fcd9b0;border-radius:12px;padding:14px 16px;margin:13px 0;position:relative;overflow:hidden}
.prac::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#fb923c,#f59e0b)}
.prac-h{font-size:10.5px;font-weight:700;color:#9a3412;text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.prac-b{font-size:13.5px;color:#7c2d12}

/* ═══ DIAGRAMS ═══ */
.dg{background:linear-gradient(160deg,#f7fafd,#eef3f9);border:1px solid var(--line);border-radius:13px;padding:17px;margin:13px 0;overflow-x:auto;box-shadow:inset 0 1px 3px rgba(16,32,48,.03)}
.dg svg{max-width:100%;display:block;margin:0 auto}
.dgc{font-size:12px;color:var(--muted);text-align:center;margin-top:9px;line-height:1.5}
.dg-ctrl{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.dg-btn{background:#fff;border:1px solid #d5e0ec;color:var(--body);padding:7px 15px;border-radius:9px;font-size:12px;cursor:pointer;transition:all .18s;font-family:inherit;box-shadow:var(--sh-sm);font-weight:500}
.dg-btn:hover{border-color:var(--teal);color:var(--teal-d);background:var(--teal-l);transform:translateY(-1px);box-shadow:var(--sh-md)}
.dg-btn:active{transform:translateY(0)}
.dg-btn.act{background:linear-gradient(135deg,#00c4b1,#00998b);color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(0,184,166,.32)}
.dg-btn.dang{border-color:#f9b8c4;color:var(--rose-d)}
.dg-btn.dang:hover{background:var(--rose-l);border-color:var(--rose)}
.dg-btn.pur{border-color:#d5c8fb;color:var(--purple-d)}
.dg-btn.pur:hover{background:var(--purple-l);border-color:var(--purple)}

/* ═══ ANIMATIONS ═══ */
@keyframes flowRight{0%{opacity:0;transform:translateX(0)}12%{opacity:1}88%{opacity:1}100%{opacity:0;transform:translateX(var(--dist,180px))}}
.pkt{animation:flowRight var(--sp,3s) linear infinite;animation-delay:var(--dl,0s)}
@keyframes flowDown{0%{opacity:0;transform:translateY(0)}12%{opacity:1}88%{opacity:1}100%{opacity:0;transform:translateY(var(--dist,100px))}}
.pktv{animation:flowDown var(--sp,3s) linear infinite;animation-delay:var(--dl,0s)}
.paused .pkt,.paused .pktv,.paused .flowline,.paused .pulse2,.paused .rot{animation-play-state:paused}
@keyframes dashMove{to{stroke-dashoffset:-24}}
.flowline{stroke-dasharray:6 6;animation:dashMove 1.2s linear infinite}
@keyframes pulseG{0%,100%{opacity:.3}50%{opacity:.85}}
.pulse2{animation:pulseG 1.8s ease-in-out infinite}
@keyframes rotSlow{to{transform:rotate(360deg)}}
.rot{animation:rotSlow 8s linear infinite;transform-origin:center}
@keyframes popIn{0%{transform:scale(0);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.pop{animation:popIn .45s cubic-bezier(.34,1.5,.5,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ═══ Q&A ═══ */
.ql{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--teal-d);font-weight:700;margin:20px 0 11px}
.ql::before{content:'';width:14px;height:2px;background:var(--teal);border-radius:1px}
.ql::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.qi{margin-bottom:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;box-shadow:var(--sh-sm);transition:box-shadow .2s}
.qi:hover{box-shadow:var(--sh-md)}
.qq{display:flex;align-items:flex-start;gap:10px;padding:13px 15px 9px;font-size:13.5px;font-weight:600;line-height:1.45}
.qb{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#e2f8f5,#c6f0e9);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;font-weight:700;color:var(--teal-d);margin-top:1px}
.qshort{margin:0 15px 11px;padding:11px 13px;background:linear-gradient(135deg,#e8fbf2,#f4fdf9);border-left:3px solid var(--green);border-radius:0 9px 9px 0;font-size:13.5px;color:#044c3b}
.qshort b{color:var(--green-d)}
.qmore{margin:0 15px 12px;display:inline-flex;align-items:center;gap:6px;background:#f2f7fc;border:1px solid #dfe9f3;color:var(--teal-d);font-size:12px;cursor:pointer;font-family:inherit;padding:6px 13px;font-weight:600;border-radius:8px;transition:all .18s}
.qmore:hover{background:var(--teal-l);border-color:var(--teal)}
.qlong{display:none;margin:0 15px 13px;padding:13px 15px;background:linear-gradient(160deg,#f7fafd,#eef3f9);border-left:3px solid var(--teal);border-radius:0 9px 9px 0;font-size:13.5px;line-height:1.68}
.qlong.show{display:block;animation:fadeUp .28s cubic-bezier(.22,.9,.28,1)}
.qlong b{color:var(--teal-d)}
.qlong code{background:#dff3f5;padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:12px}

/* ═══ SQL ═══ */
.sqlw{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:11px;overflow:hidden;box-shadow:var(--sh-sm);transition:box-shadow .2s;position:relative}
.sqlw::before{content:'';position:absolute;left:0;top:0;bottom:0;width:0;background:var(--green);transition:width .3s cubic-bezier(.34,1.4,.5,1)}
.sqlw.solved::before{width:3.5px}
.sqlw:hover{box-shadow:var(--sh-md)}
.sqlh{padding:15px 18px;display:flex;align-items:center;gap:13px;cursor:pointer;border-bottom:1px solid transparent}
.sqlw.open .sqlh{border-bottom-color:var(--line)}
.sqln{width:29px;height:29px;border-radius:9px;background:linear-gradient(135deg,#eaf2ff,#d7e6fc);color:var(--blue-d);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:700;flex-shrink:0;transition:all .3s}
.sqlw.solved .sqln{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 3px 9px rgba(16,185,129,.35)}
.sqlt{flex:1;font-size:14px;font-weight:700}
.sqldiff{font-size:10px;font-family:var(--mono);padding:3px 9px;border-radius:6px;flex-shrink:0;font-weight:600}
.d-easy{background:var(--green-l);color:var(--green-d)}
.d-mid{background:var(--amber-l);color:var(--amber-d)}
.d-hard{background:var(--rose-l);color:var(--rose-d)}
.sqlb{display:none;padding:17px 18px}
.sqlw.open .sqlb{display:block;animation:slideIn .3s}
.sqltask{font-size:13.5px;margin-bottom:13px;padding:12px 14px;background:linear-gradient(135deg,#eaf2ff,#f5f9ff);border-radius:10px;color:var(--blue-d);border:1px solid #cfe0fb}
.schema{font-family:var(--mono);font-size:11.5px;background:linear-gradient(160deg,#0f1e2e,#0a1725);color:#8fe3d5;padding:13px 15px;border-radius:10px;margin-bottom:13px;overflow-x:auto;line-height:1.75;border:1px solid #1e3549}
.schema .tb2{color:#fcd34d;font-weight:600}.schema .cl{color:#a9bdf5}
.sqlin{width:100%;min-height:105px;font-family:var(--mono);font-size:13px;padding:13px;border:1.5px solid #dbe5f0;border-radius:10px;resize:vertical;background:#fbfdff;color:var(--body);line-height:1.65;transition:all .2s}
.sqlin:focus{outline:none;border-color:var(--teal);background:#fff;box-shadow:0 0 0 4px rgba(0,184,166,.11)}
.sqlbtns{display:flex;gap:9px;margin-top:11px;flex-wrap:wrap}
.btn{padding:9px 18px;border-radius:9px;font-size:13px;cursor:pointer;border:1px solid #d5e0ec;background:#fff;font-family:inherit;transition:all .18s;box-shadow:var(--sh-sm);font-weight:500}
.btn:hover{border-color:var(--teal);transform:translateY(-1px);box-shadow:var(--sh-md)}
.btn-p{background:linear-gradient(135deg,#00c4b1,#00998b);color:#fff;border-color:transparent;font-weight:600;box-shadow:0 3px 10px rgba(0,184,166,.3)}
.btn-p:hover{box-shadow:0 5px 16px rgba(0,184,166,.42)}
.fb{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:13px;display:none}
.fb.show{display:block;animation:fadeUp .25s}
.fb.ok{background:linear-gradient(135deg,#e8fbf2,#f3fdf8);color:var(--green-d);border-left:3px solid var(--green)}
.fb.no{background:linear-gradient(135deg,#fef4d8,#fffbf0);color:var(--amber-d);border-left:3px solid var(--amber)}
.sol{display:none;margin-top:12px}
.sol.show{display:block;animation:fadeUp .28s}
.solc{font-family:var(--mono);font-size:12.5px;background:linear-gradient(160deg,#0f1e2e,#0a1725);color:#7fd8f5;padding:14px 16px;border-radius:10px;white-space:pre;overflow-x:auto;line-height:1.75;border:1px solid #1e3549}
.solx{margin-top:10px;padding:12px 14px;background:linear-gradient(135deg,#e2f8f5,#f0fdfb);border-radius:10px;font-size:13px;color:#045c50;border:1px solid #b9ece5}

theory:`<p><b>На пальцах:</b> представь переводчика на переговорах. С одной стороны бизнес говорит «хочу снизить просрочку». С другой — разработчик, который мыслит эндпоинтами, таблицами и событиями. Аналитик — тот, кто переводит первое во второе так, чтобы по дороге ничего не потерялось и ничего лишнего не придумалось.</p>

long:`Развёрнутый ответ на собесе стоит давать через свой проект. Например: «Я работаю в трайбе взыскания. Собираю требования у бизнеса, превращаю их в постановки: описываю API робота-коллектора, проектирую статусную машину дел, согласую формат событий с командой Kafka-интеграции. Это работа СА.<br><br>БА на том же проекте занимался бы вопросом "какая стратегия обзвона снижает просрочку сильнее" — это про бизнес-логику и метрики, а не про то, как система устроена внутри.»<br><br><b>Почему так:</b> исторически разделение пришло из крупных корпораций, где потоки требований большие и роли специализируются. В продуктовых командах чаще один человек закрывает обе роли — и на собесе это нормально сказать прямо.`},

long:`<b>Agile Manifesto (2001)</b> — четыре пары ценностей: люди и взаимодействие важнее процессов; работающий продукт важнее документации; сотрудничество с заказчиком важнее контракта; готовность к изменениям важнее следования плану.<br><br>Ключевое, что часто упускают: в манифесте написано «важнее», а не «вместо». Документация нужна — просто она не самоцель.<br><br><b>Scrum</b> — один из способов реализовать эти ценности. Есть и другие: Kanban, XP, LeSS, SAFe.<br><br>Хороший ход на собесе: «Agile — ценности, Scrum — реализация. Можно формально проводить все ритуалы Scrum и при этом быть совершенно не agile — например, если PO не имеет права принимать решения, а требования спущены сверху на год вперёд.»`},

long:`Разберём по причинам:<br><br><b>Фиксированный контракт.</b> Смысл Scrum — менять приоритеты между спринтами. Если объём и сроки зашиты юридически, менять нечего — итеративность превращается в ритуал ради ритуала.<br><br><b>Нет настоящего PO.</b> Если «владелец продукта» ходит согласовывать каждое решение наверх, планирование спринта превращается в ожидание.<br><br><b>Поток инцидентов.</b> Саппорт и эксплуатация не планируются на 2 недели вперёд — прилетело сегодня, чинить сегодня. Kanban с лимитами WIP тут честнее.<br><br><b>Большая команда.</b> Свыше ~9 человек коммуникация ломается: дейли на 20 минут превращается в час.`}

{id:"b2",icon:"📋",title:"Требования — от и до",tag:"база",color:"blue",
desc:"4 уровня требований на примере лампы, SMART, трассировка, приоритизация. Самый частый блок на любом собеседовании.",
topics:[
{id:"2-1",title:"Виды требований — на примере настольной лампы",
theory:`<p><b>На пальцах:</b> требования — это лестница сверху вниз. Наверху бизнес говорит зачем нам это вообще. Ниже пользователь говорит что ему нужно уметь делать. Ещё ниже — что делает система. И в самом низу — насколько хорошо она это делает.</p>
<h4>4 уровня</h4>
<ul>
<li><b>Бизнес-требования</b> — цель компании. «Снизить просрочку 1-30 дней с 15% до 10% за квартал». Это не про систему, это про деньги.</li>
<li><b>Пользовательские</b> — «Как оператор взыскания, я хочу видеть историю контактов клиента, чтобы не звонить дважды в один день».</li>
<li><b>Функциональные</b> — «При просрочке более 5 дней система автоматически создаёт задачу на звонок».</li>
<li><b>Нефункциональные (NFR)</b> — «Задача создаётся не позже 15 минут после события. Сервис доступен 99.9%».</li>
</ul>
<div class="co ex"><span class="co-i">🔦</span><span><b>Настольная лампа — тренировка на простом объекте:</b><br><br>
<b>Функциональные (ЧТО умеет):</b> включается/выключается кнопкой · регулирует яркость в 3 положения · автовыключение по таймеру 30 мин · поворотный кронштейн фиксируется в положении.<br><br>
<b>Нефункциональные (НАСКОЛЬКО хорошо):</b> зажигается за ≤ 0,3 сек · яркость ≥ 500 лм на максимуме · потребление ≤ 10 Вт · корпус не нагревается выше 45 °C · срок службы ≥ 25 000 часов · выдерживает 10 000 циклов включения.<br><br>
❌ Плохо: «лампа должна быть яркой и удобной» — нечего тестировать.<br>
✅ Хорошо: «≥ 500 лм», «≤ 0,3 сек» — тестировщик берёт люксметр и секундомер.</span></div>
<div class="co mem"><span class="co-i">🧠</span><span><b>Как отличить ФТ от НФТ за 2 секунды:</b> подставь вопрос. Отвечает на <b>«что делает?»</b> → функциональное. Отвечает на <b>«как быстро / насколько надёжно / сколько выдержит?»</b> → нефункциональное. Ещё проще: если в требовании есть <b>число с единицей измерения</b> — почти наверняка НФТ.</span></div>
<div class="co warn"><span class="co-i">⚠️</span><span>Джун описывает только функционал. Сеньор первым делом спрашивает про нагрузку, доступность и безопасность. Системы в проде падают почти всегда из-за нефункционалки, а не из-за забытой кнопки.</span></div>`,
prac:"Возьми любой предмет рядом (кофеварка, лифт, турникет в зале) и за 5 минут выпиши 4 функциональных и 4 нефункциональных требования. Каждое НФТ обязано содержать число. Это лучшее упражнение перед собесом — навык формулировать измеримо тренируется именно так.",
questions:[
{q:"Какие виды требований бывают?",
short:"Четыре уровня: бизнес-требования (зачем компании), пользовательские (что умеет пользователь), функциональные (что делает система), нефункциональные (как хорошо она это делает — скорость, надёжность, безопасность).",
long:`На собесе сильнее звучит, если сразу дать пример сквозь все уровни на одной задаче:<br><br><b>Бизнес:</b> «снизить долю просрочки 1-30 дней на 5 п.п.»<br><b>Пользовательское:</b> «оператор хочет видеть, кто уже контактировал с клиентом сегодня»<br><b>Функциональное:</b> «система создаёт задачу на звонок при просрочке > 5 дней, если за сутки не было контакта»<br><b>НФТ:</b> «задача появляется в очереди оператора не позже 15 минут после события; сервис доступен 99,9%»<br><br><b>Дополнительно можно упомянуть</b> ограничения (constraints) — то, что нельзя менять: «работаем только на нашем внутреннем облаке», «данные не покидают контур банка». Формально это не требования, а рамки, но в постановке они обязаны быть.`},
{q:"Приведите пример функционального и нефункционального требования.",
short:"Функциональное: «система отправляет SMS клиенту при просрочке 5 дней». Нефункциональное: «SMS уходит не позже 500 мс после события, доставляемость не ниже 98%, сервис держит 500 отправок в секунду».",
long:`Ключ к хорошему ответу — показать, что НФТ вы формулируете <b>измеримо</b>, а не словами «быстро» и «надёжно».<br><br>Категории НФТ, которые стоит держать в голове (по ним же удобно чек-листить свои постановки):<br><br><b>Производительность</b> — время отклика, пропускная способность (RPS), потребление ресурсов.<br><b>Надёжность</b> — доступность (99,9% = 8,7 часа простоя в год), RTO/RPO при аварии.<br><b>Безопасность</b> — шифрование в транзите и покое, аудит-трейл, разграничение доступа.<br><b>Масштабируемость</b> — «выдержит рост базы вдвое без смены архитектуры».<br><b>Совместимость</b> — браузеры, ОС, версии API.<br><b>Юзабилити</b> — «оформление обещания оплаты ≤ 3 кликов».<br><br>На собесе полезно назвать 4-5 категорий — это сразу показывает системность.`},
{q:"Как понять, что требование сформулировано плохо?",
short:"Главный тест: может ли тестировщик написать по нему тест-кейс. Если в требовании есть «удобно», «быстро», «надёжно» без чисел — оно непроверяемо и будет источником спора на приёмке.",
long:`Практический чек-лист качества требования:<br><br><b>1. Однозначность.</b> Два человека прочитали — поняли одинаково? Слова-ловушки: «оптимально», «интуитивно понятно», «при необходимости», «и т.д.».<br><b>2. Проверяемость.</b> Есть критерий приёмки с числом или чётким состоянием.<br><b>3. Полнота.</b> Описан не только happy path, но и что делать при ошибке, таймауте, пустых данных.<br><b>4. Непротиворечивость.</b> Не конфликтует с другими требованиями в документе.<br><b>5. Атомарность.</b> Одно требование — одна мысль. Если внутри «и» — скорее всего это два требования.<br><br><b>Мой рабочий приём:</b> прежде чем отдать постановку в разработку, показываю тестировщику и прошу набросать пару тест-кейсов. Расхождение с моим пониманием всплывает сразу и стоит 10 минут, а не спринт.`}
]},
{id:"2-2",title:"SMART, приоритизация и трассировка",
theory:`<p><b>SMART</b> — чек-лист, по которому прогоняют требование или цель.</p>
<table>
<tr><th>Буква</th><th>Смысл</th><th>Плохо</th><th>Хорошо</th></tr>
<tr><td><b>S</b>pecific</td><td>Конкретно</td><td>«улучшить обзвон»</td><td>«увеличить дозвон с первой попытки»</td></tr>
<tr><td><b>M</b>easurable</td><td>Измеримо</td><td>«стало лучше»</td><td>«с 42% до 55%»</td></tr>
<tr><td><b>A</b>chievable</td><td>Достижимо</td><td>«дозвон 100%»</td><td>«+13 п.п. за квартал»</td></tr>
<tr><td><b>R</b>elevant</td><td>Уместно</td><td>«красивый интерфейс»</td><td>«влияет на сбор долга»</td></tr>
<tr><td><b>T</b>ime-bound</td><td>Срок</td><td>«когда-нибудь»</td><td>«к релизу 3.1, 15.03»</td></tr>
</table>
<h4>Приоритизация — MoSCoW</h4>
<ul>
<li><b>Must</b> — без этого релиза нет</li>
<li><b>Should</b> — важно, но есть обходной путь</li>
<li><b>Could</b> — сделаем, если останется время</li>
<li><b>Won't</b> — сознательно не в этот раз (и это надо фиксировать!)</li>
</ul>
<h4>Трассировка требований (RTM)</h4>
<p><b>На пальцах:</b> это ниточка, связывающая «зачем» → «что» → «где сделано» → «чем проверено». Дёрнул за один конец — видишь весь хвост.</p>
<table>
<tr><th>ID</th><th>Требование</th><th>Бизнес-цель</th><th>Jira</th><th>Тест</th></tr>
<tr><td>FR-001</td><td>Звонок при просрочке > 5 дн.</td><td>Снизить просрочку</td><td>DEV-234</td><td>TC-45</td></tr>
<tr><td>NFR-001</td><td>Задача ≤ 15 мин после события</td><td>SLA сервиса</td><td>DEV-236</td><td>TC-47</td></tr>
</table>
<div class="co mem"><span class="co-i">🧠</span><span><b>Зачем RTM на самом деле:</b> запомни один сценарий — «бизнес пришёл менять правило». Без RTM ты полдня ищешь, что зацепит изменение. С RTM — одна строка показывает: 2 задачи в Jira, 3 тест-кейса, 1 экран. Импакт-анализ за минуту.</span></div>`,
prac:"Построй мини-RTM на 5 строк для последней своей фичи: требование → бизнес-цель → задача в Jira → тест-кейс. Если для какого-то требования не находится тест-кейс — ты только что нашёл дыру в покрытии. Это реальная польза, не бюрократия.",
questions:[
{q:"Как вы оцениваете требования по SMART?",
short:"Прогоняю по 5 критериям: конкретность, измеримость, достижимость, уместность, срок. Главный из них — измеримость: если нет числа или чёткого критерия, требование нельзя проверить на приёмке.",
long:`Пример из практики, который хорошо звучит на собесе:<br><br>Пришло требование: «робот должен звонить эффективнее». Прогоняю по SMART:<br><br><b>S</b> — что значит эффективнее? Уточняю: больше дозвонов или больше обещаний оплаты? Оказалось — дозвонов.<br><b>M</b> — с какого на какое значение? Смотрим текущую метрику: 42% дозвона с первой попытки.<br><b>A</b> — реалистично ли 90%? Нет, физически недостижимо. Договариваемся на 55%.<br><b>R</b> — влияет ли дозвон на сбор? Да, прямая корреляция.<br><b>T</b> — к какому релизу? К 3.1.<br><br>Итоговая формулировка: «Увеличить долю успешного дозвона с первой попытки с 42% до 55% за счёт выбора оптимального времени звонка. Замер — к концу спринта 18».<br><br><b>Главное, что показывает этот ответ:</b> вы не принимаете расплывчатые хотелки, а превращаете их в проверяемое требование через диалог.`},
{q:"Что такое трассировка требований и зачем она нужна?",
short:"Это связь требования с его бизнес-целью, задачей в разработке и тест-кейсом. Нужна для импакт-анализа при изменениях, доказательства покрытия на приёмке и для аудита — в банке это обязательное условие.",
long:`Три реальных сценария, где RTM спасает:<br><br><b>1. Изменение требования.</b> Бизнес решил: звонить не с 5 дней просрочки, а с 3. Без трассировки — ищешь по всему проекту. С RTM — видишь: затронуто требование FR-001, задача DEV-234, тест TC-45, плюс зависимое NFR по нагрузке (звонков станет больше). Импакт-анализ за минуту.<br><br><b>2. Приёмка.</b> Заказчик спрашивает: «всё ли из ТЗ сделано?» RTM показывает статус по каждой строке.<br><br><b>3. Аудит.</b> Регулятор или внутренний аудит проверяет: соответствует ли система заявленным требованиям 230-ФЗ. RTM — готовое доказательство.<br><br><b>Честно про минус:</b> RTM требует дисциплины и устаревает, если её не поддерживать. Поэтому на практике трассируют не всё подряд, а критичное: регуляторные требования, интеграции, деньги.`},
{q:"Как приоритизировать требования, если стейкхолдеры хотят разного?",
short:"Использую MoSCoW и матрицу «ценность/сложность», но решение принимаю не сам — выношу конфликт на уровень PO или заказчика с расчётом трудозатрат и рисков по каждому варианту.",
long:`Пошагово, как я это делаю:<br><br><b>1. Фиксирую конфликт письменно.</b> Устная договорённость через месяц превращается в «я такого не говорил».<br><b>2. Ищу первопричину.</b> Часто оба правы, просто решают разные задачи. Иногда выясняется, что требования не противоречат — просто сформулированы через разные решения одной проблемы.<br><b>3. Готовлю данные.</b> Оценка трудозатрат от команды, влияние на метрику, риски.<br><b>4. Выношу на решение</b> тому, у кого есть полномочия — PO или заказчику. Аналитик не должен решать бизнес-конфликт за бизнес.<br><b>5. Документирую решение и обоснование.</b><br><br>Отдельно про <b>Won't</b> в MoSCoW: очень важно явно фиксировать, что мы сознательно НЕ делаем. Иначе на приёмке всплывёт «а где вот это?».`}
]}
]},

{id:"b3",icon:"🗂️",title:"Документация и нотации",tag:"инструменты",color:"amber",
desc:"User Story vs Use Case, ТЗ и ЧТЗ, UML Sequence, State Machine, BPMN. Что реально рисуют в работе.",
topics:[
{id:"3-1",title:"User Story, Use Case, ТЗ и ЧТЗ",
theory:`<p><b>User Story</b> — «Как <i>роль</i>, я хочу <i>функцию</i>, чтобы <i>ценность</i>» + критерии приёмки в формате Given-When-Then.</p>
<p><b>Use Case</b> — формальный сценарий: актор, предусловие, основной поток по шагам, альтернативные потоки, исключения, постусловие.</p>
<div class="co mem"><span class="co-i">🧠</span><span><b>Когда что:</b> User Story отвечает <b>«зачем и кому»</b>, Use Case — <b>«по каким шагам»</b>. Правило большого пальца: если у функции больше двух ветвлений — одной User Story не хватит, нужен Use Case или флоу-схема.</span></div>
<p><b>ТЗ</b> — верхний уровень: цели, границы системы, архитектура, интеграции, ограничения. <b>ЧТЗ</b> — детализация под конкретный экран/API/сценарий. Это основной рабочий формат аналитика.</p>
<h4>Скелет хорошего ЧТЗ</h4>
<ol>
<li>Контекст и цель — зачем делаем</li>
<li>Предусловия — что должно быть выполнено до</li>
<li>Основной сценарий по шагам</li>
<li>Альтернативные сценарии</li>
<li>Исключения: ошибки, таймауты, пустые данные</li>
<li>Требования к UI: поля, валидации, состояния</li>
<li>API/интеграции: методы, форматы, коды ошибок</li>
<li>НФТ</li>
<li>Критерии приёмки</li>
</ol>
<div class="co tip"><span class="co-i">💡</span><span>Проверка качества ЧТЗ: отдай тестировщику и попроси набросать 3 тест-кейса. Совпало с твоим пониманием — документ рабочий. Не совпало — переписывай, пока не поздно.</span></div>`,
prac:"Возьми свою последнюю постановку и проверь по 9 пунктам скелета выше. Почти гарантированно не хватает пункта 5 (исключения) — это самая частая дыра. Допиши: что происходит при таймауте внешнего сервиса, при пустом ответе, при дубле запроса.",
questions:[
{q:"В чём разница User Story и Use Case?",
short:"User Story — короткая карточка ценности для бизнеса, 1-2 предложения плюс критерии приёмки. Use Case — детальный пошаговый сценарий с альтернативами и исключениями. Обычно использую оба: US как заголовок, UC как детализацию.",
long:`Разница по сути в назначении:<br><br><b>User Story</b> — это обещание разговора. Она намеренно короткая, чтобы не фиксировать решение раньше времени. Её читает бизнес и PO. Формат Given-When-Then для критериев приёмки: «Дано: клиент с просрочкой 6 дней. Когда: наступает 9:00. Тогда: в очереди оператора появляется задача на звонок».<br><br><b>Use Case</b> — это уже про механику. Пример структуры:<br>Актор: система планирования обзвона<br>Предусловие: клиент активен, просрочка > 5 дней, лимит контактов не исчерпан<br>Основной поток: 1) проверить окно разрешённых звонков 2) проверить счётчик контактов 3) создать задачу 4) опубликовать событие<br>Альтернатива 2а: лимит исчерпан → перейти к каналу SMS<br>Исключение: сервис лимитов недоступен → не звонить, поставить в отложенную очередь<br><br><b>Ключевая мысль для собеса:</b> исключения — это то, что отличает постановку сеньора. Именно там живут баги прода.`},
{q:"Что такое верификация и валидация требований?",
short:"Верификация — «сделали ли мы систему правильно» (соответствует ли ТЗ, проверяют тестировщики). Валидация — «сделали ли мы правильную систему» (решает ли реальную задачу, проверяет пользователь на UAT).",
long:`Разница критична, потому что можно пройти верификацию идеально и провалить валидацию.<br><br><b>Пример.</b> В ТЗ написано: «система отправляет SMS с текстом задолженности». Разработали, протестировали, всё по ТЗ — верификация пройдена. Выкатили — конверсия ноль. Оказалось, клиенты не читают SMS с суммами, воспринимают как спам. Требование было выполнено, но проблему не решило — валидация провалена.<br><br><b>Как валидировать заранее, не дожидаясь прода:</b><br>— прототип и тест на реальных пользователях до разработки<br>— A/B-тест на малой доле трафика<br>— явно проговорить с заказчиком: «по какой метрике мы поймём, что это сработало?»<br><br>Последний вопрос — самый сильный инструмент аналитика. Если на него нет ответа, требование может быть просто ничьей хотелкой.`}
]},
{id:"3-2",title:"UML Sequence, State Machine и BPMN",
theory:`<p><b>Sequence Diagram</b> — главная диаграмма для интеграций. Кто, кому, в каком порядке шлёт запросы.</p>
<ul>
<li><code>alt</code> — ветвление если/иначе (успех / ошибка)</li>
<li><code>opt</code> — опциональный блок (выполняется при условии)</li>
<li><code>loop</code> — цикл (ретраи, обход списка)</li>
<li><code>par</code> — параллельные вызовы</li>
<li><code>ref</code> — ссылка на другую диаграмму, чтобы не раздувать</li>
</ul>
<p><b>State Machine</b> — состояния объекта и переходы между ними. Незаменима для статусных моделей.</p>
<div class="co ex"><span class="co-i">🏦</span><span>Пример статусной модели дела о взыскании: <code>Новое → В работе → Обещание оплаты → Оплачено → Закрыто</code>, плюс ветки <code>→ Судебное</code> и <code>→ Списано</code>. На собесе про State Machine спрашивают почти всегда, если в резюме есть банк.</span></div>
<p><b>BPMN</b> — процессы, понятные бизнесу. События (круги), задачи (прямоугольники), шлюзы (ромбы), дорожки (кто делает).</p>
<table>
<tr><th>Шлюз</th><th>Знак</th><th>Смысл</th></tr>
<tr><td>Exclusive (XOR)</td><td>×</td><td>Только один путь — если/иначе</td></tr>
<tr><td>Parallel (AND)</td><td>+</td><td>Все пути сразу, ждём всех</td></tr>
<tr><td>Inclusive (OR)</td><td>○</td><td>Один или несколько путей</td></tr>
</table>
<div class="co mem"><span class="co-i">🧠</span><span><b>UML Activity vs BPMN:</b> обе рисуют процесс. Разница — в дорожках. BPMN сразу показывает <b>КТО</b> делает шаг (отдел, система, роль), поэтому её понимает бизнес. Правило: рисуешь для бизнеса → BPMN, рисуешь алгоритм внутри сервиса → Activity.</span></div>`,
prac:"Нарисуй Sequence-диаграмму на 5 участников для сценария: клиент нажал «оплатить» → мобильное приложение → API Gateway → платёжный сервис → внешний шлюз. Обязательно добавь блок alt: что происходит, если внешний шлюз отвечает таймаутом. Именно этот блок отличает джуна от мидла.",
questions:[
{q:"Какие UML-диаграммы используете чаще всего?",
short:"Sequence — для описания интеграций между сервисами, и State Machine — для жизненного цикла сущностей. Use Case на старте проекта чтобы показать скоуп, BPMN для сквозных бизнес-процессов.",
long:`Стоит отвечать через конкретику своего проекта — это сразу отличает практика от теоретика:<br><br><b>Sequence</b> рисую всегда, когда в задаче больше двух систем. Показываю не только happy path, но и <code>alt</code> с ошибкой — что вернём клиенту, если платёжный шлюз ответил таймаутом, и будет ли ретрай.<br><br><b>State Machine</b> — для статусной модели дела о взыскании. Важный момент: на диаграмме должно быть видно не только какие переходы <b>есть</b>, но и каких <b>нет</b>. Из статуса «Закрыто» нельзя вернуться в «В работе» — это ловит целый класс багов на этапе постановки.<br><br><b>Class Diagram</b> практически не рисую — для проектирования БД удобнее ER.<br><br><b>Честное замечание:</b> нотация — не самоцель. Если схема не помогает команде понять быстрее — она не нужна. Я видел проекты, где рисовали идеальный UML, который никто не открывал.`},
{q:"Чем BPMN отличается от UML Activity Diagram?",
short:"Обе описывают процесс, но BPMN через дорожки (pools/lanes) сразу показывает кто именно выполняет каждый шаг. Поэтому BPMN понятна бизнесу, а Activity удобнее для алгоритма внутри одного сервиса.",
long:`Практическая разница проявляется, когда процесс проходит через несколько подразделений.<br><br><b>Пример:</b> процесс работы с должником затрагивает автоматический обзвон, оператора кол-центра, юридический отдел и бухгалтерию. В BPMN это четыре дорожки, и на одном листе видно, где процесс переходит из рук в руки — а именно на этих стыках теряется время и возникают проблемы.<br><br>В Activity Diagram тоже есть разделы (partitions), но нотация ориентирована на алгоритм и хуже читается небольшим бизнесом.<br><br><b>Ещё одно отличие:</b> BPMN исполнима. Существуют движки (Camunda, jBPM), которые запускают BPMN-схему как реальный процесс. Если в компании стоит BPM-движок, диаграмма перестаёт быть картинкой и становится кодом — и тогда требования к её точности резко возрастают.`}
]}
]},

{id:"b4",icon:"🗄️",title:"Базы данных: SQL и NoSQL",tag:"хард-скилл",color:"blue",
desc:"Когда какая БД, ACID, нормализация, индексы, оконные функции. Практика — в блоке «Тренажёр SQL».",
topics:[
{id:"4-1",title:"Какую БД выбрать — карта решений",
theory:D.db+`
<p><b>На пальцах:</b> нет «лучшей» БД. Есть инструменты под задачу. PostgreSQL — швейцарский нож с гарантиями. Redis — быстрый блокнот под рукой, который живёт в оперативке. Cassandra — склад, куда очень быстро закидывают, но искать неудобно. ClickHouse — калькулятор для миллиардов строк.</p>
<h4>OLTP vs OLAP — ключевое различие</h4>
<table>
<tr><th></th><th>OLTP</th><th>OLAP</th></tr>
<tr><td>Что делает</td><td>Обрабатывает транзакции</td><td>Анализирует данные</td></tr>
<tr><td>Типичный запрос</td><td>«Дай баланс клиента 777»</td><td>«Средний долг по регионам за год»</td></tr>
<tr><td>Объём за запрос</td><td>1-10 строк</td><td>Миллионы строк</td></tr>
<tr><td>Хранение</td><td>По строкам</td><td>По колонкам</td></tr>
<tr><td>Примеры</td><td>PostgreSQL, Oracle</td><td>ClickHouse, BigQuery</td></tr>
</table>
<div class="co mem"><span class="co-i">🧠</span><span><b>Почему колоночное хранение быстрее для аналитики:</b> запрос «средняя сумма долга» читает ОДНУ колонку. В строковой БД придётся поднять с диска все строки целиком, включая ФИО и адреса. В колоночной — только нужный столбец. Отсюда разница в десятки раз.</span></div>
<div class="co fin"><span class="co-i">🏦</span><span><b>Data Lake / DWH / Data Mart:</b> Lake — озеро сырых данных как есть (S3, любой формат, схема при чтении). DWH — хранилище очищенных исторических данных с чёткой схемой. Data Mart — витрина под конкретный отдел, например «должники с просрочкой 30+» для трайба взыскания.</span></div>`,
prac:"Опиши хранилище для системы взыскания: где будут лежать сами дела, где счётчики контактов по 230-ФЗ, где записи звонков, где отчётность для руководства. На каждую БД — одно предложение почему именно она. Это готовый ответ на System Design вопрос.",
questions:[
{q:"В чём разница SQL и NoSQL, когда что выбирать?",
short:"SQL — строгая схема, связи, ACID-транзакции: всё что про деньги и целостность. NoSQL — гибкая схема и горизонтальное масштабирование ценой строгой консистентности: кэш, логи, большие потоки записи, поиск.",
long:`Сильный ответ строится не на «SQL vs NoSQL», а на конкретных задачах:<br><br><b>Реляционная (PostgreSQL)</b> — когда данные связаны и нужна целостность. Займы, платежи, договоры. Транзакция с ACID гарантирует: списали с одного счёта — обязательно зачислили на другой, или откатились оба действия.<br><br><b>Key-value (Redis)</b> — когда нужна скорость и данные временные. Сессии, кэш, счётчики. Ключевая фича — TTL: положил счётчик контактов с клиентом с временем жизни 24 часа, он сам исчезнет.<br><br><b>Документная (MongoDB)</b> — когда структура плавает. Логи событий, профили с произвольными полями.<br><br><b>Wide-column (Cassandra)</b> — когда огромный поток записи и известны шаблоны чтения. Телеметрия, история звонков.<br><br><b>Поисковая (Elasticsearch)</b> — полнотекстовый поиск и логи.<br><br><b>Главное для собеса:</b> современная система почти никогда не на одной БД. Правильный ответ — назвать связку и объяснить роль каждой.`},
{q:"Что такое ACID?",
short:"Четыре гарантии транзакций: Atomicity — всё или ничего, Consistency — данные остаются валидными, Isolation — параллельные транзакции не мешают друг другу, Durability — после коммита данные переживут падение сервера.",
long:`Разберём каждую букву на примере перевода 5000 ₽ в счёт погашения долга:<br><br><b>Atomicity (атомарность).</b> Списать со счёта и уменьшить долг — две операции, но должны выполниться как одна. Упало посередине — откатывается всё. Иначе деньги исчезли, а долг остался.<br><br><b>Consistency (согласованность).</b> После транзакции все правила БД соблюдены: баланс не отрицательный, внешние ключи целы, сумма платежей сходится с историей.<br><br><b>Isolation (изолированность).</b> Два платежа одновременно не должны прочитать один и тот же старый баланс и записать неверный результат. Уровни изоляции: Read Committed (дефолт в PostgreSQL), Repeatable Read, Serializable — чем строже, тем медленнее.<br><br><b>Durability (долговечность).</b> Сервер выключили из розетки через миллисекунду после коммита — данные на месте, потому что записаны в WAL (журнал транзакций) на диск.<br><br><b>Что противопоставляют:</b> BASE в NoSQL — Basically Available, Soft state, Eventually consistent. Данные согласуются, но не мгновенно.`},
{q:"Что такое нормализация и когда от неё отступают?",
short:"Нормализация — устранение дублирования данных: 1NF (атомарные значения), 2NF (нет зависимости от части ключа), 3NF (нет транзитивных зависимостей). Денормализуют сознательно ради скорости чтения — дублируют данные, чтобы не делать тяжёлые JOIN.",
long:`<b>Простое объяснение форм:</b><br><br><b>1NF</b> — в ячейке одно значение. Не «телефоны: +7900..., +7911...» в одном поле, а отдельная таблица телефонов.<br><b>2NF</b> — если ключ составной, каждый неключевой атрибут зависит от всего ключа, а не от части.<br><b>3NF</b> — нет цепочек: атрибут зависит от ключа напрямую, а не через другой атрибут. Классический пример нарушения: в таблице заказов хранить и client_id, и город клиента — город зависит от клиента, а не от заказа.<br><br><b>Когда денормализуют:</b><br>— витрины и отчёты: заранее посчитанные агрегаты<br>— высоконагруженное чтение: хранить «последний статус» рядом с делом, чтобы не собирать его из истории событий<br>— микросервисы: сервис хранит копию нужных ему полей чужого домена, чтобы не ходить синхронно за ними<br><br><b>Цена денормализации</b> — вы обязаны сами следить за согласованностью копий. Обычно это делают через события: изменилось в источнике — прилетело событие — обновили копию.`}
]},
{id:"4-2",title:"Индексы, оконные функции, оптимизация",
theory:`<p><b>Индекс на пальцах:</b> это оглавление книги. Без него, чтобы найти главу, придётся листать все страницы (full scan). С ним — открыл оглавление, сразу перешёл на нужную. Плата: оглавление занимает место и его надо переписывать при каждом изменении книги.</p>
<div class="co mem"><span class="co-i">🧠</span><span><b>Правило левого префикса.</b> Составной индекс <code>(a, b, c)</code> — как телефонный справочник, отсортированный по фамилии, потом имени, потом отчеству. Найти всех «Ивановых» — легко. Найти всех «Сергеевичей» — придётся листать весь справочник, потому что отчество не является началом сортировки. Отсюда: индекс работает по <code>a</code>, по <code>a,b</code>, по <code>a,b,c</code> — но не по одному <code>b</code>.</span></div>
<h4>Оконные функции</h4>
<p>Обычный <code>GROUP BY</code> схлопывает строки. Оконная функция считает по группе, но <b>оставляет все строки на месте</b>.</p>
<ul>
<li><code>ROW_NUMBER() OVER (PARTITION BY client_id ORDER BY dt)</code> — нумерация внутри клиента</li>
<li><code>SUM(amt) OVER (PARTITION BY client_id ORDER BY dt)</code> — нарастающий итог</li>
<li><code>LAG(status) OVER (ORDER BY dt)</code> — предыдущее значение, удобно ловить смену статуса</li>
</ul>
<h4>Оптимизация медленного запроса — порядок действий</h4>
<ol>
<li><code>EXPLAIN ANALYZE</code> — смотрим реальный план и время</li>
<li>Ищем <code>Seq Scan</code> по большой таблице — признак отсутствующего индекса</li>
<li>Проверяем индексы на полях в WHERE, JOIN ON, ORDER BY</li>
<li>Ищем проблему N+1 — запрос в цикле вместо одного JOIN</li>
<li>Тяжёлая регулярная агрегация → материализованное представление</li>
<li>Всё равно медленно → денормализация или отдельное хранилище под чтение</li>
</ol>
<div class="co warn"><span class="co-i">⚠️</span><span>Индексы не бесплатны. Каждый INSERT/UPDATE обновляет все индексы таблицы. На таблице с интенсивной записью 10 индексов заметно замедлят вставку. На собесе это хороший ответ на «когда индекс вредит».</span></div>`,
prac:"Перейди в блок «Тренажёр SQL» и реши задачи 1-4. Там разобраны именно те запросы, которые чаще всего просят написать на собеседовании системного аналитика.",
questions:[
{q:"В чём разница WHERE и HAVING?",
short:"WHERE фильтрует отдельные строки до группировки, HAVING фильтрует уже сформированные группы после GROUP BY. Условие с агрегатной функцией можно писать только в HAVING.",
long:`Порядок выполнения SQL-запроса объясняет всё:<br><br><code>FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT</code><br><br>WHERE отрабатывает <b>раньше</b> группировки — на этом этапе агрегатов ещё не существует, поэтому <code>WHERE SUM(amount) > 1000</code> вызовет ошибку.<br><br>HAVING работает <b>после</b> — уже с готовыми группами.<br><br><b>Практический пример:</b><br><code>SELECT client_id, SUM(amount)<br>FROM payments<br>WHERE paid_at >= '2025-01-01'   -- отбросили старые строки<br>GROUP BY client_id<br>HAVING SUM(amount) > 100000     -- отбросили мелких клиентов</code><br><br>Обратите внимание: фильтр по дате стоит в WHERE, а не в HAVING — так БД отбросит лишние строки <b>до</b> группировки и сделает меньше работы. Это ещё и вопрос производительности, не только синтаксиса.`},
{q:"Что такое оконные функции и зачем они нужны?",
short:"Они считают значение по группе строк, но не схлопывают строки, как GROUP BY. Нужны для нарастающих итогов, нумерации внутри группы, сравнения с предыдущей строкой и отбора «топ-N внутри каждой категории».",
long:`Классическая задача, которую без окон решать больно: <b>«для каждого платежа клиента показать, сколько он выплатил суммарно к этому моменту»</b>.<br><br>Через GROUP BY не выйдет — он схлопнет все платежи клиента в одну строку. Придётся делать коррелированный подзапрос или self-join, и на больших данных это медленно.<br><br>С окном:<br><code>SELECT client_id, paid_at, amount,<br>  SUM(amount) OVER (PARTITION BY client_id ORDER BY paid_at) AS running_total<br>FROM payments</code><br><br>Читается так: «раздели строки на группы по client_id, внутри каждой отсортируй по дате, и для каждой строки просуммируй всё от начала группы до текущей строки».<br><br><b>Вторая частая задача:</b> «взять последний платёж каждого клиента» — <code>ROW_NUMBER() OVER (PARTITION BY client_id ORDER BY paid_at DESC)</code>, затем фильтр <code>= 1</code> во внешнем запросе (внутри WHERE оконку использовать нельзя — она вычисляется позже).<br><br>Умение объяснить именно этот нюанс с WHERE — сильный сигнал на собесе.`},
{q:"Как будете оптимизировать медленный запрос?",
short:"Сначала EXPLAIN ANALYZE — смотрю реальный план. Ищу Seq Scan по большим таблицам, проверяю индексы на полях WHERE/JOIN/ORDER BY, проверяю нет ли N+1. Для тяжёлых регулярных агрегаций — материализованное представление.",
long:`Важно показать, что вы начинаете с <b>измерения</b>, а не с угадывания.<br><br><b>Шаг 1. EXPLAIN ANALYZE.</b> Показывает не предполагаемый, а фактический план с временем каждого шага. Смотрю, где самое дорогое место.<br><br><b>Шаг 2. Типовые находки:</b><br>— <code>Seq Scan</code> по таблице на миллионы строк → нет индекса на поле фильтра<br>— индекс есть, но не используется → часто из-за функции над полем: <code>WHERE date(created_at) = '...'</code> убивает индекс, надо переписать через диапазон<br>— <code>Nested Loop</code> на больших объёмах → возможно, стоит другой тип соединения или не хватает статистики (<code>ANALYZE</code>)<br><br><b>Шаг 3. N+1.</b> Это уже не про SQL, а про код: приложение в цикле делает 1000 запросов вместо одного JOIN. Аналитику важно это распознавать — часто причина в неудачно спроектированном API, который отдаёт список без вложенных данных.<br><br><b>Шаг 4. Если запрос по природе тяжёлый</b> (аналитика по годам данных) — оптимизировать бессмысленно, надо менять подход: материализованное представление, отдельная OLAP-база, предрасчёт витрины по ночам.`}
]}
]},

{id:"b5",icon:"🔌",title:"API и интеграции",tag:"хард-скилл",color:"teal",
desc:"REST, идемпотентность, коды ответов, SOAP/gRPC/GraphQL/WebSocket, OAuth и JWT. Основной блок для финтеха.",
topics:[
{id:"5-1",title:"REST: методы, коды, идемпотентность",
theory:`<table>
<tr><th>Метод</th><th>Назначение</th><th>Идемпотентный</th><th>Безопасный</th></tr>
<tr><td>GET</td><td>Чтение</td><td>✅</td><td>✅ не меняет данные</td></tr>
<tr><td>POST</td><td>Создание</td><td>❌</td><td>❌</td></tr>
<tr><td>PUT</td><td>Полная замена</td><td>✅</td><td>❌</td></tr>
<tr><td>PATCH</td><td>Частичное изменение</td><td>⚠️ зависит</td><td>❌</td></tr>
<tr><td>DELETE</td><td>Удаление</td><td>✅</td><td>❌</td></tr>
</table>
<div class="co mem"><span class="co-i">🧠</span><span><b>Идемпотентность на пальцах:</b> кнопка лифта. Нажал один раз или пять — лифт приедет один раз, результат одинаковый. Это идемпотентно. А вот кнопка «купить билет» — нет: пять нажатий = пять билетов. Поэтому на кнопках оплаты всегда делают защиту через Idempotency-Key.</span></div>
<h4>Коды ответов — минимум для собеса</h4>
<table>
<tr><th>Код</th><th>Смысл</th><th>Когда</th></tr>
<tr><td>200</td><td>OK</td><td>Успешный GET, PUT, PATCH</td></tr>
<tr><td>201</td><td>Created</td><td>POST создал ресурс (+ заголовок Location)</td></tr>
<tr><td>202</td><td>Accepted</td><td>Приняли в обработку, результат позже (асинхронно)</td></tr>
<tr><td>204</td><td>No Content</td><td>Успех, тела ответа нет — типично для DELETE</td></tr>
<tr><td>400</td><td>Bad Request</td><td>Синтаксически кривой запрос</td></tr>
<tr><td>401</td><td>Unauthorized</td><td>Не знаем кто ты — нет/невалиден токен</td></tr>
<tr><td>403</td><td>Forbidden</td><td>Знаем кто ты, но тебе нельзя</td></tr>
<tr><td>404</td><td>Not Found</td><td>Ресурса нет</td></tr>
<tr><td>409</td><td>Conflict</td><td>Конфликт состояния — например, дубль</td></tr>
<tr><td>422</td><td>Unprocessable</td><td>Синтаксис верный, бизнес-правило нарушено</td></tr>
<tr><td>429</td><td>Too Many Requests</td><td>Превышен rate limit</td></tr>
<tr><td>500 / 503</td><td>Ошибка / недоступен</td><td>Проблема на нашей стороне</td></tr>
</table>
<div class="co warn"><span class="co-i">⚠️</span><span><b>Частая ловушка:</b> запрос пустого списка. Если клиент просит <code>/clients?status=active</code> и активных нет — это <b>200 с пустым массивом</b>, ресурс-коллекция существует. А вот <code>/clients/999</code> для несуществующего клиента — <b>404</b>. Разница между «пусто» и «нет такого».</span></div>`,
prac:"Спроектируй 5 эндпоинтов для сущности «обещание оплаты» (promise to pay): создать, получить одно, получить список с фильтром, изменить дату, отменить. Для каждого — метод, путь, коды успеха и минимум два кода ошибки. Проверь себя: есть ли у тебя 409 и 422 и понимаешь ли разницу.",
questions:[
{q:"Что такое идемпотентность и почему это важно?",
short:"Идемпотентный метод при повторном вызове с теми же параметрами даёт тот же результат. Критично при ретраях: если сеть оборвалась и мы не знаем, дошёл ли запрос, повторить безопасно только идемпотентный вызов.",
long:`<b>Проблема на реальном примере.</b> Клиент нажал «оплатить». Приложение отправило POST /payments. Сеть моргнула — ответ не пришёл. Платёж прошёл или нет? Неизвестно. Повторить? Можно списать дважды.<br><br><b>Решение — Idempotency-Key.</b> Клиент генерирует уникальный ключ (UUID) и шлёт его в заголовке. Сервер:<br>1. Смотрит, есть ли уже результат по такому ключу<br>2. Если есть — возвращает сохранённый ответ, ничего не делая<br>3. Если нет — выполняет операцию и сохраняет результат вместе с ключом<br><br>Ключ хранят обычно 24 часа в Redis или отдельной таблице.<br><br><b>Важный нюанс для собеса:</b> PATCH формально не идемпотентен, но зависит от реализации. <code>{"status": "closed"}</code> — идемпотентно. <code>{"balance": "+100"}</code> — нет, каждый вызов прибавляет.<br><br>А ещё DELETE идемпотентен, хотя второй вызов вернёт 404 — но <b>состояние системы</b> после первого и второго вызова одинаковое, а идемпотентность именно про состояние, не про код ответа.`},
{q:"В чём разница 401 и 403?",
short:"401 — сервер не знает, кто вы: токена нет, он протух или невалиден, нужно аутентифицироваться. 403 — сервер вас узнал, но доступ к этому ресурсу вам не положен по правам.",
long:`Мнемоника: <b>401 = «представьтесь»</b>, <b>403 = «вам сюда нельзя»</b>.<br><br><b>Примеры из системы взыскания:</b><br>— Оператор открыл систему без логина → 401<br>— Токен оператора истёк через 15 минут → 401, надо обновить через refresh_token<br>— Оператор авторизован, но лезет в админку настроек лимитов → 403<br>— Оператор пытается открыть дело клиента из чужого региона → 403<br><br><b>Нюанс безопасности, который ценят на собесе:</b> иногда 403 сознательно заменяют на 404. Если пользователь не должен даже знать о существовании ресурса, честный 403 подтверждает, что объект есть. Например, при попытке открыть чужой договор лучше вернуть 404 — иначе перебором можно узнать, какие ID существуют. Это называется предотвращение утечки через коды ответов.`},
{q:"Какой код вернуть на успешный POST и что делать с пустым результатом?",
short:"POST, создавший ресурс — 201 Created с заголовком Location на новый ресурс. Пустой список — 200 с пустым массивом. 404 — только когда конкретного запрошенного ресурса не существует.",
long:`<b>Про 201.</b> Помимо кода стоит вернуть заголовок <code>Location: /promises/12345</code> и тело с созданным объектом. Клиенту не придётся делать второй запрос, чтобы узнать ID.<br><br><b>Про 202 Accepted.</b> Если операция асинхронная (поставили задачу на обзвон, результат будет через час) — правильнее 202 и ссылка на статус операции. Возвращать 201 для того, что ещё не создано — вводить клиента в заблуждение.<br><br><b>Про пустой результат.</b> Разница принципиальная:<br>— <code>GET /clients?region=Урал</code> и там никого → <b>200, []</b>. Коллекция существует, просто пустая. Клиентский код спокойно отрисует пустой список.<br>— <code>GET /clients/999</code> и такого клиента нет → <b>404</b>.<br><br>Если на пустой список отдавать 404, фронтенд будет обрабатывать нормальную ситуацию как ошибку — и в логах появится шум, за которым потеряются настоящие проблемы.`}
]},
{id:"5-2",title:"SOAP, gRPC, GraphQL, WebSocket",
theory:`<table>
<tr><th>Протокол</th><th>Формат</th><th>Где применяют</th><th>Главный плюс</th><th>Главный минус</th></tr>
<tr><td><b>REST</b></td><td>JSON</td><td>Публичные API, мобайл</td><td>Просто, знают все</td><td>Нет пуша с сервера</td></tr>
<tr><td><b>SOAP</b></td><td>XML</td><td>Банки, госсистемы, legacy</td><td>Строгий контракт WSDL, WS-Security</td><td>Тяжёлый, многословный</td></tr>
<tr><td><b>gRPC</b></td><td>Protobuf (бинарь)</td><td>Между микросервисами</td><td>Быстрый, строгая типизация, стриминг</td><td>Не читается глазами, сложнее отладка</td></tr>
<tr><td><b>GraphQL</b></td><td>JSON</td><td>Гибкие фронтенды</td><td>Клиент запрашивает ровно нужные поля</td><td>Сложно кэшировать и лимитировать</td></tr>
<tr><td><b>WebSocket</b></td><td>Любой</td><td>Real-time: торги, чат</td><td>Двусторонняя связь, низкая задержка</td><td>Держит постоянное соединение</td></tr>
</table>
<div class="co mem"><span class="co-i">🧠</span><span><b>Правило выбора для финтеха, запомни как маршрут:</b> наружу к клиентам → <b>REST</b> · между своими сервисами → <b>gRPC</b> · со старым банковским контуром → <b>SOAP</b> · живые обновления на экране → <b>WebSocket</b> · события между доменами → <b>Kafka</b>.</span></div>
<h4>Форматы данных</h4>
<ul>
<li><b>JSON</b> — стандарт для REST. 6 типов: строка, число, булево, null, массив, объект</li>
<li><b>XML</b> — SOAP и legacy. Умеет атрибуты, namespace, валидацию через <b>XSD</b></li>
<li><b>YAML</b> — конфиги: Kubernetes, Docker Compose, OpenAPI. Не для передачи данных между сервисами</li>
<li><b>Protobuf</b> — бинарный формат gRPC, схема описывается в .proto файле</li>
</ul>`,
prac:"Возьми одну интеграцию своего проекта и обоснуй выбор протокола письменно в 3 предложениях: что за взаимодействие, почему этот протокол, что было бы, выбери мы другой. Это готовый мини-ответ на архитектурную часть собеса.",
questions:[
{q:"Что такое WebSocket и чем отличается от REST?",
short:"REST — запрос-ответ, соединение закрывается, сервер сам инициировать обмен не может. WebSocket — одно постоянное соединение, по которому обе стороны шлют сообщения когда угодно. Нужен для real-time.",
long:`<b>Механика:</b> WebSocket начинается как обычный HTTP-запрос с заголовком <code>Upgrade: websocket</code>. Сервер отвечает 101 Switching Protocols, и дальше по тому же TCP-соединению идёт двусторонний обмен кадрами.<br><br><b>Когда действительно нужен:</b><br>— биржевые котировки, меняющиеся десятки раз в секунду<br>— дашборд руководителя кол-центра: статусы звонков обновляются мгновенно<br>— чат, совместное редактирование<br><br><b>Когда не нужен, хотя хочется:</b> уведомление раз в минуту прекрасно живёт на обычном polling. WebSocket — это постоянно занятое соединение и память на сервере под каждого клиента.<br><br><b>Что спросят следом:</b> как масштабировать? Ответ: балансировщик со sticky sessions (клиент всегда на один и тот же инстанс), а рассылка между инстансами через Redis Pub/Sub или Kafka. Если этого не сделать, при нескольких репликах сообщение уйдёт только тем, кто подключён к «правильному» серверу.<br><br><b>Альтернатива попроще:</b> Server-Sent Events (SSE), если поток нужен только в одну сторону — от сервера к клиенту.`},
{q:"Что такое ESB и когда его используют?",
short:"Enterprise Service Bus — централизованная шина интеграции. Вместо N² прямых связей между системами все подключаются к шине, которая занимается маршрутизацией и трансформацией форматов. Типична для крупных корпораций с legacy.",
long:`<b>Проблема, которую решает ESB:</b> 10 систем, каждая должна общаться с каждой — это 45 интеграций. Добавили 11-ю — плюс 10 новых. Растёт квадратично.<br><br><b>Решение ESB:</b> каждая система подключается к шине один раз. Шина маршрутизирует, конвертирует форматы (XML в JSON), оркеструет вызовы, ведёт лог.<br><br><b>Почему от ESB уходят:</b><br>— шина становится узким местом: вся нагрузка через один компонент<br>— единая точка отказа: упала шина — встало всё<br>— бизнес-логика расползается в конфиги шины, и никто не понимает, где что происходит<br>— релизный цикл: изменение в шине затрагивает всех, деплой согласовывают неделями<br><br><b>Что вместо:</b> для асинхронного обмена — брокер сообщений (Kafka), для синхронного входа снаружи — API Gateway, для сервисной сетки — Service Mesh.<br><br><b>Каверзный вопрос с собеса:</b> «У нас 50+ микросервисов, какая интеграция лучше?» Правильный ответ — событийная через Kafka плюс API Gateway на входе, а не ESB. ESB — это про интеграцию монолитных legacy-систем, а не про микросервисы.`},
{q:"Чем gRPC лучше REST и когда его выбирать?",
short:"gRPC работает на HTTP/2 с бинарным Protobuf: быстрее, компактнее, со строгим контрактом и генерацией клиентского кода. Выбирают для внутреннего взаимодействия микросервисов, где важна скорость и не нужна читаемость.",
long:`<b>Почему быстрее:</b><br>— Protobuf бинарный и компактнее JSON примерно втрое<br>— HTTP/2 мультиплексирует несколько запросов в одном соединении, без «head-of-line blocking» как в HTTP/1.1<br>— сериализация/десериализация дешевле парсинга JSON<br><br><b>Строгий контракт.</b> Схема описывается в <code>.proto</code> файле, из него генерируются клиент и сервер на любом языке. Изменил схему — код перестал компилироваться. Это дисциплинирует куда сильнее, чем документация в Confluence.<br><br><b>Четыре режима вызова:</b> унарный (обычный запрос-ответ), стриминг от сервера, стриминг от клиента, двунаправленный. Последние три — то, чего в REST просто нет.<br><br><b>Почему не наружу:</b> браузер напрямую gRPC не умеет (нужен gRPC-Web и прокси), нельзя посмотреть запрос глазами в логе, сложнее отлаживать через curl.<br><br><b>Роль аналитика:</b> при gRPC-интеграции постановка — это, по сути, .proto контракт. Описывать надо не URL и коды HTTP, а сообщения, поля, их типы, обязательность и правила совместимости (нельзя переиспользовать номера полей!).`}
]},
{id:"5-3",title:"Аутентификация: OAuth 2.0, JWT, RBAC",
theory:`<div class="co mem"><span class="co-i">🧠</span><span><b>Аутентификация vs авторизация:</b> аутентификация — <b>«кто ты?»</b> (паспорт на входе). Авторизация — <b>«что тебе можно?»</b> (какие двери открывает твой пропуск). Мнемоника: <b>Аутентификация</b> — <b>А</b>нкета, <b>Авторизация</b> — <b>А</b>ссортимент прав.</span></div>
<h4>OAuth 2.0 — Authorization Code Flow по шагам</h4>
<ol>
<li>Пользователь жмёт «Войти через Сбер ID»</li>
<li>Наше приложение редиректит его на сервер авторизации</li>
<li>Пользователь вводит логин/пароль <b>там</b> — мы пароль не видим</li>
<li>Сервер авторизации возвращает нам одноразовый <b>authorization code</b></li>
<li>Бэкенд обменивает code на <b>access_token + refresh_token</b> (server-to-server, с client_secret)</li>
<li>С access_token ходим за данными в Resource Server</li>
</ol>
<div class="co tip"><span class="co-i">💡</span><span>Зачем промежуточный code, почему не отдать токен сразу? Потому что code летит через браузер (виден в URL и истории), а обмен на токен идёт по защищённому каналу с бэкенда, с проверкой client_secret. Токен в браузере никогда не появляется.</span></div>
<h4>JWT</h4>
<p>Три части через точку: <code>header.payload.signature</code>. Payload содержит claims: user_id, роли, время истечения. Сервер проверяет подпись — и всё, поход в БД не нужен. Это делает JWT быстрым и stateless.</p>
<div class="co warn"><span class="co-i">⚠️</span><span><b>Главная слабость JWT:</b> его нельзя отозвать. Уволили сотрудника — его токен работает до истечения TTL. Лечится коротким TTL (15 минут) + refresh_token, либо чёрным списком в Redis (но тогда теряется stateless).<br><br>И ещё: payload JWT только <b>закодирован</b> base64, а не зашифрован. Любой может его прочитать. Персональные данные туда класть нельзя.</span></div>
<h4>Модели авторизации</h4>
<table>
<tr><th>Модель</th><th>Принцип</th><th>Где</th></tr>
<tr><td><b>RBAC</b></td><td>Права по роли</td><td>Большинство корпоративных систем</td></tr>
<tr><td><b>ABAC</b></td><td>По атрибутам: отдел + время + гео</td><td>Гибкие политики, Zero Trust</td></tr>
<tr><td><b>ACL</b></td><td>Список прав на каждый объект</td><td>Файловые системы, документы</td></tr>
<tr><td><b>MAC</b></td><td>Уровни секретности</td><td>Госсистемы, гостайна</td></tr>
</table>`,
prac:"Опиши матрицу ролей для системы взыскания: оператор, старший оператор, юрист, администратор. Для каждой — что может видеть и что менять. Выпиши хотя бы один случай, где RBAC не хватает и нужен ABAC (подсказка: доступ к делам своего региона).",
questions:[
{q:"Как работает OAuth 2.0 и зачем нужен refresh_token?",
short:"OAuth 2.0 позволяет приложению действовать от имени пользователя, не зная его пароля. Access_token делают короткоживущим (15-60 мин) на случай утечки, а refresh_token позволяет тихо получить новый без повторного логина.",
long:`<b>Четыре роли в OAuth:</b><br>— Resource Owner — пользователь, владелец данных<br>— Client — наше приложение<br>— Authorization Server — выдаёт токены<br>— Resource Server — хранит данные, проверяет токен<br><br><b>Про баланс безопасности и удобства.</b> Если access_token жил бы месяц, его утечка означала бы месяц доступа злоумышленника. Если бы жил 15 минут без refresh — пользователь логинился бы каждые 15 минут.<br><br>Решение: access_token короткий, refresh_token долгий, но хранится только на бэкенде и используется один раз (rotation — при обмене выдаётся новый refresh, старый инвалидируется). Если один и тот же refresh пришёл дважды — значит его украли, инвалидируем всю цепочку.<br><br><b>PKCE</b> — обязательное расширение для мобильных и SPA, где client_secret хранить негде. Клиент генерирует случайную строку, шлёт её хэш при запросе кода, а при обмене — саму строку. Перехвативший код не сможет им воспользоваться.`},
{q:"Что такое JWT и в чём его слабое место?",
short:"JWT — самодостаточный токен из трёх частей, подписанный сервером. Позволяет проверить пользователя без обращения к БД. Слабость — его нельзя мгновенно отозвать, поэтому TTL делают коротким и добавляют refresh_token.",
long:`<b>Структура:</b><br>— <b>Header</b> — алгоритм подписи (например RS256)<br>— <b>Payload</b> — claims: sub (кто), exp (до когда), roles, произвольные поля<br>— <b>Signature</b> — подпись header+payload секретом или приватным ключом<br><br><b>Почему это удобно:</b> любой сервис, знающий публичный ключ, проверит токен локально. Нет центрального узла, к которому все ходят за проверкой — это хорошо масштабируется.<br><br><b>Три реальные проблемы:</b><br>1. <b>Отзыв.</b> Уволенный сотрудник ходит с валидным токеном до истечения TTL. Решения: короткий TTL, blacklist в Redis, версия токена в профиле пользователя.<br>2. <b>Размер.</b> Токен летит в каждом запросе. Напихали ролей и прав — заголовок раздулся до килобайтов.<br>3. <b>Открытость payload.</b> Base64 — это кодирование, а не шифрование. Любой раскодирует. ФИО, телефон, паспорт туда класть нельзя — это утечка ПДн по 152-ФЗ.<br><br><b>Когда лучше обычная сессия:</b> если у вас один монолит и нужен мгновенный отзыв доступа — серверная сессия в Redis проще и честнее.`}
]}
]}
];

{id:"b6",icon:"📨",title:"Kafka и RabbitMQ",tag:"must know",color:"amber",
desc:"Два главных брокера финтеха. Как устроены внутри, чем отличаются, что спрашивают на собесах.",
topics:[
{id:"6-1",title:"Kafka — как это работает",
theory:`<p><b>На пальцах.</b> Представь подъездный почтовый ящик, но особенный: письма из него <b>не пропадают</b> после того, как их прочитали. Почтальон (Producer) кидает письма. Ящик разделён на несколько отсеков (партиций) — чтобы несколько почтальонов клали параллельно и не толкались.</p>
<p>Жильцы (Consumers) читают письма. Каждый помнит, на каком письме остановился — это его <b>offset</b>. Одна семья (Consumer Group) договорилась: ты читаешь первый отсек, я второй. Другая семья (другая Group) читает те же письма со своей закладкой и никак первой не мешает.</p>
`+D.kafka+`
<h4>Словарь</h4>
<table>
<tr><th>Термин</th><th>Что это</th></tr>
<tr><td><b>Topic</b></td><td>Именованный поток событий, например payment-events</td></tr>
<tr><td><b>Partition</b></td><td>Часть топика. Внутри партиции порядок строго сохраняется</td></tr>
<tr><td><b>Offset</b></td><td>Номер сообщения в партиции. Хранится у консьюмера, не у брокера</td></tr>
<tr><td><b>Consumer Group</b></td><td>Команда консьюмеров. Одна партиция — ровно одному участнику группы</td></tr>
<tr><td><b>Lag</b></td><td>Отставание: сколько сообщений консьюмер ещё не прочитал</td></tr>
<tr><td><b>Retention</b></td><td>Сколько хранить сообщения (по времени или объёму)</td></tr>
</table>
<div class="co mem"><span class="co-i">🧠</span><span><b>Три вещи, которые надо запомнить про Kafka намертво:</b><br>1. Сообщения <b>не удаляются</b> после чтения — их удаляет только retention по времени.<br>2. Порядок гарантирован <b>только внутри партиции</b>, не внутри топика.<br>3. Число консьюмеров в группе больше числа партиций = лишние простаивают.</span></div>
<div class="co warn"><span class="co-i">⚠️</span><span>Отсюда важное следствие: <b>число партиций — это потолок параллелизма</b>. 3 партиции = максимум 3 работающих консьюмера в группе. Увеличить партиции можно, уменьшить — нет.</span></div>`,
prac:"Придумай partition key для топика «события по делам взыскания». Проверь себя двумя вопросами: 1) сохранится ли порядок событий по одному делу? 2) не станет ли какой-то ключ горячим, забирая непропорционально много трафика? Правильный ответ обычно case_id — порядок по делу важен, а дел много, значит нагрузка размажется.",
questions:[
{q:"Объясните, как работает Kafka.",
short:"Producer пишет события в топик, топик разбит на партиции. Consumer Group читает партиции, каждый участник — свои. Позиция чтения (offset) хранится у консьюмера. Сообщения не удаляются после чтения — их чистит retention.",
long:`Хорошо звучит объяснение через метафору, а потом через механику.<br><br><b>Метафора:</b> почтовый ящик, где письма не исчезают после прочтения. Каждый читатель помнит свою закладку. Разные группы читателей читают независимо.<br><br><b>Механика:</b> Kafka — это распределённый лог с добавлением в конец (append-only log). Именно поэтому она такая быстрая: запись в конец файла — самая дешёвая операция на диске, плюс используется zero-copy при отдаче данных.<br><br><b>Почему партиции:</b> один файл-лог не масштабируется. Разбили топик на партиции, разложили по разным брокерам — теперь и запись, и чтение параллельны.<br><br><b>Ключевое отличие от очереди:</b> в классической очереди сообщение забирает один потребитель и оно исчезает. В Kafka сообщение читают все желающие группы, и оно остаётся. Именно поэтому Kafka — про <b>события</b> («платёж поступил» — интересно трём разным сервисам), а очередь — про <b>задачи</b> («позвонить клиенту» — нужно сделать один раз).`},
{q:"Как гарантировать порядок обработки сообщений?",
short:"Порядок Kafka гарантирует только внутри партиции. Значит, все события одной сущности должны попадать в одну партицию — задаётся через partition key, обычно это ID сущности: hash(client_id) % число_партиций.",
long:`<b>Почему так устроено.</b> Глобальный порядок по всему топику означал бы одну партицию и, соответственно, нулевой параллелизм. Kafka сознательно жертвует глобальным порядком ради масштабируемости.<br><br><b>Как применять.</b> Продюсер указывает ключ: <code>producer.send(topic, key=case_id, value=event)</code>. Kafka считает хэш ключа и всегда кладёт события с этим ключом в одну и ту же партицию. Значит, события «дело создано → назначен оператор → дело закрыто» придут строго в этом порядке.<br><br><b>Три подводных камня:</b><br>1. <b>Hot partition.</b> Если ключ распределён неравномерно (например, region_id и 80% клиентов в Москве) — одна партиция задыхается, остальные простаивают.<br>2. <b>Изменение числа партиций ломает раскладку.</b> hash % 3 и hash % 6 дают разные результаты — старые и новые события одного дела попадут в разные партиции, порядок нарушится.<br>3. <b>Многопоточная обработка внутри консьюмера</b> убивает порядок, даже если Kafka его дала. Читать надо последовательно или партиционировать потоки тем же ключом.`},
{q:"Что такое consumer lag и почему его мониторят?",
short:"Lag — разница между последним сообщением в партиции и позицией консьюмера. Растущий lag означает, что консьюмер не успевает за потоком. Это первая метрика, на которую смотрят при инцидентах с Kafka.",
long:`<b>Формула:</b> lag = log_end_offset − consumer_offset. Считается по каждой партиции, важен и суммарный, и максимальный по партициям.<br><br><b>Как читать график lag:</b><br>— <b>Ровный ноль</b> — обработка в реальном времени.<br>— <b>Пилообразный</b> — всплески нагрузки, между ними догоняет. Нормально, если пики не растут.<br>— <b>Линейный рост</b> — консьюмер систематически медленнее продюсера. Нужно масштабировать или оптимизировать.<br>— <b>Резкий скачок и плато</b> — консьюмер упал или завис.<br>— <b>Растёт только на одной партиции</b> — hot partition или зависший конкретный инстанс.<br><br><b>Бизнес-смысл в системе взыскания:</b> lag по топику payment-events означает, что клиент уже заплатил, а система об этом ещё не знает. Робот может позвонить человеку, который только что погасил долг. Это репутационный риск и жалоба.<br><br><b>Что настраивают:</b> алерт не на абсолютное значение lag, а на время отставания (lag / скорость обработки). 10 000 сообщений при скорости 10 000/сек — это 1 секунда, не проблема. При скорости 100/сек — это 100 секунд, уже плохо.`},
{q:"Что такое rebalancing и чем он опасен?",
short:"Перераспределение партиций между консьюмерами группы при изменении её состава. Опасен тем, что во время ребалансировки вся группа останавливает чтение. Частые ребалансировки — группа больше перестраивается, чем работает.",
long:`<b>Что запускает ребалансировку:</b> консьюмер упал или добавился, консьюмер не прислал heartbeat вовремя, изменилось число партиций.<br><br><b>Главная скрытая причина в проде:</b> консьюмер превысил <code>max.poll.interval.ms</code>. Он забрал батч сообщений, начал их обрабатывать, обработка затянулась (например, синхронный вызов внешнего API с таймаутом), брокер решил что консьюмер умер и запустил ребалансировку. Консьюмер очнулся, попытался закоммитить offset — а его уже выгнали из группы. Сообщения обработаются повторно, и цикл повторяется.<br><br><b>Как лечить:</b><br>— уменьшить <code>max.poll.records</code> (брать меньше за раз)<br>— увеличить <code>max.poll.interval.ms</code><br>— вынести тяжёлую обработку в отдельный пул потоков, а poll делать регулярно<br>— <b>static group membership</b> (<code>group.instance.id</code>) — при перезапуске пода консьюмер возвращается на свои партиции без полной ребалансировки. Очень полезно в Kubernetes, где поды перезапускаются регулярно<br>— cooperative rebalancing вместо eager: перераспределяются только нужные партиции, остальные продолжают работать`},
{q:"Что такое retention и log compaction?",
short:"Retention — правило удаления старых сообщений по времени или объёму. Log compaction — альтернатива: Kafka хранит только последнее значение для каждого ключа, превращая топик в таблицу актуальных состояний.",
long:`<b>Retention.</b> Настраивается через <code>retention.ms</code> (например, 7 дней) и <code>retention.bytes</code>. Что старше или больше — удаляется целыми сегментами файлов. Важно: удаление не зависит от того, прочитал кто-то сообщение или нет. Если консьюмер лежал неделю при retention 7 дней — часть данных он потеряет навсегда.<br><br><b>Log compaction</b> работает иначе. Для каждого ключа Kafka оставляет только самую свежую запись, старые версии подчищает фоновый процесс.<br><br><b>Зачем это на практике:</b> топик <code>client-status</code> с compaction содержит по одной актуальной записи на каждого клиента. Новый сервис поднялся, прочитал топик с начала — и сразу получил полный снимок состояния всех клиентов. Не надо переваривать миллионы исторических событий и не нужен отдельный API для «дай мне текущие статусы».<br><br><b>Tombstone:</b> чтобы удалить ключ из compacted-топика, публикуют сообщение с этим ключом и <code>null</code> в значении. Это «надгробие» — сигнал, что запись надо удалить.<br><br><b>Что выбрать:</b> история событий (аудит, аналитика) → retention. Текущее состояние объектов → compaction.`},
{q:"Как настроить Kafka, чтобы точно не потерять сообщение?",
short:"На продюсере acks=all и retries, на топике replication.factor=3 и min.insync.replicas=2, на консьюмере ручной коммит offset после успешной обработки. Плюс идемпотентность на стороне получателя.",
