long:`<b>Пример, который всегда работает на собесе.</b> Слово «клиент» в банке:<br>— В <b>онбординге</b>: анкета, паспорт, результат проверки KYC<br>— В <b>скоринге</b>: доход, кредитная история, показатель долговой нагрузки<br>— Во <b>взыскании</b>: сумма долга, дни просрочки, контакты, история звонков, ограничения по 230-ФЗ<br><br>Физически это один человек. Но пытаться сделать единую модель «Клиент» на весь банк — прямой путь к сущности с двумястами полями, которую все боятся трогать.<br><br><b>Что даёт правильное выделение контекстов:</b><br>1. <b>Границы сервисов.</b> Контекст — естественный кандидат на микросервис. Внутри высокая связность, наружу — узкий контракт.<br>2. <b>Автономия команд.</b> Команда владеет контекстом целиком и меняет его модель, не согласовывая со всеми.<br>3. <b>Ясность в общении.</b> Внутри контекста термины не требуют уточнения.<br><br><b>Context Map</b> — карта связей между контекстами: кто чей поставщик данных, где нужен антикоррупционный слой (Anti-Corruption Layer) для защиты своей модели от чужой. Для аналитика в крупной системе это один из самых полезных артефактов.`}
]},
{id:"11-2",title:"Trade-off мышление и выбор трека",
theory:`<p><b>Главное отличие архитектора от сеньора</b> — не в объёме знаний, а в готовности назвать цену решения. Сеньор знает, что такое Kafka. Архитектор говорит, чем придётся заплатить за её внедрение: эксплуатация, экспертиза в команде, сложность отладки, задержка.</p>
<div class="co tip"><span class="co-i">💡</span><span><b>Шаблон архитектурного ответа:</b><br>«В условиях <i>[контекст: нагрузка, команда, бюджет, регуляторика]</i> я выбираю <i>[решение]</i>, потому что <i>[бизнес-выгода]</i>.<br>Плачу за это <i>[конкретный компромисс]</i>.<br>Если бы <i>[условие изменилось]</i>, выбрал бы <i>[альтернатива]</i>.»<br><br>Заучите эту конструкцию. Она вытянет ответ даже на незнакомой теме, потому что показывает способ мышления, а не знание фактов.</span></div>
<h4>Два трека роста</h4>
<table>
<tr><th></th><th>Технический</th><th>Продуктовый</th></tr>
<tr><td>Следующая роль</td><td>Solution / System Architect</td><td>Product Owner, Head of Analytics</td></tr>
<tr><td>Ежедневная работа</td><td>Архитектурные решения, RFC, ревью, НФТ</td><td>Приоритизация, метрики, переговоры</td></tr>
<tr><td>Что прокачивать</td><td>Распределённые системы, DDD, отказоустойчивость</td><td>Юнит-экономика, продуктовые метрики, влияние</td></tr>
<tr><td>Источник энергии</td><td>Красивое инженерное решение</td><td>Убедил бизнес, метрика выросла</td></tr>
</table>
<div class="co mem"><span class="co-i">🧠</span><span><b>Как выбрать честно.</b> Не спрашивайте себя «что интереснее» — оба интересны в теории. Спросите: <b>после какой встречи вы выходите с энергией, а после какой выжатым?</b> После двухчасового обсуждения схемы интеграции или после защиты приоритетов перед бизнесом? Тело отвечает честнее головы.</span></div>`,
prac:"Напиши одностраничный ADR (Architecture Decision Record) по любому решению своего проекта: контекст, варианты которые рассматривали, выбранный вариант, обоснование, последствия и риски. Это и полезный документ, и готовый материал для рассказа на собеседовании.",
questions:[
{q:"Как выбрать между техническим и продуктовым треком?",
short:"Смотреть не на зарплату, а на то, от чего появляется энергия. Практический способ — попросить участие в архитектурных обсуждениях и в продуктовых приоритизациях, побыть в обоих по два-три месяца и понаблюдать за собой.",
long:`<b>Что реально отличается в ежедневной работе:</b><br><br><b>Архитектор</b> проводит день в обсуждении технических решений, пишет и ревьюит RFC, разбирает инциденты, спорит о границах сервисов и нефункциональных требованиях. Его успех — система, которая держит нагрузку и которую легко менять.<br><br><b>Product Owner</b> проводит день в разговорах с бизнесом и пользователями, приоритизирует бэклог, защищает решения перед стейкхолдерами, смотрит на метрики. Его успех — продукт, который решает проблему и приносит деньги.<br><br><b>Общее у обоих:</b> оба много общаются и оба несут ответственность за решения. Разница в природе решений — техническая или продуктовая.<br><br><b>Практический совет:</b> не обязательно решать навсегда. Есть роли на стыке — technical product manager, платформенный аналитик. Часто самая ценная позиция — человек, который понимает обе стороны и переводит между ними. Собственно, это и есть эволюция роли системного аналитика.<br><br><b>Чего точно не стоит делать</b> — выбирать трек по тому, где больше платят прямо сейчас. Рынок меняется, а работать с этим каждый день.`}
]}
]},

{id:"b12",icon:"🎯",title:"Подготовка к собеседованию",tag:"финал",color:"green",
desc:"Рассказ о себе, метод STAR, работа с незнакомыми вопросами, вопросы работодателю.",
topics:[
{id:"12-1",title:"Рассказ о себе и метод STAR",
theory:`<h4>Структура рассказа о себе — 2-3 минуты</h4>
<ol>
<li><b>Кто и где.</b> «Системный аналитик в [компания], проект [название] — это [одно предложение о продукте]»</li>
<li><b>За что отвечаю.</b> Одна-две ключевые зоны ответственности</li>
<li><b>Архитектура.</b> Монолит / микросервисы / переход между ними</li>
<li><b>Интеграции.</b> REST, Kafka, SOAP, gRPC — только то, с чем реально работал</li>
<li><b>Нотации и БД.</b> Что рисуете, с чем работаете</li>
<li><b>Чего ищу.</b> Одно предложение</li>
</ol>
<div class="co warn"><span class="co-i">⚠️</span><span>Не перечисляйте весь стек из резюме. Четыре технологии, о которых вы можете говорить 10 минут с примерами, звучат сильнее пятнадцати, названных списком. Всё, что назвали, будут спрашивать — это правило.</span></div>
<h4>Метод STAR для поведенческих вопросов</h4>
<ul>
<li><b>S</b>ituation — контекст в двух предложениях</li>
<li><b>T</b>ask — какая задача стояла лично перед вами</li>
<li><b>A</b>ction — что сделали <b>вы</b> (не «мы командой», а «я»)</li>
<li><b>R</b>esult — результат, желательно в числах</li>
</ul>
<div class="co ex"><span class="co-i">💬</span><span><b>Пример STAR:</b><br><b>S:</b> «Робот-коллектор дублировал звонки: клиенту могли позвонить дважды за день, приходили жалобы.»<br><b>T:</b> «Мне поручили разобраться и предложить решение.»<br><b>A:</b> «Я собрал логи, нашёл причину — два независимых процесса ставили задачи и не видели друг друга. Предложил централизованную проверку лимитов через Redis перед постановкой задачи, описал требования с учётом 230-ФЗ и часовых поясов, согласовал с командой и юристами.»<br><b>R:</b> «Дубли ушли полностью, жалобы по этой причине прекратились, решение переиспользовали для SMS-канала.»</span></div>`,
prac:"Подготовь 5 историй по STAR заранее: сложная задача, конфликт со стейкхолдером, ошибка и как исправлял, влияние на продукт, работа в условиях неопределённости. Проговори каждую вслух с таймером — уложиться надо в 2 минуты. Одни и те же истории закрывают большинство поведенческих вопросов.",
questions:[
{q:"Расскажите о себе.",
short:"Кратко: текущая роль и домен, зона ответственности, архитектура и интеграции на проекте, нотации и инструменты, чего ищу дальше. Две-три минуты, без пересказа резюме.",
long:`<b>Что делает рассказ сильным:</b><br><br><b>1. Начинайте с контекста продукта, а не должности.</b> Не «я системный аналитик с опытом 4 года», а «я работаю над роботом-коллектором — системой, которая автоматически связывается с должниками на ранних стадиях просрочки». Интервьюер сразу представил задачу.<br><br><b>2. Конкретика вместо списка.</b> Не «работал с Kafka», а «через Kafka у нас идут события по делам взыскания, я описывал контракты событий и разбирался с проблемой дублей при ребалансировке». Второе невозможно сказать, не поработав.<br><br><b>3. Масштаб цифрами.</b> «2 млн звонков в день», «база на 40 млн клиентов» — это сразу задаёт уровень задач.<br><br><b>4. Заканчивайте тем, что ищете.</b> Это переводит разговор в диалог и показывает, что вы выбираете, а не только вас.<br><br><b>Чего избегать:</b> хронологии с первого места работы, перечисления всех технологий, оправданий за пробелы в резюме (спросят — ответите).`},
{q:"Что делать, если не знаете ответа?",
short:"Честно сказать, что с этим не работал, и предложить рассуждение по аналогии или логике. На сеньорском уровне ход мысли ценится выше заученного определения, а попытка блефовать считывается моментально.",
long:`<b>Три рабочие формулировки:</b><br><br>1. <b>По аналогии:</b> «Напрямую с этим не работал, но по описанию похоже на [знакомая технология]. Если логика та же, то работать должно так... Поправьте, если ошибаюсь.»<br><br>2. <b>Через рассуждение:</b> «Точного определения не помню, но давайте порассуждаю: раз задача такая-то, значит решение должно обеспечивать вот это...» Часто в процессе выходите на верный ответ.<br><br>3. <b>Честно и с планом:</b> «Это за пределами моего опыта. Если бы столкнулся, начал бы с документации и разговора с командой, которая это эксплуатирует.»<br><br><b>Почему это работает.</b> Интервьюер часто задаёт заведомо незнакомый вопрос именно чтобы посмотреть на реакцию. Спокойное «не знаю, но рассуждал бы так» — сильный сигнал. Уверенная выдумка — красный флаг, потому что в работе такой человек так же уверенно нафантазирует в постановке.<br><br><b>Отдельно:</b> не стоит извиняться и оправдываться. Одна фраза «с этим не сталкивался» — и сразу конструктив.`},
{q:"Какие вопросы задать работодателю?",
short:"Спрашивайте про то, что реально влияет на вашу работу: как устроен процесс от идеи до прода, кто принимает решения по требованиям, как выглядит успех в этой роли через полгода, какой самый болезненный технический долг.",
long:`Вопросы кандидата оцениваются не меньше ответов. Сильные варианты:<br><br><b>Про процесс:</b> «Как задача проходит путь от идеи до прода? Кто участвует на каждом этапе?» — вы поймёте зрелость процессов и свою роль в них.<br><br><b>Про полномочия:</b> «Кто принимает финальное решение, если аналитик и разработчик не согласны в подходе?» — покажет, есть ли у вас право голоса.<br><br><b>Про ожидания:</b> «Как будет выглядеть успех в этой роли через полгода?» — очень практичный вопрос, ответ на него часто говорит больше, чем вакансия.<br><br><b>Про боль:</b> «Какая самая большая проблема в системе сейчас, которую вы хотели бы решить?» — честный ответ покажет реальное состояние проекта, уклончивый тоже кое-что скажет.<br><br><b>Про команду:</b> «Сколько аналитиков, как распределяются домены?»<br><br><b>Чего не спрашивать на первом этапе:</b> отпуск, переработки, ДМС — это вопросы к HR на финальной стадии, а не к техническому интервьюеру.`}
]}
]},

const MSP = {id:"b7b",icon:"🧩",title:"Паттерны микросервисов",tag:"архитектура",color:"blue",
desc:"Gateway, Service Discovery, Strangler Fig, Sidecar, Bulkhead, CQRS. Каждый паттерн — с интерактивной схемой.",
topics:[

{id:"7b-1",title:"API Gateway, BFF и Aggregator",
theory:`<p><b>Проблема.</b> Сервисов стало 40. Мобильное приложение должно знать адрес каждого, само проверять токен, само собирать данные из пяти источников для одного экрана. Клиент превращается в монолит, а любое изменение внутри бэкенда ломает всех клиентов сразу.</p>
`+D.gateway+`
<h4>Что берёт на себя Gateway</h4>
<ul>
<li><b>Единая точка входа</b> — клиент знает один адрес вместо сорока</li>
<li><b>Аутентификация и авторизация</b> — проверка токена в одном месте, сервисы получают уже проверенный контекст</li>
<li><b>Rate limiting</b> — защита от перегрузки и злоупотреблений</li>
<li><b>Маршрутизация и версионирование</b> — <code>/v2/loans</code> уходит на новый сервис, <code>/v1/loans</code> на старый</li>
<li><b>Агрегация</b> — один запрос от клиента превращается в несколько внутренних</li>
</ul>
<h4>BFF — Backend For Frontend</h4>
<p>Развитие идеи: у мобильного приложения и веба разные потребности. Мобильному нужен компактный ответ (экономим трафик), вебу — расширенный. Вместо одного «универсального» Gateway с кучей условий делают отдельный BFF под каждый тип клиента.</p>
<div class="co mem"><span class="co-i">🧠</span><span><b>Как запомнить разницу:</b> <b>Gateway</b> — один вход для всех, общая инфраструктурная логика. <b>BFF</b> — свой вход под каждый тип клиента, заточенный под его экраны. Gateway — вахтёр на входе в бизнес-центр, BFF — личный ассистент конкретного отдела.</span></div>
<h4>Aggregator / Scatter-Gather</h4>
`+D.scatter+`
<div class="co warn"><span class="co-i">⚠️</span><span><b>Главный риск Gateway</b> — он становится единой точкой отказа и узким местом. Обязательно: несколько инстансов за балансировщиком, таймауты на каждый внутренний вызов, и запрет складывать в него бизнес-логику. Как только в Gateway появляется расчёт пени — вы построили новый монолит, только распределённый.</span></div>`,
prac:"Возьми один экран своего продукта (например, карточку должника) и посчитай: из скольких сервисов нужны данные? Сколько запросов делает фронт сейчас? Стало бы лучше с агрегацией на бэкенде? Прикинь время ответа при последовательных и параллельных вызовах — разница обычно впечатляет.",
questions:[
{q:"Что такое API Gateway и зачем он нужен?",
short:"Единая точка входа для внешних клиентов. Берёт на себя аутентификацию, rate limiting, маршрутизацию к нужному сервису и агрегацию ответов. Клиенты не знают о внутренней структуре системы.",
long:`<b>Что было бы без Gateway:</b> каждый клиент знает адреса всех сервисов, каждый сервис сам проверяет токены и лимиты, а изменение внутренней структуры ломает всех клиентов.<br><br><b>Функции по важности:</b><br>1. <b>Аутентификация</b> — один раз на входе, дальше сервисы доверяют проверенному контексту. Это снимает дублирование логики безопасности из сорока сервисов.<br>2. <b>Маршрутизация и версионирование</b> — можно переключить <code>/loans</code> со старого сервиса на новый, не трогая клиентов.<br>3. <b>Rate limiting и защита</b> — периметр, где отсекается лишний трафик.<br>4. <b>Агрегация</b> — экономит round-trip'ы для мобильных клиентов на плохой сети.<br><br><b>Главные риски и как их снимают:</b> Gateway — единая точка отказа, поэтому его разворачивают в нескольких инстансах за балансировщиком. И второе — соблазн положить в него бизнес-логику. Правило простое: в Gateway живёт только то, что одинаково для всех сервисов. Любой расчёт, специфичный для домена, — это уже сервис.<br><br><b>Инструменты:</b> Kong, Nginx, Spring Cloud Gateway, AWS API Gateway, или Ingress в Kubernetes.`},
{q:"Чем BFF отличается от API Gateway?",
short:"Gateway — одна общая точка входа для всех клиентов. BFF — отдельный бэкенд под каждый тип клиента: свой для мобильного, свой для веба. BFF содержит логику сборки данных под конкретные экраны.",
long:`<b>Откуда взялся BFF.</b> Когда клиентов несколько и потребности разные, универсальный Gateway обрастает условиями: «если мобильный — отдай короткий ответ, если веб — полный, если партнёр — вот эти поля скрой». Это становится неподдерживаемым.<br><br><b>Решение:</b> у каждого типа клиента свой BFF. Команда мобильной разработки владеет мобильным BFF и меняет его вместе с приложением, не согласовывая с вебом.<br><br><b>Пример из банковского приложения:</b> для мобильного экрана «мои долги» BFF собирает данные из четырёх сервисов и отдаёт компактный JSON с уже посчитанной суммой. Веб-версия того же экрана показывает детализацию — её BFF отдаёт развёрнутую структуру.<br><br><b>Когда BFF избыточен:</b> если клиент один или потребности почти совпадают, достаточно Gateway. BFF добавляет ещё один слой, который надо разрабатывать и эксплуатировать.<br><br><b>Что часто спрашивают следом:</b> «а кто владеет BFF?» Правильный ответ — команда фронтенда, а не бэкенда. Иначе теряется весь смысл: фронт снова ждёт чужой релиз ради изменения формата ответа.`},
{q:"Что такое Scatter-Gather и в чём его сложность?",
short:"Один входящий запрос параллельно рассылается нескольким сервисам, ответы собираются в один. Общее время равно самому медленному ответу, а не сумме. Сложность — в обработке частичных отказов и таймаутов.",
long:`<b>Главный выигрыш — параллельность.</b> Четыре сервиса по 20, 45, 30 и 25 мс. Последовательно — 120 мс. Параллельно — 45 мс, по самому медленному.<br><br><b>Три вещи, которые надо продумать, и о которых часто забывают:</b><br><br>1. <b>Таймаут на каждый вызов.</b> Без него один зависший сервис держит весь ответ. Таймаут должен быть меньше, чем таймаут клиента.<br><br>2. <b>Стратегия частичного отказа.</b> Что отдавать, если один из четырёх сервисов не ответил? Варианты: отдать частичный ответ с пометкой (graceful degradation), отдать данные из кэша, или всё-таки вернуть ошибку. Это <b>бизнес-решение</b>, и его должен зафиксировать аналитик в постановке.<br><br>Пример: в карточке должника не пришла история звонков — показываем всё остальное и плашку «история временно недоступна». А вот если не пришла сумма долга — карточку показывать нельзя, это вводит оператора в заблуждение.<br><br>3. <b>Усиление нагрузки.</b> Один внешний запрос порождает четыре внутренних. При 1000 RPS снаружи получаем 4000 RPS внутри. Это надо закладывать в расчёт мощностей.`}
]},

{id:"7b-2",title:"Service Discovery, Sidecar и Service Mesh",
theory:`<p><b>Проблема.</b> В Kubernetes поды поднимаются и умирают постоянно, IP-адреса меняются. Жёстко прописать адрес сервиса в конфиге невозможно — завтра он будет другим.</p>
`+D.discovery+`
<h4>Два подхода к обнаружению</h4>
<ul>
<li><b>Client-side discovery</b> — клиент сам спрашивает реестр и сам выбирает инстанс. Гибко, нет лишнего сетевого прыжка, но логика балансировки размазана по всем сервисам.</li>
<li><b>Server-side discovery</b> — клиент бьёт в один адрес (балансировщик или Kubernetes Service), тот сам знает живые инстансы. Проще для клиента, но появляется дополнительный компонент.</li>
</ul>
<div class="co mem"><span class="co-i">🧠</span><span><b>Как работает heartbeat.</b> Инстанс при старте регистрируется в реестре и потом регулярно шлёт сигнал «я жив». Перестал слать — реестр вычёркивает его через N секунд. Именно поэтому упавший сервис исчезает из выдачи автоматически, без ручного вмешательства.</span></div>
<h4>Sidecar и Service Mesh</h4>
`+D.sidecar+`
<p><b>Идея sidecar:</b> рядом с каждым сервисом в том же поде живёт прокси. Весь сетевой трафик идёт через него. Прокси берёт на себя retry, таймауты, circuit breaker, шифрование mTLS, сбор метрик и трейсинг.</p>
<p><b>Что это даёт:</b> разработчик пишет только бизнес-логику. Не надо в каждом сервисе на каждом языке реализовывать одну и ту же логику ретраев. Политики задаются централизованно и применяются ко всем.</p>
<div class="co warn"><span class="co-i">⚠️</span><span><b>Честно о цене Service Mesh:</b> это отдельная сложная инфраструктура, которую надо уметь эксплуатировать. Плюс каждый запрос делает два дополнительных прыжка через прокси — это добавляет задержку. Для десятка сервисов mesh обычно избыточен, для сотни — уже оправдан.</span></div>
<div class="co ex"><span class="co-i">🔌</span><span><b>Ambassador</b> — родственный паттерн. Прокси рядом с сервисом, который занимается исходящими вызовами к внешним системам. Пример: интеграция с legacy-системой банка по SOAP через прокси, который снаружи выглядит как REST. Сервис не знает, что общается с древним SOAP.</span></div>`,
prac:"Найди в своём проекте место, где логика ретраев и таймаутов написана руками в коде сервиса. Прикинь: сколько раз она продублирована в разных сервисах? Одинаковые ли там настройки? Обычно оказывается, что нет — и это ровно та боль, которую решает mesh.",
questions:[
{q:"Что такое Service Discovery и зачем он нужен?",
short:"Механизм, позволяющий сервисам находить друг друга по имени, а не по жёстко прописанному адресу. Инстансы регистрируются в реестре и шлют heartbeat, упавшие автоматически исключаются из выдачи.",
long:`<b>Почему нельзя просто прописать IP.</b> В контейнерной среде инстансы создаются и уничтожаются автоматически: при деплое, при автомасштабировании, при падении узла. Адрес живёт минуты. Конфиг с адресами устареет раньше, чем вы его закоммитите.<br><br><b>Как работает:</b><br>1. Инстанс при старте регистрируется: «я loan-service, мой адрес 10.0.1.5, я здоров»<br>2. Регулярно шлёт heartbeat<br>3. Клиент спрашивает реестр: «дай живые адреса loan-service»<br>4. Перестал слать heartbeat — реестр вычёркивает<br><br><b>Два подхода:</b> client-side (клиент сам выбирает инстанс — больше контроля, но логика в каждом сервисе) и server-side (клиент бьёт в одну точку — проще, но нужен дополнительный компонент).<br><br><b>В Kubernetes это встроено:</b> объект Service даёт стабильное DNS-имя, а kube-proxy направляет трафик на живые поды. Отдельный Consul или Eureka чаще нужен в гибридных средах, где часть системы вне кластера.<br><br><b>Важный нюанс — health check.</b> Различают liveness («сервис жив, не надо перезапускать») и readiness («сервис готов принимать трафик»). Сервис может быть жив, но ещё прогревает кэш — тогда трафик ему слать рано. Путаница между этими проверками — источник загадочных ошибок при деплое.`},
{q:"Что такое Service Mesh и когда он нужен?",
short:"Инфраструктурный слой из прокси-сайдкаров рядом с каждым сервисом. Берёт на себя retry, таймауты, circuit breaker, mTLS, метрики и трейсинг, вынося это из кода сервисов. Оправдан от нескольких десятков сервисов.",
long:`<b>Проблема, которую решает.</b> В каждом сервисе нужны ретраи, таймауты, circuit breaker, шифрование, метрики. Если сервисов сорок и они на четырёх языках — вы пишете и поддерживаете это в четырёх вариантах, и настройки неизбежно разъезжаются.<br><br><b>Решение:</b> вынести инфраструктурную логику в прокси рядом с каждым сервисом (data plane, обычно Envoy), а управлять ими централизованно (control plane — Istio, Linkerd).<br><br><b>Что получаем:</b><br>— единые политики ретраев и таймаутов для всех, задаются конфигом, а не кодом<br>— mTLS между сервисами из коробки — важно для банка<br>— автоматические метрики и распределённый трейсинг без правки кода<br>— canary-деплой: направить 5% трафика на новую версию одной настройкой<br><br><b>Честно о минусах:</b> дополнительная задержка на двух прокси, серьёзное усложнение эксплуатации, нужна экспертиза в команде. Для 10 сервисов это стрельба из пушки по воробьям — проще библиотека типа Resilience4j.<br><br><b>Практический критерий:</b> mesh начинает окупаться, когда сервисов больше 20-30, они на разных языках, и есть отдельная платформенная команда, которая будет это эксплуатировать.`}
]},

{id:"7b-3",title:"Strangler Fig, ACL и Database per Service",
theory:`<p><b>Задача:</b> есть монолит на 15 лет, который нельзя остановить. Переписать целиком — проект на 3 года с шансом провала близким к единице. Что делать?</p>
`+D.strangler+`
<h4>Strangler Fig — как это работает</h4>
<ol>
<li>Перед монолитом ставят <b>фасад</b> — прокси или Gateway. Клиенты ходят через него и не знают, что внутри.</li>
<li>Выбирают один кусок функциональности — обычно тот, что меняется чаще всего или мешает масштабированию.</li>
<li>Реализуют его как отдельный сервис.</li>
<li>Фасад переключает соответствующие запросы на новый сервис.</li>
<li>Повторяют, пока от монолита ничего не останется.</li>
</ol>
<div class="co mem"><span class="co-i">🧠</span><span><b>Откуда название.</b> Фикус-душитель прорастает вокруг дерева-хозяина, постепенно оплетает его, и когда дерево умирает — на его месте остаётся полая, но живая структура фикуса. Ровно так новая система вырастает вокруг старой.</span></div>
<div class="co good"><span class="co-i">✅</span><span><b>Почему это почти всегда правильный выбор:</b> ценность поставляется постепенно, риск размазан по маленьким шагам, в любой момент можно откатить одну функцию обратно. «Большой взрыв» с одномоментным переключением — это когда все риски реализуются в одну ночь.</span></div>
<h4>Anti-Corruption Layer (ACL)</h4>
<p>Новый сервис вынужден общаться с легаси, у которого чудовищная модель данных: поля <code>FLD_A17</code>, статусы цифрами, даты строками в трёх форматах. Если пустить это внутрь — новая система заразится старой моделью.</p>
<p><b>ACL</b> — слой-переводчик на границе. Внутри нового сервиса живёт чистая модель домена, а весь ужас конвертации изолирован в одном месте. Когда легаси умрёт, выбрасывается только этот слой.</p>
<h4>Database per Service</h4>
`+D.dbper+`
<div class="co warn"><span class="co-i">⚠️</span><span><b>Shared Database — главный антипаттерн микросервисов.</b> Если два сервиса ходят в одни таблицы, они связаны намертво: нельзя изменить схему, нельзя деплоить независимо, нельзя масштабировать по отдельности. Формально это микросервисы, фактически — распределённый монолит, худший из миров.</span></div>`,
prac:"Выбери в своём монолите первого кандидата на выделение. Критерии: часто меняется, имеет понятные границы данных, у него отличный от остальных профиль нагрузки. Напиши три предложения: что выделяем, почему именно это, и какие данные придётся дублировать.",
questions:[
{q:"Как разделить монолит на микросервисы?",
short:"Постепенно, паттерном Strangler Fig: ставим фасад перед монолитом, выносим по одной функции в отдельный сервис, переключаем на него трафик через фасад. Границы сервисов определяем по Bounded Context из DDD.",
long:`<b>С чего начать — выбор первого кандидата.</b> Хорошие критерии: функция часто меняется (значит, независимый деплой даст выигрыш сразу), у неё понятные границы данных, отличается профиль нагрузки от остального монолита.<br><br><b>Плохой выбор:</b> начинать с самого связанного ядра. Там больше всего зависимостей, и первый же шаг превратится в полгода работы без видимого результата.<br><br><b>Порядок действий:</b><br>1. Фасад перед монолитом — все клиенты ходят через него<br>2. Выделяем сервис вместе с его данными<br>3. Период двойной работы: данные пишутся и туда, и туда, идёт сверка<br>4. Переключаем чтение на новый сервис<br>5. Убираем старый код из монолита<br><br><b>Самое сложное — разделение данных.</b> В монолите таблицы связаны внешними ключами и JOIN'ами. После разделения JOIN между сервисами невозможен. Приходится либо дублировать нужные поля через события, либо делать API-вызов, либо признать, что граница проведена неверно.<br><br><b>Когда НЕ надо делить:</b> команда меньше 8 человек, продукт ещё ищет product-market fit, нет DevOps-экспертизы. Микросервисы решают организационную проблему масштабирования команд. Если её нет — вы получите только распределённые транзакции и ночные дежурства.`},
{q:"Почему у каждого микросервиса должна быть своя БД?",
short:"Общая база связывает сервисы намертво: изменение схемы ломает соседей, деплоить независимо нельзя, база становится общим узким местом. Это превращает микросервисы в распределённый монолит — худший вариант.",
long:`<b>Что конкретно ломается при общей БД:</b><br><br>1. <b>Независимость деплоя исчезает.</b> Команда A добавила колонку и изменила тип — у команды B упал прод. Приходится согласовывать релизы, а это ровно та боль, от которой уходили из монолита.<br><br>2. <b>Невозможно выбрать подходящее хранилище.</b> Сервису каталога хорошо в Elasticsearch, сервису платежей нужен PostgreSQL. С общей базой все живут на компромиссе.<br><br>3. <b>База — общее узкое место.</b> Тяжёлый отчётный запрос одного сервиса кладёт всех остальных.<br><br>4. <b>Размывается владение.</b> Никто не знает, кто и зачем пишет в таблицу.<br><br><b>Цена правильного решения — её надо честно назвать:</b><br>— <b>Нет JOIN между сервисами.</b> Собирать данные приходится в приложении или через агрегатор.<br>— <b>Нет общих транзакций.</b> Нужна сага с компенсациями.<br>— <b>Дублирование данных.</b> Сервису взыскания нужно имя клиента — он хранит копию, обновляя её по событиям. Это осознанная денормализация, а не ошибка.<br><br><b>Как отвечать, если спросят про отчётность:</b> для аналитики данные всех сервисов стекаются в отдельное хранилище (DWH или ClickHouse) через события или CDC. Ходить в боевые базы сервисов ради отчёта — тот же антипаттерн.`},
{q:"Что такое Anti-Corruption Layer?",
short:"Слой-переводчик между новым сервисом и легаси-системой. Изолирует чужую неудобную модель данных, не пуская её внутрь чистой доменной модели нового сервиса. Умрёт легаси — выбросим только этот слой.",
long:`<b>Проблема.</b> Легаси-система отдаёт данные в своей модели: поля с именами вроде <code>FLD_A17</code>, статусы числовыми кодами без документации, даты строками в трёх форматах, неявные бизнес-правила. Если использовать эту модель напрямую в новом сервисе — вся эта запутанность расползётся по новому коду.<br><br><b>Решение.</b> На границе ставится слой, который переводит чужую модель в вашу. Внутри сервиса живут понятные термины: <code>DebtCase</code>, статус <code>PROMISE_TO_PAY</code>, дата как дата. Весь ужас конвертации сосредоточен в одном изолированном месте.<br><br><b>Почему это важно именно в банке:</b> легаси живёт десятилетиями, интеграций с ним много, и без ACL каждый новый сервис начинает воспроизводить структуру системы восьмидесятых годов.<br><br><b>Роль аналитика здесь ключевая.</b> Именно вы описываете таблицу маппинга: какое поле легаси во что превращается, что делать с кодами, которых нет в справочнике, как обрабатывать пустые значения и заведомо мусорные данные. Этот документ — самая ценная часть постановки на интеграцию с легаси, и он же обычно самый недооценённый.<br><br><b>Бонус:</b> когда легаси наконец отключат, менять нужно будет только ACL. Доменная модель не пострадает.`}
]},

{id:"7b-4",title:"Bulkhead, Retry, идемпотентность и CQRS",
theory:`<h4>Bulkhead — переборки</h4>
`+D.bulkhead+`
<p>Название пришло из судостроения: корпус корабля делят водонепроницаемыми переборками, чтобы пробоина в одном отсеке не потопила судно. В архитектуре — то же: ресурсы (пулы потоков, соединения, лимиты) делят между вызовами, чтобы один зависший сервис не съел всё.</p>
<h4>Retry с экспоненциальной задержкой</h4>
`+D.retry+`
<div class="co warn"><span class="co-i">⚠️</span><span><b>Три правила ретраев, которые нарушают чаще всего:</b><br>1. Ретраить можно только <b>идемпотентные</b> операции, иначе создадите дубли.<br>2. Задержка должна расти экспоненциально — иначе добьёте восстанавливающийся сервис.<br>3. Нужен <b>jitter</b> — случайный разброс. Без него тысяча клиентов, упавших одновременно, ретраит синхронно и создаёт залповую нагрузку.</span></div>
<h4>Идемпотентность в действии</h4>
`+D.idem+`
<h4>CQRS — разделение чтения и записи</h4>
`+D.cqrs+`
<div class="co mem"><span class="co-i">🧠</span><span><b>Когда CQRS оправдан:</b> нагрузка на чтение и запись сильно разная (обычно чтений в 10-100 раз больше), запросы на чтение сложные и медленные, разные требования к консистентности. Когда не оправдан — почти всегда в остальных случаях: вы получаете две модели, которые надо синхронизировать, и eventual consistency в интерфейсе.</span></div>`,
prac:"Проверь свою систему на устойчивость: выпиши все внешние вызовы одного сервиса. Для каждого ответь — есть ли таймаут? Есть ли ретрай и идемпотентна ли операция? Что произойдёт, если этот вызов будет отвечать 30 секунд? Обычно находится минимум один вызов без таймаута — это будущий инцидент.",
questions:[
{q:"Что такое Bulkhead и зачем он нужен?",
short:"Изоляция ресурсов: у каждой группы вызовов свой пул потоков или соединений. Зависший внешний сервис исчерпает только свой пул, остальная функциональность продолжит работать.",
long:`<b>Сценарий без bulkhead.</b> В сервисе общий пул на 100 потоков. Внешний платёжный шлюз начал отвечать за 30 секунд вместо 200 мс. Запросы к нему копятся, занимают потоки. Через минуту все 100 потоков ждут шлюз. Итог: сервис не отвечает вообще — даже на операции, которые к шлюзу не имеют отношения.<br><br><b>С bulkhead.</b> Пул разделён: 30 потоков на платежи, 40 на звонки, 30 на отчёты. Шлюз завис — исчерпаны 30 потоков платежей, они начинают быстро отклоняться. Звонки и отчёты работают штатно.<br><br><b>Как реализуется:</b><br>— отдельные пулы потоков или семафоры на группу вызовов (Resilience4j, Hystrix)<br>— отдельные пулы соединений к разным БД<br>— на уровне инфраструктуры: разные поды или ноды под критичные и некритичные задачи<br><br><b>Связка паттернов, которую стоит назвать целиком:</b> Timeout не даёт вызову висеть вечно, Circuit Breaker перестаёт долбить упавший сервис, Bulkhead ограничивает ущерб от того, что всё-таки просочилось. По отдельности каждый закрывает лишь часть проблемы — работают они вместе.<br><br><b>Роль аналитика:</b> определить, какие группы операций критичны, а какие можно пожертвовать при перегрузке. Это бизнес-приоритизация, и без неё инженеры расставят лимиты наугад.`},
{q:"Как правильно реализовать ретраи?",
short:"Только для идемпотентных операций, с экспоненциально растущей задержкой и случайным разбросом (jitter), с ограничением числа попыток и в связке с circuit breaker. Ретраить ошибки 4xx бессмысленно — они не пройдут и со второго раза.",
long:`<b>Что ретраить, а что нет:</b><br>— <b>Ретраим:</b> таймауты, 503 Service Unavailable, 429 Too Many Requests (с учётом заголовка Retry-After), сетевые обрывы.<br>— <b>Не ретраим:</b> 400 Bad Request, 401, 403, 422 — это ошибки запроса, повтор ничего не изменит, только сожжёт ресурсы.<br><br><b>Экспоненциальная задержка:</b> 1 → 2 → 4 → 8 секунд. Даёт сервису время восстановиться. Линейный или мгновенный повтор превращает ретраи в DDoS собственной системы — известный сценарий, при котором сервис не может встать именно из-за шквала ретраев.<br><br><b>Jitter — про что забывают чаще всего.</b> Тысяча клиентов получили ошибку в одну секунду. Без разброса все они повторят запрос ровно через 1, потом через 2, потом через 4 секунды — синхронными залпами. Случайное отклонение ±20% размазывает нагрузку.<br><br><b>Обязательное условие — идемпотентность.</b> Ретрай неидемпотентной операции создаёт дубли. Для платежей это означает Idempotency-Key.<br><br><b>Ограничение попыток и связка с circuit breaker:</b> 3-5 попыток максимум. Если сервис лежит устойчиво, ретраи бесполезны — должен сработать circuit breaker и прекратить попытки совсем.`},
{q:"Когда нужен CQRS, а когда он избыточен?",
short:"Нужен, когда нагрузка на чтение и запись сильно различается, запросы на чтение сложные, и модели данных для этих задач принципиально разные. Избыточен почти во всех остальных случаях — он добавляет две модели и eventual consistency.",
long:`<b>Суть паттерна:</b> команды (изменение) и запросы (чтение) обслуживаются разными моделями. Запись идёт в нормализованную транзакционную БД, чтение — в отдельное денормализованное хранилище, обновляемое через события.<br><br><b>Когда оправдан:</b><br>— чтений в десятки раз больше, чем записей, и они конкурируют за ресурсы<br>— запросы на чтение требуют сложных агрегаций, которые тормозят транзакционную базу<br>— нужны разные представления одних данных: карточка клиента, поиск, отчёт<br>— используется Event Sourcing — там CQRS практически неизбежен<br><br><b>Цена, которую надо честно назвать:</b><br>1. <b>Eventual consistency.</b> Пользователь сохранил изменение, тут же обновил страницу и не увидел его — read-модель ещё не догнала. Это надо либо объяснить в интерфейсе, либо для критичных операций читать из write-модели.<br>2. <b>Две модели вместо одной</b> — больше кода, больше мест для расхождения.<br>3. <b>Синхронизация может сломаться</b> — нужен мониторинг задержки проекции и способ пересобрать read-модель с нуля.<br><br><b>Хороший ответ на собесе заканчивается так:</b> «CQRS — точечный инструмент для конкретного узкого места, а не архитектура всей системы. Применять его ко всем сущностям подряд — верный способ утроить сложность без выигрыша».`}
]}
]};

const BNET = {id:"bnet",icon:"🌐",title:"Как работает интернет",tag:"фундамент",color:"blue",
desc:"TCP/IP, порты и сокеты, путь загрузки сайта, HTTP от 1.0 до 3, все коды ответов, HTTPS. База, без которой API — магия.",
topics:[

{id:"net-1",title:"TCP/IP, порты, сокеты",
theory:`<p><b>На пальцах.</b> Интернет — это почта. Чтобы посылка дошла, нужен адрес дома (IP), номер квартиры (порт) и правила упаковки (протокол). Модель TCP/IP описывает, кто за что отвечает на этом пути.</p>
`+D.tcpip+`
<h4>Ресурс, порт, сокет — три слова, которые путают</h4>
<ul>
<li><b>IP-адрес</b> — адрес машины в сети. <code>10.0.1.5</code></li>
<li><b>Порт</b> — номер «двери» на этой машине. За каждой дверью своя программа. 80 — HTTP, 443 — HTTPS, 5432 — PostgreSQL, 9092 — Kafka, 6379 — Redis.</li>
<li><b>Сокет</b> — пара «IP + порт», то есть конкретная точка соединения: <code>10.0.1.5:443</code>. Соединение — это всегда пара сокетов: твой и сервера.</li>
<li><b>URL / ресурс</b> — адрес конкретных данных внутри сервиса: <code>https://api.bank.ru:443/v1/clients/777</code></li>
</ul>
<div class="co mem"><span class="co-i">🧠</span><span><b>Аналогия на всю жизнь:</b> IP — адрес дома. Порт — номер квартиры. Сокет — «дом + квартира», конкретная дверь. URL — «дом, квартира, и на полке справа вторая папка».</span></div>
<h4>TCP против UDP</h4>
<table>
<tr><th></th><th>TCP</th><th>UDP</th></tr>
<tr><td>Соединение</td><td>Устанавливается (3 рукопожатия)</td><td>Нет, шлём сразу</td></tr>
<tr><td>Гарантия доставки</td><td>Есть — подтверждения и переотправка</td><td>Нет</td></tr>
<tr><td>Порядок пакетов</td><td>Сохраняется</td><td>Не гарантирован</td></tr>
<tr><td>Скорость</td><td>Ниже (накладные расходы)</td><td>Выше</td></tr>
<tr><td>Где</td><td>HTTP, файлы, почта, БД</td><td>Видеозвонки, стриминг, DNS, игры</td></tr>
</table>
<div class="co ex"><span class="co-i">🤝</span><span><b>Три рукопожатия TCP:</b> клиент шлёт SYN («давай общаться»), сервер отвечает SYN-ACK («давай, я готов»), клиент шлёт ACK («поехали»). Только после этого летят данные. Именно поэтому первое соединение всегда чуть медленнее — и поэтому их стараются переиспользовать (keep-alive).</span></div>`,
prac:"Открой в браузере F12 → вкладка Network, зайди на любой сайт. Найди первый запрос и посмотри вкладку Timing: там видно DNS lookup, Initial connection (те самые рукопожатия), SSL и Waiting (ответ сервера). Это буквально та схема, что выше, только в цифрах.",
questions:[
{q:"Какие уровни сетевой модели вы знаете? На каком работает HTTP?",
short:"В TCP/IP четыре уровня: канальный, сетевой (IP), транспортный (TCP/UDP), прикладной. HTTP работает на прикладном — самом верхнем. В классической модели OSI из семи уровней это уровень 7.",
long:`Полезно отвечать, показывая, что вы понимаете разницу между теорией и практикой.<br><br><b>OSI</b> — семь уровней, эталонная модель для обучения: физический, канальный, сетевой, транспортный, сеансовый, представления, прикладной.<br><br><b>TCP/IP</b> — четыре уровня, то, как реально устроен интернет. Верхние три уровня OSI схлопнуты в один прикладной.<br><br><b>Зачем это аналитику практически:</b><br>— Балансировщик <b>L4</b> видит только IP и порт — быстрый, но не понимает URL. Балансировщик <b>L7</b> читает HTTP и может маршрутизировать по пути запроса или заголовкам.<br>— TLS работает между транспортным и прикладным — поэтому HTTPS это «HTTP поверх TLS», а не отдельный протокол.<br>— Когда говорят «проблема на сетевом уровне», это про IP и маршруты, а не про ваш код.`},
{q:"TCP или UDP при передаче файлов?",
short:"TCP. При передаче файла критична целостность — потеря одного пакета испортит файл. TCP гарантирует доставку и порядок за счёт подтверждений и переотправки. UDP выбирают там, где скорость важнее и потери допустимы.",
long:`<b>Почему TCP надёжен:</b> каждый сегмент нумеруется, получатель подтверждает приём (ACK). Не пришло подтверждение — отправитель шлёт заново. Плюс контроль перегрузки: TCP сам сбрасывает скорость, если сеть не справляется.<br><br><b>Где выбирают UDP и почему это осознанно:</b><br>— <b>Видеозвонок.</b> Потерялся пакет — потерялся кадр. Переспрашивать бессмысленно: пока переотправят, момент уже прошёл. Лучше лёгкий артефакт, чем задержка.<br>— <b>DNS.</b> Запрос и ответ помещаются в один пакет, устанавливать соединение дороже, чем просто переспросить.<br>— <b>Онлайн-игры.</b> Актуальна последняя позиция, а не история.<br><br><b>Нюанс, который добавит веса ответу:</b> HTTP/3 работает поверх UDP через протокол QUIC. Надёжность там реализована на уровне приложения, а не транспорта. Это сделано, чтобы избавиться от проблемы head-of-line blocking, унаследованной от TCP.`}
]},

{id:"net-2",title:"Как загружается сайт — по шагам",
theory:`<p>Классический вопрос на собеседовании: «что происходит, когда ты вводишь адрес в браузере и жмёшь Enter?». Отвечать надо по шагам — интервьюер проверяет системность мышления, а не зубрёжку.</p>
`+D.pageload+`
<h4>Разбор шагов</h4>
<ol>
<li><b>DNS.</b> Браузер не знает, что такое <code>bank.ru</code> — он знает только IP. Идёт запрос к DNS-серверу: «дай адрес». Сначала проверяется кэш браузера, потом ОС, потом провайдера.</li>
<li><b>TCP-соединение.</b> Три рукопожатия с сервером по нужному порту.</li>
<li><b>TLS-рукопожатие.</b> Обмен ключами, проверка сертификата. После этого канал зашифрован.</li>
<li><b>HTTP-запрос.</b> Уходит текст: метод, путь, заголовки.</li>
<li><b>Обработка на сервере.</b> Веб-сервер, приложение, поход в БД, сборка ответа.</li>
<li><b>HTTP-ответ.</b> Код статуса, заголовки, тело — HTML.</li>
<li><b>Дополнительные ресурсы.</b> Браузер разбирает HTML и видит ссылки на CSS, JS, картинки — качает их отдельными запросами.</li>
<li><b>Рендеринг.</b> Построение DOM, применение стилей, отрисовка.</li>
</ol>
<div class="co mem"><span class="co-i">🧠</span><span><b>Мнемоника «ДТТЗОР»:</b> <b>Д</b>НС → <b>Т</b>CP → <b>Т</b>LS → <b>З</b>апрос → <b>О</b>твет → <b>Р</b>ендер. Пять секунд, и структура ответа готова.</span></div>
<h4>Сайт, веб-сервис, веб-приложение — в чём разница</h4>
<table>
<tr><th></th><th>Что это</th><th>Кто потребитель</th><th>Пример</th></tr>
<tr><td><b>Веб-сайт</b></td><td>Набор страниц, в основном для чтения</td><td>Человек</td><td>Сайт-визитка, блог</td></tr>
<tr><td><b>Веб-приложение</b></td><td>Интерактив, состояние, логика в браузере</td><td>Человек</td><td>Личный кабинет банка</td></tr>
<tr><td><b>Веб-сервис</b></td><td>Интерфейс для машин, отдаёт данные, а не разметку</td><td>Другая программа</td><td>API выдачи баланса</td></tr>
</table>`,
prac:"Проговори вслух за 90 секунд, что происходит при вводе адреса — от DNS до рендера. Именно вслух, а не про себя. Это буквально готовый ответ на очень частый вопрос, и он должен звучать гладко, а не как перечисление слов.",
questions:[
{q:"Что происходит, когда вы вводите адрес сайта и нажимаете Enter?",
short:"Браузер узнаёт IP через DNS, устанавливает TCP-соединение, проводит TLS-рукопожатие, отправляет HTTP-запрос. Сервер обрабатывает и возвращает HTML. Браузер разбирает его, догружает CSS, JS и картинки, затем отрисовывает страницу.",
long:`Хороший ответ — по шагам, с упоминанием, где что может пойти не так. Именно это отличает того, кто разбирался, от того, кто заучил.<br><br><b>Где ломается на практике:</b><br>— <b>DNS не резолвится</b> → «сайт не найден». Проверяется через <code>nslookup</code> или <code>dig</code>.<br>— <b>TCP не установился</b> → таймаут. Обычно порт закрыт файрволом или сервис не слушает порт.<br>— <b>TLS не прошёл</b> → предупреждение о сертификате: истёк, не тому домену, самоподписанный.<br>— <b>Сервер вернул 5xx</b> → проблема в приложении.<br>— <b>Страница загрузилась, но пустая</b> → упал JS или не пришли данные из API.<br><br><b>Почему это спрашивают у аналитика:</b> потому что при разборе инцидента вы должны понимать, на каком этапе сломалось, и не звать разработчика на проблему с сертификатом.`},
{q:"Чем веб-сервис отличается от веб-сайта?",
short:"Веб-сайт отдаёт разметку для человека — HTML со стилями. Веб-сервис отдаёт данные для другой программы — обычно JSON или XML, без оформления. У сайта потребитель браузер, у сервиса — другой сервис.",
long:`<b>Ключевое различие — в потребителе.</b> Сайт рисует картинку человеку. Веб-сервис отвечает машине, и в его ответе нет ничего про внешний вид.<br><br><b>Веб-приложение</b> — промежуточный случай: фронтенд в браузере работает как приложение, но данные берёт через веб-сервис (API). Это стандартная схема современного банковского кабинета: SPA-приложение плюс REST API.<br><br><b>Почему разделение полезно:</b> один и тот же веб-сервис обслуживает и веб, и мобильное приложение, и партнёров. Бизнес-логика написана один раз.<br><br><b>Термин API шире:</b> API — это вообще любой программный интерфейс, включая библиотеки внутри одной программы. Веб-сервис — частный случай API, работающий по сети через HTTP.`}
]},

{id:"net-3",title:"HTTP: структура, версии, коды ответов",
theory:`<p><b>HTTP</b> — текстовый протокол «запрос-ответ». Клиент спрашивает, сервер отвечает, соединение может закрыться. Сервер по умолчанию не помнит предыдущий запрос — это и называется <b>stateless</b>.</p>
<h4>Из чего состоит запрос</h4>
<ul>
<li><b>Стартовая строка</b> — метод, путь, версия: <code>GET /v1/clients/777 HTTP/1.1</code></li>
<li><b>Заголовки</b> — метаданные: <code>Authorization</code>, <code>Content-Type</code>, <code>Accept</code>, <code>Idempotency-Key</code></li>
<li><b>Пустая строка</b> — разделитель</li>
<li><b>Тело</b> — данные (у GET обычно нет)</li>
</ul>
<h4>Ключевые заголовки, про которые спрашивают</h4>
<table>
<tr><th>Заголовок</th><th>Смысл</th></tr>
<tr><td><code>Content-Type</code></td><td>В каком формате Я отправляю тело: <code>application/json</code></td></tr>
<tr><td><code>Accept</code></td><td>В каком формате я хочу получить ОТВЕТ</td></tr>
<tr><td><code>Authorization</code></td><td>Кто я: <code>Bearer eyJhbGci...</code></td></tr>
<tr><td><code>Cache-Control</code></td><td>Можно ли кэшировать и сколько</td></tr>
<tr><td><code>ETag</code> / <code>If-None-Match</code></td><td>Версия ресурса — для условных запросов и 304</td></tr>
<tr><td><code>Retry-After</code></td><td>Через сколько повторить (идёт с 429 и 503)</td></tr>
</table>
<h4>Версии HTTP</h4>
<table>
<tr><th>Версия</th><th>Что появилось</th><th>Проблема, которую решили</th></tr>
<tr><td><b>1.0</b></td><td>Одно соединение — один запрос</td><td>—</td></tr>
<tr><td><b>1.1</b></td><td>Keep-alive, чанкованная передача, Host</td><td>Не пересоздавать соединение на каждую картинку</td></tr>
<tr><td><b>2.0</b></td><td>Бинарный формат, мультиплексирование, сжатие заголовков, server push</td><td>Много запросов в одном соединении параллельно</td></tr>
<tr><td><b>3.0</b></td><td>Поверх QUIC (UDP)</td><td>Head-of-line blocking на уровне TCP</td></tr>
</table>
<div class="co mem"><span class="co-i">🧠</span><span><b>Head-of-line blocking на пальцах:</b> в HTTP/1.1 запросы в одном соединении идут в очереди как в кассе. Застрял первый — стоят все. HTTP/2 разрешил обгонять внутри соединения, но очередь осталась на уровне TCP. HTTP/3 убрал и её, уйдя на UDP.</span></div>
<h4>Коды ответов — все пять классов</h4>
<p><b>1xx — информационные.</b> Промежуточный ответ, обработка продолжается. Встречаются редко, но спрашивают.</p>
<ul>
<li><code>100 Continue</code> — «заголовки принял, шли тело». Используется, когда клиент хочет убедиться, что огромное тело вообще примут: сначала шлёт заголовки с <code>Expect: 100-continue</code>.</li>
<li><code>101 Switching Protocols</code> — «переключаемся». Именно этим кодом начинается <b>WebSocket</b>.</li>
<li><code>103 Early Hints</code> — сервер заранее подсказывает браузеру, какие ресурсы начать грузить, пока сам готовит ответ.</li>
</ul>
<p><b>2xx — успех.</b> <code>200 OK</code> · <code>201 Created</code> (+ заголовок Location) · <code>202 Accepted</code> (приняли в асинхронную обработку) · <code>204 No Content</code> (успех без тела) · <code>206 Partial Content</code> (отдали кусок файла по Range).</p>
<p><b>3xx — перенаправления.</b> Класс, который чаще всего плавает на собесе.</p>
<table>
<tr><th>Код</th><th>Смысл</th><th>Когда применяют</th></tr>
<tr><td><code>301</code></td><td>Moved Permanently — переехали навсегда</td><td>Сменили домен или структуру URL. Браузеры и поисковики запоминают.</td></tr>
<tr><td><code>302</code></td><td>Found — временно в другом месте</td><td>Временный редирект. Метод может смениться на GET — исторический баг.</td></tr>
<tr><td><code>303</code></td><td>See Other — смотри там, обязательно через GET</td><td>После POST перенаправить на страницу результата</td></tr>
<tr><td><code>304</code></td><td>Not Modified — не изменилось</td><td>Кэш актуален. Тело не передаётся — экономия трафика. Работает с ETag.</td></tr>
<tr><td><code>307</code></td><td>Temporary Redirect</td><td>Как 302, но метод и тело сохраняются гарантированно</td></tr>
<tr><td><code>308</code></td><td>Permanent Redirect</td><td>Как 301, но метод сохраняется</td></tr>
</table>
<div class="co warn"><span class="co-i">⚠️</span><span><b>Практический нюанс про 301.</b> Постоянный редирект кэшируется браузером агрессивно и надолго. Ошиблись адресом — пользователи будут ходить не туда даже после исправления, пока не почистят кэш. При сомнениях лучше 302 или 307.</span></div>
<p><b>4xx — ошибка клиента.</b> <code>400</code> кривой запрос · <code>401</code> не аутентифицирован · <code>403</code> нет прав · <code>404</code> не найдено · <code>405</code> метод не разрешён · <code>409</code> конфликт · <code>410</code> ресурс был и удалён навсегда · <code>415</code> неподдерживаемый формат тела · <code>422</code> формат верный, бизнес-правило нарушено · <code>429</code> слишком много запросов.</p>
<p><b>5xx — ошибка сервера.</b> <code>500</code> внутренняя ошибка · <code>502</code> Bad Gateway (прокси получил мусор от апстрима) · <code>503</code> сервис недоступен, обычно временно · <code>504</code> Gateway Timeout (апстрим не ответил вовремя).</p>
<div class="co mem"><span class="co-i">🧠</span><span><b>Как запомнить классы:</b> 1xx — «погоди, я думаю». 2xx — «сделал». 3xx — «иди туда». 4xx — «ты накосячил». 5xx — «я накосячил».</span></div>`,
prac:"Возьми любое своё API и проверь: используются ли 201 и 204, или везде 200? Есть ли 422 для нарушенных бизнес-правил, или всё сваливается в 400? Возвращается ли Retry-After вместе с 429? Обычно находится минимум два места, где коды подобраны формально.",
questions:[
{q:"Какие классы кодов HTTP вы знаете?",
short:"Пять классов: 1xx информационные, 2xx успех, 3xx перенаправление, 4xx ошибка клиента, 5xx ошибка сервера. Первая цифра говорит, кто виноват и что делать дальше.",
long:`Сильный ответ — назвать классы и сразу дать по паре примеров с практическим смыслом.<br><br><b>1xx</b> — редкие, но знать стоит: <code>101 Switching Protocols</code> — именно так открывается WebSocket, а <code>100 Continue</code> нужен, чтобы не гнать огромное тело, если сервер его не примет.<br><br><b>2xx</b> — важно различать: <code>201</code> для созданного ресурса, <code>202</code> для асинхронной обработки, <code>204</code> когда тела нет.<br><br><b>3xx</b> — <code>304 Not Modified</code> экономит трафик при кэшировании, а <code>301</code> кэшируется браузером надолго, и это ловушка.<br><br><b>4xx</b> — здесь чаще всего проектируют неаккуратно: всё сваливают в 400 вместо 401/403/409/422.<br><br><b>5xx</b> — важно различать <code>502</code>, <code>503</code>, <code>504</code>: они указывают на разные места поломки, и в инциденте это первое, что смотришь.`},
{q:"В чём разница между 301 и 302, 307 и 308?",
short:"301 и 308 — постоянные редиректы, кэшируются надолго. 302 и 307 — временные. Разница внутри пар: 301 и 302 позволяют клиенту сменить метод на GET, а 307 и 308 гарантируют сохранение исходного метода и тела.",
long:`<b>Историческая подоплёка.</b> В спецификации 302 подразумевалось сохранение метода, но браузеры массово меняли POST на GET. Менять их поведение было поздно, поэтому ввели 307 и 308 с явной гарантией сохранения метода.<br><br><b>Практическая матрица:</b><br>— <b>301</b> — сменили домен навсегда, важно для SEO<br>— <b>302</b> — временная заглушка, техработы<br>— <b>303</b> — паттерн POST/Redirect/GET: после отправки формы перенаправить на страницу результата, чтобы обновление страницы не отправляло форму повторно<br>— <b>307</b> — временный редирект для API, где нельзя терять тело POST<br>— <b>308</b> — постоянный переезд API-эндпоинта<br><br><b>Практическая ловушка:</b> ошибочный 301 живёт в кэше браузеров месяцами, и «мы уже исправили» не помогает. При малейших сомнениях — 302 или 307.`},
{q:"Что даёт HTTP/2 по сравнению с 1.1?",
short:"Мультиплексирование — много параллельных запросов в одном соединении, бинарный формат вместо текста, сжатие заголовков и server push. Главный выигрыш — исчезла необходимость открывать по шесть соединений на домен.",
long:`<b>Проблема HTTP/1.1.</b> В одном соединении запросы шли строго по очереди. Браузеры обходили это, открывая до шести соединений на домен, а разработчики — склейкой файлов и спрайтами.<br><br><b>Что изменилось в HTTP/2:</b><br>— <b>Мультиплексирование:</b> сотни запросов в одном соединении параллельно.<br>— <b>Бинарный формат:</b> парсится быстрее и однозначнее текстового.<br>— <b>HPACK:</b> сжатие заголовков. Раньше одинаковые куки летели в каждом запросе целиком.<br>— <b>Server push:</b> сервер сам шлёт ресурсы, не дожидаясь запроса. На практике оказался спорным и почти не используется.<br><br><b>Что осталось:</b> head-of-line blocking на уровне TCP. Потерялся один пакет — TCP тормозит всё соединение, включая независимые потоки.<br><br><b>HTTP/3</b> решает это, переехав на QUIC поверх UDP: потеря пакета влияет только на свой поток. Плюс соединение переживает смену сети — важно для мобильных, когда переключаешься с Wi-Fi на LTE.`}
]},

{id:"net-4",title:"HTTPS, шифрование и подпись",
theory:`<p><b>HTTPS = HTTP + TLS.</b> Всё то же самое, но канал зашифрован. Задачи три: никто не прочитает (конфиденциальность), никто не подменит (целостность), ты общаешься с тем, с кем думаешь (аутентичность).</p>
<h4>TLS-рукопожатие по шагам</h4>
<ol>
<li>Клиент говорит «привет», перечисляет поддерживаемые алгоритмы</li>
<li>Сервер присылает сертификат с <b>публичным ключом</b></li>
<li>Клиент проверяет сертификат: подписан ли доверенным центром (CA), тот ли домен, не истёк ли</li>
<li>Стороны договариваются о <b>сеансовом ключе</b> (симметричном)</li>
<li>Дальше весь обмен шифруется быстрым симметричным алгоритмом (AES)</li>
</ol>
<div class="co mem"><span class="co-i">🧠</span><span><b>Почему два вида шифрования сразу.</b> Асимметричное надёжно решает проблему «как передать ключ по открытому каналу», но оно медленное. Симметричное быстрое, но требует общего секрета. Решение: асимметричным передаём симметричный ключ, дальше работаем симметричным. Как обменяться ключами от сейфа через курьера, а потом уже пользоваться сейфом напрямую.</span></div>
<h4>Хеширование, шифрование, подпись — три разные вещи</h4>
<table>
<tr><th></th><th>Обратимо?</th><th>Зачем</th><th>Пример</th></tr>
<tr><td><b>Хеширование</b></td><td>Нет</td><td>Проверить целостность, хранить пароли</td><td>SHA-256, bcrypt, argon2</td></tr>
<tr><td><b>Шифрование</b></td><td>Да, с ключом</td><td>Скрыть содержимое</td><td>AES (симметричное), RSA (асимметричное)</td></tr>
<tr><td><b>Подпись</b></td><td>Проверяется</td><td>Подтвердить авторство и неизменность</td><td>HMAC, RSA-подпись, ЭЦП</td></tr>
</table>
<p><b>Как работает подпись:</b> отправитель считает хеш от данных и шифрует его своим <b>приватным</b> ключом. Получатель расшифровывает <b>публичным</b> ключом отправителя и сравнивает с хешем, посчитанным самостоятельно. Совпало — значит данные не менялись и отправитель тот самый.</p>
<div class="co fin"><span class="co-i">🏦</span><span><b>Где это встретится в банке.</b> Подпись обязательна во всех межбанковских обменах и во многих интеграциях с внешними системами. Как аналитик вы будете описывать: какие поля входят в подписываемую строку, в каком порядке, каким алгоритмом, где берётся сертификат и что делать при неверной подписи. Порядок полей — источник половины багов интеграции.</span></div>
<h4>mTLS — взаимная проверка</h4>
<p>Обычный HTTPS проверяет только сервер: клиент убеждается, что перед ним настоящий банк. В <b>mTLS</b> сертификат предъявляют обе стороны — сервер тоже проверяет клиента. Применяется для интеграций между системами, где нужно надёжно знать, кто именно стучится.</p>`,
prac:"Открой любой https-сайт, нажми на замок в адресной строке и посмотри сертификат: кем выдан, кому, до какой даты, какой алгоритм. Потом найди в цепочке корневой центр сертификации — это тот самый CA, которому доверяет твоя операционная система.",
questions:[
{q:"Как работает HTTPS?",
short:"Это HTTP поверх TLS. При соединении сервер присылает сертификат с публичным ключом, клиент проверяет его подлинность через центр сертификации, стороны договариваются о симметричном сеансовом ключе, и дальше весь трафик шифруется им.",
long:`<b>Почему нужна связка двух видов шифрования.</b> Асимметричное решает проблему передачи ключа по открытому каналу, но медленное. Симметричное быстрое, но требует общего секрета. Поэтому асимметричным передаётся симметричный ключ сессии, а дальше работает только он.<br><br><b>Роль центра сертификации (CA).</b> Публичный ключ сам по себе ничего не доказывает — злоумышленник тоже может прислать свой. Сертификат подписан доверенным CA, а корневые сертификаты CA уже вшиты в вашу ОС и браузер. Это цепочка доверия.<br><br><b>Что реально защищает HTTPS:</b> прослушивание трафика, подмену данных в пути, атаку «человек посередине».<br><br><b>Чего HTTPS НЕ защищает</b> — важно сказать на собесе: он не защищает данные на самом сервере, не гарантирует, что сайт честный (мошеннический сайт тоже имеет валидный сертификат), и не скрывает сам факт обращения к домену.`},
{q:"В чём разница хеширования и шифрования?",
short:"Хеширование одностороннее: из данных получаем отпечаток, обратно восстановить нельзя. Шифрование двустороннее: с ключом можно расшифровать. Пароли только хешируют, персональные данные шифруют.",
long:`<b>Практическое правило:</b> если данные когда-нибудь понадобится прочитать — шифруем. Если нужно только сравнивать — хешируем.<br><br><b>Пароли — только хеширование, и только медленными алгоритмами</b> (bcrypt, argon2). Медленность здесь фича: подбор становится нереально долгим. SHA-256 для паролей плох именно потому, что быстрый.<br><br><b>Соль (salt)</b> — случайная строка, добавляемая к паролю перед хешированием. Без неё одинаковые пароли дают одинаковые хеши, и работают заранее посчитанные радужные таблицы.<br><br><b>Что шифруют в банке:</b> персональные данные в базе, данные в транзите, резервные копии, содержимое файлов с выгрузками.<br><br><b>Третья вещь, которую путают с первыми двумя — подпись.</b> Она не скрывает данные (их видно), а доказывает, что их не меняли и что отправитель тот самый. В межбанковских обменах используется постоянно.`}
]}
]};

topics:[

{id:"api-1",title:"Виды API и стили интеграции",
theory:`<p><b>API</b> — договор между двумя программами: «вот что я умею, вот как ко мне обращаться, вот что верну». Само слово шире, чем веб: API есть у библиотеки, у операционной системы, у базы данных.</p>
<h4>API, SDK, веб-сервис — в чём разница</h4>
<table>
<tr><th>Термин</th><th>Что это</th><th>Аналогия</th></tr>
<tr><td><b>API</b></td><td>Описание интерфейса: какие операции и с какими параметрами</td><td>Меню в ресторане</td></tr>
<tr><td><b>Веб-сервис</b></td><td>API, доступный по сети через HTTP</td><td>Доставка из этого ресторана</td></tr>
<tr><td><b>SDK</b></td><td>Готовый набор кода и инструментов для работы с API</td><td>Кухонный набор с рецептами</td></tr>
</table>
<h4>Стили интеграции — не только API</h4>
<ul>
<li><b>Обмен файлами.</b> Одна система кладёт файл, другая забирает по расписанию. Просто, но данные всегда устаревшие, и никто не знает, обработан ли файл. До сих пор жив в банковских выгрузках.</li>
<li><b>Общая база данных.</b> Две системы пишут в одни таблицы. Данные всегда свежие, но системы связаны намертво — изменение схемы ломает соседа.</li>
<li><b>Удалённый вызов (API).</b> Одна система вызывает другую и ждёт ответ. Синхронно, актуально, но есть зависимость по доступности.</li>
<li><b>Обмен сообщениями.</b> Через брокер, асинхронно. Развязывает системы во времени, но добавляет сложность.</li>
</ul>
<div class="co ex"><span class="co-i">🏦</span><span><b>Реальность банка:</b> живут все четыре стиля одновременно. Ночные файловые выгрузки в хранилище, синхронные REST-вызовы для интерфейса, Kafka для событий, а где-то в углу — интеграция через общую таблицу, которую все боятся трогать.</span></div>
<h4>Модель зрелости Ричардсона</h4>
`+D.richardson+`
<h4>Шесть принципов REST</h4>
`+D.restp,
prac:"Выпиши все интеграции своего продукта и распредели по четырём стилям: файлы, общая БД, API, сообщения. Для каждой ответь одним предложением, почему выбран именно этот стиль. Если на какую-то не можешь ответить — скорее всего, стиль выбран по инерции, а не осознанно.",
questions:[
{q:"Какие подходы к интеграции систем существуют?",
short:"Четыре основных: обмен файлами, общая база данных, вызов API и обмен сообщениями через брокер. Выбор зависит от требований к свежести данных, связанности систем и допустимой задержке.",
long:`<b>Разбор по критериям — так ответ звучит системно:</b><br><br><b>Файловый обмен.</b> Плюс: предельно просто, работает с любым легаси. Минус: данные устаревают между выгрузками, нет обратной связи об ошибках, файл может прийти битым или не прийти вовсе. Живёт в банках в ночных выгрузках и в обмене с внешними реестрами.<br><br><b>Общая БД.</b> Плюс: данные всегда актуальны, никакой сериализации. Минус: жёсткая связанность — изменение схемы ломает всех. В микросервисной архитектуре считается антипаттерном.<br><br><b>API.</b> Плюс: явный контракт, актуальные данные, контроль доступа. Минус: синхронная зависимость — упал провайдер, встал потребитель. Лечится circuit breaker и кэшем.<br><br><b>Сообщения.</b> Плюс: развязка во времени, получатель может лежать. Минус: eventual consistency, сложнее отладка, нужна идемпотентность.<br><br><b>Как выбирать:</b> нужен ответ прямо сейчас — API. Событие интересно нескольким — брокер. Огромный объём раз в сутки — файлы.`},
{q:"Что такое модель зрелости Ричардсона?",
short:"Шкала из четырёх уровней, насколько API близко к настоящему REST. Уровень 0 — всё через один URL и POST. Уровень 1 — появились ресурсы. Уровень 2 — правильные HTTP-методы и коды. Уровень 3 — HATEOAS. Большинство реальных API живёт на втором уровне.",
long:`<b>Уровень 0 — «болото POST».</b> Один эндпоинт, метод передаётся внутри тела. Это по сути RPC поверх HTTP, никакого REST здесь нет.<br><br><b>Уровень 1 — ресурсы.</b> Появились отдельные URL под сущности, но методы всё ещё используются как попало, обычно везде POST.<br><br><b>Уровень 2 — HTTP как задумано.</b> GET читает и кэшируется, POST создаёт, DELETE удаляет, коды ответов осмысленные. Это рабочая норма индустрии.<br><br><b>Уровень 3 — HATEOAS.</b> Ответ содержит ссылки на доступные дальше действия, клиент навигирует по ним, а не по захардкоженным путям. Красиво в теории, но на практике почти не встречается: усложняет клиенты и требует дисциплины.<br><br><b>Как отвечать на собесе:</b> честно сказать, что ваше API на втором уровне, и это осознанный выбор — третий уровень редко окупается. Такой ответ показывает, что вы знаете теорию, но мыслите практично.`},
{q:"Назовите принципы REST.",
short:"Клиент-сервер, отсутствие состояния на сервере (stateless), кэшируемость, единообразный интерфейс, слоистая архитектура и опциональный code on demand. Пять обязательных ограничений и одно необязательное.",
long:`Стоит объяснять каждый принцип через практическое следствие, а не определением.<br><br><b>Client-Server</b> — разделение ответственности: фронт отвечает за представление, сервер за данные. Их можно менять и масштабировать независимо.<br><br><b>Stateless</b> — сервер не хранит состояние клиента между запросами, каждый запрос самодостаточен. Следствие практическое: любой инстанс может обработать любой запрос, значит можно свободно масштабировать горизонтально. Именно поэтому в REST токен передают в каждом запросе, а не полагаются на серверную сессию.<br><br><b>Cacheable</b> — ответ должен явно говорить, можно ли его кэшировать. Отсюда заголовки Cache-Control и ETag.<br><br><b>Uniform Interface</b> — единообразие: ресурсы адресуются URL, операции стандартными методами, ответы самоописательны.<br><br><b>Layered System</b> — клиент не знает, общается он с сервером напрямую или через прокси, балансировщик, gateway. Это позволяет вставлять слои без изменения клиентов.<br><br><b>Code on Demand</b> — сервер может прислать исполняемый код (например, JS). Единственный необязательный принцип.`}
]},

{id:"api-2",title:"JSON-RPC и SOAP",
theory:`<h4>JSON-RPC — простой вызов процедуры</h4>
<p>Идея максимально прямая: у нас есть функции, мы хотим вызывать их удалённо. Никаких ресурсов и HTTP-семантики — один эндпоинт, в теле имя метода и параметры.</p>
<pre style="background:#0f1e2e;color:#8fe3d5;padding:12px 14px;border-radius:9px;font-size:11.5px;overflow-x:auto;line-height:1.6">POST /api HTTP/1.1
{
  "jsonrpc": "2.0",
  "method": "getClientDebt",
  "params": { "client_id": 777 },
  "id": 1
}</pre>
<p>Ответ содержит либо <code>result</code>, либо <code>error</code>, и обязательно тот же <code>id</code> — по нему клиент сопоставляет ответ с запросом. Это позволяет слать <b>батч</b> — массив запросов за один раз.</p>
<p><b>Когда оправдан:</b> внутренние интеграции, где нужны именно вызовы операций, а не работа с ресурсами. Особенно если операции плохо ложатся на CRUD — «пересчитать пеню», «запустить обзвон».</p>
<div class="co warn"><span class="co-i">⚠️</span><span><b>Главный минус RPC-стиля:</b> HTTP используется как тупая труба. Все ответы приходят с кодом 200, даже ошибки — ошибка лежит внутри тела. Значит, не работает стандартный мониторинг по кодам, не работает кэширование, балансировщик не может маршрутизировать по смыслу операции.</span></div>
<h4>SOAP — строгий контракт на XML</h4>
<p>Полноценный протокол, а не стиль. Сообщение всегда имеет структуру конверта:</p>
<ul>
<li><b>Envelope</b> — корневой элемент, обёртка всего сообщения</li>
<li><b>Header</b> — служебное: аутентификация, подпись, идентификатор транзакции, маршрутизация</li>
<li><b>Body</b> — сами данные или блок <code>Fault</code> при ошибке</li>
</ul>
<p><b>WSDL</b> — машиночитаемое описание сервиса: какие операции есть, какие типы данных принимают и возвращают, по какому адресу вызывать. По WSDL автоматически генерируется клиентский код — подключиться к сервису можно почти без ручной работы.</p>
<p><b>XSD</b> — схема, описывающая структуру XML: какие элементы допустимы, в каком порядке, каких типов, обязательны ли. Сообщение валидируется по XSD до попадания в бизнес-логику.</p>
<div class="co fin"><span class="co-i">🏦</span><span><b>Почему SOAP не умер в банках.</b> Три причины: WS-Security даёт стандартизованные подпись и шифрование на уровне сообщения (не только канала), строгий контракт исключает разночтения, и главное — существующие интеграции работают десятилетиями, переписывать их никто не будет. Аналитику в банке SOAP встретится обязательно.</span></div>
<table>
<tr><th></th><th>SOAP</th><th>REST</th></tr>
<tr><td>Что это</td><td>Протокол со строгими правилами</td><td>Архитектурный стиль</td></tr>
<tr><td>Формат</td><td>Только XML</td><td>Обычно JSON, но любой</td></tr>
<tr><td>Контракт</td><td>WSDL, строгая типизация</td><td>OpenAPI, необязателен</td></tr>
<tr><td>Транспорт</td><td>HTTP, SMTP, JMS, очереди</td><td>Только HTTP</td></tr>
<tr><td>Безопасность</td><td>WS-Security на уровне сообщения</td><td>TLS на уровне канала</td></tr>
<tr><td>Вес</td><td>Тяжёлый, многословный</td><td>Лёгкий</td></tr>
<tr><td>Транзакции</td><td>WS-AtomicTransaction</td><td>Нет из коробки</td></tr>
</table>`,
prac:"Найди в своём проекте любую SOAP-интеграцию и открой WSDL. Найди в нём: список операций, типы входных и выходных сообщений, адрес сервиса. Потом попробуй описать одну операцию словами — это и есть то, что от аналитика требуется в постановке на интеграцию.",
questions:[
{q:"В чём разница SOAP и REST?",
short:"SOAP — строгий протокол на XML с обязательной структурой конверта, контрактом WSDL и встроенной безопасностью WS-Security. REST — архитектурный стиль поверх HTTP, обычно с JSON, легче и проще, но без встроенных гарантий.",
long:`<b>Ключевое различие в природе.</b> SOAP — это протокол: он диктует формат сообщения, обработку ошибок, безопасность. REST — набор ограничений, а конкретика остаётся на разработчике.<br><br><b>Что даёт SOAP взамен веса:</b><br>— <b>WSDL</b> — контракт, по которому генерируется клиент. Ошибиться в формате практически невозможно.<br>— <b>WS-Security</b> — подпись и шифрование отдельных частей сообщения. Сообщение остаётся защищённым даже после того, как прошло через промежуточные узлы, — TLS так не умеет, он защищает только канал.<br>— <b>Транспортная независимость</b> — SOAP может ехать не только по HTTP, но и через очереди.<br><br><b>Почему REST победил в новых системах:</b> легче, читается глазами, не требует спецсредств, отлично работает с браузером и мобильными.<br><br><b>Как выбирать сегодня:</b> новое внешнее API — REST. Интеграция с банковским или государственным легаси — почти наверняка SOAP, и это не обсуждается. Внутреннее взаимодействие сервисов — gRPC.`},
{q:"Что такое WSDL и XSD?",
short:"WSDL — описание SOAP-сервиса: какие операции доступны, какие сообщения принимают и возвращают, по какому адресу. XSD — схема структуры XML: допустимые элементы, их типы, порядок и обязательность.",
long:`<b>WSDL</b> отвечает на вопрос «что умеет сервис». Из него генерируется клиентский код на любом языке: подключился, получил готовые классы и методы. Это главное практическое преимущество SOAP — интеграция начинается не с чтения документации, а с генерации.<br><br><b>XSD</b> отвечает на вопрос «как должно выглядеть сообщение». Описывает: обязательные и опциональные поля, типы (строка, дата, число с точностью), допустимые значения перечислений, вложенность, количество повторений элементов.<br><br><b>Практическая ценность для аналитика:</b> валидация по XSD отсекает кривые сообщения на входе, до бизнес-логики. Вместо загадочной ошибки в глубине кода получаем внятное «поле amount обязательно и должно быть числом».<br><br><b>Аналоги в мире REST:</b> роль WSDL играет OpenAPI (Swagger), роль XSD — JSON Schema. Разница в том, что в SOAP они обязательны, а в REST — по желанию, поэтому их часто нет или они устарели.`}
]},

{id:"api-3",title:"GraphQL и gRPC",
theory:`<h4>GraphQL — клиент сам выбирает поля</h4>
<p><b>Проблема, которую решает.</b> В REST мобильному приложению для одного экрана надо сходить в четыре эндпоинта и получить в каждом лишние поля. Это <b>over-fetching</b> (пришло больше нужного) и <b>under-fetching</b> (за остальным иди ещё раз).</p>
<p><b>Решение GraphQL.</b> Один эндпоинт, клиент описывает нужную структуру, сервер возвращает ровно её:</p>
<pre style="background:#0f1e2e;color:#8fe3d5;padding:12px 14px;border-radius:9px;font-size:11.5px;overflow-x:auto;line-height:1.6">query {
  client(id: 777) {
    fullName
    loans(status: "overdue") {
      amount
      dueDate
    }
  }
}</pre>
<p>Три операции: <b>query</b> — чтение, <b>mutation</b> — изменение, <b>subscription</b> — подписка на события через WebSocket. Схема типов обязательна и служит контрактом.</p>
<div class="co warn"><span class="co-i">⚠️</span><span><b>Чем платим за гибкость:</b><br>— <b>Кэширование ломается.</b> Все запросы идут POST на один URL — HTTP-кэш и CDN бесполезны.<br>— <b>Непредсказуемая нагрузка.</b> Клиент может запросить глубоко вложенную структуру и положить базу. Нужны ограничения глубины и сложности запроса.<br>— <b>Проблема N+1</b> проявляется остро: запрос списка клиентов с их займами легко превращается в сотню обращений к БД. Лечится батчингом (DataLoader).<br>— <b>Мониторинг сложнее:</b> все запросы выглядят одинаково — POST /graphql со статусом 200.</span></div>
<h4>gRPC — быстрый бинарный вызов</h4>
<p>Работает поверх HTTP/2, данные сериализуются в <b>Protocol Buffers</b> — бинарный формат, описанный в файле <code>.proto</code>:</p>
<pre style="background:#0f1e2e;color:#8fe3d5;padding:12px 14px;border-radius:9px;font-size:11.5px;overflow-x:auto;line-height:1.6">service DebtService {
  rpc GetDebt (DebtRequest) returns (DebtResponse);
}

message DebtRequest {
  int64 client_id = 1;
}

message DebtResponse {
  int64 client_id = 1;
  double amount = 2;
  int32 days_overdue = 3;
}</pre>
<p><b>Цифры после знака равенства — не значения, а номера полей.</b> Именно они, а не имена, кодируются в бинарном виде. Отсюда правило совместимости: <b>номер поля нельзя переиспользовать никогда</b>. Удалили поле — зарезервируйте его номер, иначе старые клиенты прочитают новые данные как мусор.</p>
<p><b>Четыре режима вызова:</b> унарный (запрос-ответ), стриминг от сервера, стриминг от клиента, двунаправленный. Последние три — то, чего в обычном REST просто нет.</p>
<h4>Сериализация — зачем она нужна</h4>
<p>Внутри программы данные лежат объектами в памяти. По сети можно передать только последовательность байт. <b>Сериализация</b> — превращение объекта в байты, <b>десериализация</b> — обратно. JSON и XML — текстовые форматы сериализации, Protobuf — бинарный: компактнее примерно втрое и быстрее парсится, но не читается глазами.</p>
<table>
<tr><th></th><th>REST + JSON</th><th>GraphQL</th><th>gRPC</th></tr>
<tr><td>Читается человеком</td><td>Да</td><td>Да</td><td>Нет</td></tr>
<tr><td>Скорость</td><td>Средняя</td><td>Средняя</td><td>Высокая</td></tr>
<tr><td>Кэширование HTTP</td><td>Отлично</td><td>Плохо</td><td>Нет</td></tr>
<tr><td>Строгость контракта</td><td>Опционально</td><td>Схема обязательна</td><td>Жёсткая</td></tr>
<tr><td>Стриминг</td><td>Нет</td><td>Через subscription</td><td>Встроенный</td></tr>
<tr><td>Где применять</td><td>Публичные API</td><td>Гибкий фронтенд</td><td>Между сервисами</td></tr>
</table>`,
prac:"Возьми экран своего приложения и посчитай честно: сколько запросов делает фронт и сколько лишних полей приходит. Если запросов больше трёх и половина полей не используется — это ровно тот случай, где GraphQL или BFF дадут выигрыш. Если один запрос и все поля нужны — не выдумывай проблему.",
questions:[
{q:"Когда использовать GraphQL вместо REST?",
short:"Когда у клиентов сильно разные потребности в данных, много вложенных связей и на одном экране нужны данные из нескольких источников. Не стоит брать ради моды: GraphQL ломает HTTP-кэширование и усложняет контроль нагрузки.",
long:`<b>Где GraphQL действительно выигрывает:</b><br>— Мобильное приложение на плохой сети: один запрос вместо пяти и ноль лишних полей.<br>— Несколько разных клиентов с разными потребностями — не нужно плодить эндпоинты вида <code>/clients/777/full</code>, <code>/clients/777/short</code>.<br>— Сильно связанные данные: клиент → займы → платежи одним запросом.<br><br><b>За что платим — это важно проговорить:</b><br>1. <b>HTTP-кэш не работает.</b> Всё через POST на один URL, CDN бесполезен. Нужен кэш на уровне приложения.<br>2. <b>Клиент может уронить бэкенд</b> глубоким вложенным запросом. Обязательны ограничение глубины, стоимость запроса и таймауты.<br>3. <b>N+1 из коробки.</b> Список из 100 клиентов с их займами — 101 запрос к базе, если не настроен батчинг.<br>4. <b>Мониторинг:</b> все запросы выглядят одинаково, нужен разбор по имени операции.<br><br><b>Практичная альтернатива:</b> BFF на REST под каждый тип клиента. Даёт большую часть выигрыша без большинства проблем.`},
{q:"Что такое gRPC и когда его выбирать?",
short:"Бинарный протокол поверх HTTP/2 с контрактом в proto-файле и генерацией клиента. Быстрее и компактнее REST, поддерживает стриминг. Берут для внутреннего взаимодействия сервисов, где важна скорость и не нужна читаемость.",
long:`<b>За счёт чего быстрее:</b> бинарный Protobuf компактнее JSON примерно втрое, HTTP/2 мультиплексирует запросы в одном соединении, сериализация дешевле парсинга текста.<br><br><b>Строгий контракт как дисциплина.</b> Схема в .proto, из неё генерируются клиент и сервер на любом языке. Изменил схему несовместимо — код перестал компилироваться. Это надёжнее, чем документация в Confluence, которую забыли обновить.<br><br><b>Правила совместимости, которые описывает аналитик:</b><br>— Номера полей уникальны и <b>никогда</b> не переиспользуются<br>— Новые поля добавляем только опциональными<br>— Удалённые номера резервируются через <code>reserved</code><br>— Переименовать поле можно, поменять номер — нельзя<br><br><b>Почему не наружу:</b> браузер напрямую не умеет (нужен gRPC-Web и прокси), нельзя посмотреть запрос глазами в логе, отладка через curl невозможна.<br><br><b>Что меняется в работе аналитика:</b> постановка на gRPC-интеграцию — это по сути описание proto-контракта: сообщения, поля, типы, обязательность и правила эволюции схемы.`}
]}
]};
