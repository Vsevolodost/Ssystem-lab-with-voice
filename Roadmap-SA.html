const BARCH = {id:"barch",icon:"🏛️",title:"C4 и процесс проектирования",tag:"архитектура",color:"amber",
desc:"Нотация C4 по уровням и семь этапов работы над архитектурой решения — от требований до вывода в прод.",
topics:[

{id:"c4-1",title:"Нотация C4",
theory:`<p><b>Проблема, которую решает C4.</b> Архитектурные схемы обычно бесполезны по одной из двух причин: либо это три квадратика без деталей, либо простыня из ста элементов, в которой ничего не разобрать. Нельзя показать общую картину и детали на одном листе.</p>
<p><b>Решение:</b> уровни масштаба, как в картах. Сначала страна, потом город, потом улица.</p>
`+D.c4+`
<h4>Уровень 1 — Context</h4>
<p>Одна коробка — вся ваша система. Вокруг — пользователи и внешние системы, с которыми она взаимодействует. Никаких технологий, никаких внутренностей.</p>
<p><b>Пример:</b> в центре «Система взыскания». Вокруг: оператор, робот-обзвона, АБС банка, СМС-шлюз, бюро кредитных историй. Стрелки с подписями: «получает данные о просрочке», «отправляет уведомления».</p>
<p><b>Аудитория:</b> все, включая бизнес и руководство. Эту схему должен понимать человек без технического бэкграунда.</p>
<h4>Уровень 2 — Containers</h4>
<p>Раскрываем систему: из каких приложений и хранилищ она состоит. <b>Контейнер</b> здесь — это не Docker, а «то, что запускается и работает отдельно»: веб-приложение, мобильное приложение, API-сервис, база данных, брокер сообщений.</p>
<p><b>Пример:</b> веб-кабинет оператора, API взыскания, сервис обзвона, PostgreSQL, Kafka, Redis. У каждого указана технология и то, как контейнеры общаются между собой.</p>
<p><b>Аудитория:</b> вся команда, архитекторы, DevOps. Это самая полезная схема на практике — именно её чаще всего рисует аналитик.</p>
<h4>Уровень 3 — Components</h4>
<p>Заглядываем внутрь одного контейнера: из каких модулей он состоит и как они связаны. Рисуют только для сложных контейнеров, когда действительно нужно объяснить внутреннее устройство.</p>
<h4>Уровень 4 — Code</h4>
<p>Классы, интерфейсы, схема БД. На практике почти никогда не рисуют вручную — устаревает мгновенно. Если нужно, генерируют из кода.</p>
<div class="co tip"><span class="co-i">💡</span><span><b>Что реально нужно аналитику.</b> Уровни 1 и 2 покрывают 90% потребностей. Первый — чтобы объяснить бизнесу и новичкам, что вообще происходит. Второй — чтобы команда одинаково понимала структуру системы и точки интеграции. Третий рисуйте только по необходимости, четвёртый — не рисуйте.</span></div>
<div class="co warn"><span class="co-i">⚠️</span><span><b>Главное правило любых схем:</b> схема, которая не поддерживается в актуальном состоянии, хуже отсутствия схемы. Устаревшая архитектурная диаграмма активно вредит: новый человек сделает по ней неверные выводы. Лучше две актуальные схемы, чем двадцать протухших.</span></div>`,
prac:"Нарисуй C4 уровня 1 для своего продукта: одна коробка в центре, вокруг все внешние системы и роли, стрелки с подписями что именно передаётся. Ограничение — не больше десяти элементов. Если не влезает, значит границы системы определены слишком широко, и это само по себе полезное открытие.",
questions:[
{q:"Что такое нотация C4?",
short:"Способ описания архитектуры через четыре уровня детализации: Context — система и её окружение, Containers — приложения и хранилища внутри, Components — модули внутри контейнера, Code — классы. Каждый уровень для своей аудитории.",
long:`<b>Идея в основе:</b> одна схема не может одновременно объяснить общую картину бизнесу и детали разработчику. C4 разделяет их по уровням масштаба, как карта: страна, город, улица, дом.<br><br><b>Ключевое понятие — контейнер.</b> Это не Docker, а любая отдельно запускаемая и разворачиваемая единица: сервис, база данных, брокер, фронтенд-приложение. Именно на этом уровне видны технологические решения и точки интеграции.<br><br><b>Что даёт на практике:</b><br>— Новый человек в команде за час понимает систему, пройдя два уровня<br>— На уровне 2 сразу видны все внешние зависимости и узкие места<br>— Схема первого уровня отлично работает на согласованиях с бизнесом<br><br><b>Чем C4 отличается от UML:</b> UML — формальная нотация с десятками типов диаграмм и строгими правилами. C4 — простой подход с четырьмя уровнями и минимумом элементов: коробки, стрелки, подписи. Ниже порог входа, выше шанс, что схемой действительно будут пользоваться.<br><br><b>Честное ограничение:</b> C4 описывает статическую структуру. Для процессов и сценариев всё равно нужны BPMN и Sequence-диаграммы.`}
]},

{id:"c4-2",title:"Семь этапов проектирования решения",
theory:`<p>Так выглядит полный цикл работы над архитектурой решения. Аналитик участвует почти во всех этапах, а на первых двух — ведущий.</p>
<h4>Этап 1. Выявление и анализ требований</h4>
<p>Собираем, что вообще надо сделать: бизнес-цель, пользователи, сценарии, существующие ограничения. Ключевой вопрос — не «что построить», а «какую проблему решаем и как поймём, что решили».</p>
<h4>Этап 2. Нефункциональные требования и ограничения</h4>
<p>Тот этап, который чаще всего пропускают, а потом переделывают систему. Что нужно выяснить:</p>
<ul>
<li><b>Нагрузка:</b> сколько пользователей, какой RPS в пике, объём данных и темп роста</li>
<li><b>Доступность:</b> какой SLA, что происходит при простое, есть ли окно обслуживания</li>
<li><b>Производительность:</b> допустимое время отклика, в том числе на 95-м и 99-м перцентиле</li>
<li><b>Безопасность:</b> какие данные обрабатываем, требования регулятора, аудит</li>
<li><b>Ограничения:</b> бюджет, сроки, обязательный стек, импортозамещение, компетенции команды</li>
</ul>
<h4>Этап 3. Архитектурно значимые требования и компромиссы</h4>
<p>Из всего списка выделяем те требования, которые <b>определяют</b> архитектуру. Требование «кнопка синего цвета» ни на что не влияет. Требование «данные не покидают контур банка» меняет всё.</p>
<p>Здесь же вскрываются конфликты: строгая консистентность против высокой доступности, скорость разработки против отказоустойчивости, стоимость против производительности. Компромисс выбирается осознанно и <b>фиксируется письменно</b>.</p>
<h4>Этап 4. Проектирование концепции вместе с техлидами</h4>
<p>Рисуем варианты решения, оцениваем каждый по значимым требованиям, выбираем. Обычно несколько итераций. Аналитик здесь — носитель требований: следит, чтобы выбранный вариант их закрывал, и переводит между бизнесом и техлидами.</p>
<h4>Этап 5. Документирование</h4>
<p>C4-схемы, описание компонентов и интеграций, модель данных, ADR — записи об архитектурных решениях. Формат ADR: контекст, рассмотренные варианты, выбранное решение, обоснование, последствия и риски.</p>
<div class="co tip"><span class="co-i">💡</span><span><b>ADR — самый недооценённый документ.</b> Через год никто не вспомнит, почему выбрали Kafka, а не RabbitMQ. Без ADR новая команда либо переделает по-своему, либо будет бояться трогать. Одна страница, написанная сегодня, экономит недели споров через год.</span></div>
<h4>Этап 6. Презентация и согласование</h4>
<p>Защита решения перед архитектурным комитетом, безопасностью, смежными командами. Здесь важно уметь говорить на языке аудитории: бизнесу — про сроки, риски и деньги; безопасности — про данные и доступы; командам — про интеграционные контракты.</p>
<h4>Этап 7. Сопровождение разработки и вывод в прод</h4>
<p>Архитектура не заканчивается документом. Дальше: ответы на вопросы команды, ревью решений по ходу, корректировки при вскрытии новых обстоятельств, участие в приёмке и в плане вывода.</p>
<div class="co warn"><span class="co-i">⚠️</span><span><b>Что идёт не так чаще всего.</b> Этапы 2 и 3 проскакивают за полчаса, потому что «и так понятно». Через полгода выясняется, что система не держит нагрузку или не проходит требования безопасности. Переделка на этом этапе стоит в десятки раз дороже, чем два дня разговоров в начале.</span></div>`,
prac:"Напиши ADR на одну страницу по любому архитектурному решению своего проекта: контекст и проблема, какие варианты рассматривали, что выбрали, почему, какие последствия и риски приняли. Это и полезный документ для команды, и готовая история для собеседования — интервьюеры любят такие примеры.",
questions:[
{q:"Как выглядит процесс проектирования архитектуры решения?",
short:"Семь этапов: сбор требований, определение нефункциональных требований и ограничений, выделение архитектурно значимых требований с компромиссами, проектирование концепции с техлидами, документирование, согласование, сопровождение разработки.",
long:`<b>Где в этом процессе аналитик:</b><br><br><b>Этапы 1–2 он ведёт.</b> Именно аналитик выясняет нагрузку, требования к доступности, регуляторные ограничения. Без этих цифр архитектор проектирует вслепую.<br><br><b>Этап 3 — совместный.</b> Аналитик приносит требования, архитектор объясняет, какие из них конфликтуют и чем придётся пожертвовать. Задача аналитика — вынести конфликт на бизнес: «мы можем дать либо мгновенную согласованность, либо работу при отказе дата-центра, выбирайте».<br><br><b>Этап 4 — аналитик как хранитель требований.</b> Следит, чтобы в увлечении технологиями не потерялось то, ради чего всё затевалось.<br><br><b>Этап 5 — совместное документирование.</b> C4, интеграционные контракты, модель данных.<br><br><b>Самая частая ошибка:</b> проскочить этап 2. Без цифр по нагрузке и доступности любая архитектура — угадывание, а переделка на этапе эксплуатации стоит несопоставимо дороже.<br><br><b>Хорошее завершение ответа:</b> «Главный артефакт всего процесса — не схема, а ADR с зафиксированными компромиссами. Схема показывает, что построили, ADR объясняет почему — и через год это ценнее».`}
]}
]};

let reqIdx=0, reqStats={ok:0,no:0}, reqOrder=[], reqAnswered=false;

function reqInit(){
  reqOrder=REQT.map((_,i)=>i);
  for(let i=reqOrder.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[reqOrder[i],reqOrder[j]]=[reqOrder[j],reqOrder[i]];}
  reqIdx=0;reqAnswered=false;
}
function reqAnswer(t){
  if(reqAnswered)return;
  reqAnswered=true;
  const cur=REQT[reqOrder[reqIdx]];
  const ok=(t===cur.t);
  if(ok){reqStats.ok++;prog['req-'+reqOrder[reqIdx]]=true;save();refreshBars(true);}
  else reqStats.no++;
  document.querySelectorAll('[data-rt]').forEach(b=>{
    const bt=b.getAttribute('data-rt');
    if(bt===cur.t){b.style.background=RTYPE[cur.t].c;b.style.borderColor=RTYPE[cur.t].b;b.style.color=RTYPE[cur.t].t;b.style.fontWeight='700';}
    else if(bt===t){b.style.background='#fff0f3';b.style.borderColor='#f43f5e';b.style.color='#96123b';b.style.textDecoration='line-through';}
    else b.style.opacity='.45';
  });
  const fb=document.getElementById('reqFb');
  if(fb){
    fb.className='fb '+(ok?'ok':'no')+' show';
    fb.innerHTML=(ok?'✅ <b>Верно!</b> ':'❌ <b>Не угадал.</b> Правильный ответ — <b>'+RTYPE[cur.t].n+'</b>. ')+cur.e;
  }
  const nb=document.getElementById('reqNext');if(nb)nb.style.display='inline-block';
  const st=document.getElementById('reqStat');
  if(st)st.textContent='Верно: '+reqStats.ok+' · Ошибок: '+reqStats.no+' · Осталось: '+(REQT.length-reqIdx-1);
}
function reqNext(){
  if(reqIdx<REQT.length-1){reqIdx++;reqAnswered=false;renderMain();}
  else{
    const fb=document.getElementById('reqFb');
    if(fb){fb.className='fb ok show';
      fb.innerHTML='🏆 <b>Все 100 требований пройдены!</b> Верно: '+reqStats.ok+', ошибок: '+reqStats.no+
      '. Если ошибок больше 15 — стоит перечитать тему «Виды требований» и пройти круг заново, порядок будет другим.';}
    const nb=document.getElementById('reqNext');if(nb)nb.style.display='none';
  }
}
function reqRestart(){reqStats={ok:0,no:0};reqInit();renderMain();}

{id:"nl-1",title:"Путь до сервера: DNS, TCP, UDP, TLS",
theory:NETCSS+`<p>Прежде чем твой запрос дойдёт до API, происходит три вещи, о которых обычно не думают. Посмотри, как это выглядит на проводе.</p>`

{q:"Что происходит от ввода адреса до получения ответа?",

long:`Отвечать лучше по шагам, добавляя, где что ломается — это отличает разбиравшегося от заучившего.<br><br><b>Где ломается на практике:</b><br>— <b>DNS не резолвится</b> → «сайт не найден». Проверяется через <code>nslookup</code>.<br>— <b>TCP не установился</b> → таймаут. Порт закрыт файрволом или сервис не слушает.<br>— <b>TLS не прошёл</b> → предупреждение о сертификате: истёк, не тому домену, самоподписанный.<br>— <b>5xx</b> → проблема уже в приложении.<br>— <b>Страница пустая</b> → упал JS или API не отдал данные.<br><br><b>Зачем это аналитику:</b> при разборе инцидента вы должны понимать, на каком этапе сломалось, и не звать бэкендера на проблему с сертификатом.`},

{id:"nl-2",title:"HTTP/2 против HTTP/3 и рукопожатия",

<p>HTTP/3 ушёл на QUIC поверх UDP и надёжность реализовал сам. Теперь потеря пакета тормозит только свой поток. Бонусом соединение переживает смену сети — важно для мобильных, когда переключаешься с Wi-Fi на LTE.</p>`

`<div class="co warn"><span class="co-i">⚠️</span><span><b>Почему это важно для API.</b> Каждое новое соединение — это круг на TCP плюс круг на TLS. При задержке 80 мс это уже 240 мс до первого полезного байта. Отсюда keep-alive, пулы соединений и стремление не открывать соединение на каждый запрос. И отсюда же боль мобильных клиентов: на плохой сети круги стоят дорого, поэтому им делают BFF, который отдаёт всё одним запросом.</span></div>`,
prac:"Посчитай на салфетке: если задержка до сервера 60 мс, сколько времени уйдёт на установку соединения с TLS 1.2 (TCP — один круг, TLS — два)? Ответ около 180 мс, и это до того, как ушёл первый байт запроса. Теперь понятно, почему за keep-alive так держатся.",
questions:[
{q:"Что даёт HTTP/2 по сравнению с 1.1?",
short:"Мультиплексирование — много параллельных запросов в одном соединении, бинарный формат вместо текста, сжатие заголовков. Пропала необходимость открывать шесть соединений на домен и склеивать файлы.",
long:`<b>Проблема HTTP/1.1:</b> в одном соединении запросы шли по очереди. Браузеры обходили это шестью параллельными соединениями, а разработчики — склейкой CSS и спрайтами.<br><br><b>Что дал HTTP/2:</b> мультиплексирование (сотни запросов в одном соединении), бинарный формат (парсится быстрее и однозначнее), HPACK (сжатие заголовков — раньше одинаковые куки летели целиком в каждом запросе), server push (оказался спорным и почти не используется).<br><br><b>Что осталось:</b> блокировка очереди на уровне TCP. Потерялся пакет — тормозит всё соединение.<br><br><b>HTTP/3</b> решает это через QUIC поверх UDP: потеря влияет только на свой поток, плюс соединение переживает смену сети.`}

// Схемы, которые раньше требовали кнопок, теперь крутятся сами по циклу.
// Кнопки остаются — но как «ручной режим»: клик ставит автоцикл на паузу.

let AUTO = {timers:[], paused:{}};

function autoClear(){
  AUTO.timers.forEach(t=>clearInterval(t));
  AUTO.timers=[];
}
function autoStop(key){ AUTO.paused[key]=true; }

function autoLoop(key, steps, delay){
  // steps — массив функций, выполняются по кругу
  let i=0;
  const t=setInterval(()=>{
    if(AUTO.paused[key])return;
    if(!document.getElementById(steps.probe))return;
    try{ steps.run[i](); }catch(e){}
    i=(i+1)%steps.run.length;
  }, delay);
  AUTO.timers.push(t);
}

function startAuto(){
  autoClear();
  AUTO.paused={};

  // Circuit Breaker: ошибки → OPEN → таймаут → HALF → успех → CLOSED
  if(document.getElementById('cbMsg')){
    autoLoop('cb',{probe:'cbMsg',run:[
      ()=>{cbRst()},()=>{cbErr()},()=>{cbErr()},()=>{cbErr()},()=>{cbErr()},
      ()=>{cbErr()},()=>{cbWait()},()=>{cbOk()}
    ]},1500);
  }
  // Saga: успех → сбой → успех
  if(document.getElementById('sgSt')){
    let n=0;
    const t=setInterval(()=>{
      if(AUTO.paused['sg'])return;
      if(!document.getElementById('sgSt'))return;
      try{ sgRun(n%2===0?1:0); }catch(e){}
      n++;
    },6500);
    AUTO.timers.push(t);
    setTimeout(()=>{try{sgRun(1)}catch(e){}},400);
  }
  // Кэш: промах → попадание
  if(document.getElementById('cchK')){
    autoLoop('cch',{probe:'cchK',run:[()=>cch(0),()=>cch(1),()=>cch(1)]},2200);
  }
  // Балансировщик: падение → восстановление
  if(document.getElementById('lbS3t')){
    autoLoop('lb',{probe:'lbS3t',run:[()=>lbHeal(),()=>lbHeal(),()=>lbKill(),()=>lbKill()]},2600);
  }
  // Strangler Fig: перенос по шагам и заново
  if(document.getElementById('stfMsg')){
    let n=0;
    const t=setInterval(()=>{
      if(AUTO.paused['stf'])return;
      if(!document.getElementById('stfMsg'))return;
      try{ stfN=n%5; stfStep(0); }catch(e){}
      n++;
    },2000);
    AUTO.timers.push(t);
  }
  // Bulkhead: норма → отказ
  if(document.getElementById('bhMsg')){
    autoLoop('bh',{probe:'bhMsg',run:[()=>bhReset(),()=>bhReset(),()=>bhFail(),()=>bhFail(),()=>bhFail()]},2400);
  }
  // Retry: попытки по нарастающей
  if(document.getElementById('rtMsg')){
    let n=0;
    const t=setInterval(()=>{
      if(AUTO.paused['rt'])return;
      if(!document.getElementById('rtMsg'))return;
      try{ if(n%7===0){rtReset();}else{rtNext();} }catch(e){}
      n++;
    },1400);
    AUTO.timers.push(t);
  }
  // Идемпотентность: платёж → повтор → сброс
  if(document.getElementById('idMsg')){
    autoLoop('id',{probe:'idMsg',run:[()=>idReset(),()=>idSend(),()=>idSend(1),()=>idSend(1)]},2600);
  }
  // OAuth: шесть шагов по кругу
  if(document.getElementById('oaMsg')){
    let n=0;
    const t=setInterval(()=>{
      if(AUTO.paused['oa'])return;
      if(!document.getElementById('oaMsg'))return;
      try{ if(n%8===0){oaReset();}else{oaNext();} }catch(e){}
      n++;
    },1500);
    AUTO.timers.push(t);
  }
  // Загрузка сайта: восемь шагов
  if(document.getElementById('plMsg')){
    let n=0;
    const t=setInterval(()=>{
      if(AUTO.paused['pl'])return;
      if(!document.getElementById('plMsg'))return;
      try{ if(n%10===0){plReset();}else{plNext();} }catch(e){}
      n++;
    },1400);
    AUTO.timers.push(t);
  }
  // ACID: транзакция → сбой с откатом
  if(document.getElementById('acMsg')){
    let n=0;
    const t=setInterval(()=>{
      if(AUTO.paused['ac'])return;
      if(!document.getElementById('acMsg'))return;
      try{
        const p=n%9;
        if(p===0)acReset();
        else if(p<=3)acStep();
        else if(p===5)acFail();
      }catch(e){}
      n++;
    },1600);
    AUTO.timers.push(t);
  }
  // Аномалии: четыре по кругу
  if(document.getElementById('anMsg')){
    let n=1;
    const t=setInterval(()=>{
      if(AUTO.paused['an'])return;
      if(!document.getElementById('anMsg'))return;
      try{ anShow(n); }catch(e){}
      n=n%4+1;
    },3800);
    AUTO.timers.push(t);
    setTimeout(()=>{try{anShow(1)}catch(e){}},300);
  }
  // Принципы REST: шесть по кругу
  if(document.getElementById('rpT')){
    const ids=['rp1','rp2','rp3','rp4','rp5','rp6'];
    let n=0;
    const t=setInterval(()=>{
      if(AUTO.paused['rp'])return;
      if(!document.getElementById('rpT'))return;
      try{ rpShow(ids[n%6]); }catch(e){}
      n++;
    },3600);
    AUTO.timers.push(t);
    setTimeout(()=>{try{rpShow('rp1')}catch(e){}},300);
  }
}

// перехватываем ручные клики — останавливаем автоцикл этой схемы
(function(){
  const wrap=(name,key)=>{
    const orig=window[name];
    if(typeof orig!=='function')return;
    window[name]=function(){autoStop(key);return orig.apply(this,arguments);};
  };
  ['cbErr','cbOk','cbWait','cbRst'].forEach(f=>wrap(f,'cb'));
  wrap('sgRun','sg'); wrap('cch','cch');
  ['lbKill','lbHeal'].forEach(f=>wrap(f,'lb'));
  wrap('stfStep','stf');
  ['bhFail','bhReset'].forEach(f=>wrap(f,'bh'));
  ['rtNext','rtReset'].forEach(f=>wrap(f,'rt'));
  ['idSend','idReset'].forEach(f=>wrap(f,'id'));
  ['oaNext','oaReset'].forEach(f=>wrap(f,'oa'));
  ['plNext','plReset'].forEach(f=>wrap(f,'pl'));
  ['acStep','acFail','acReset'].forEach(f=>wrap(f,'ac'));
  wrap('anShow','an'); wrap('rpShow','rp');
})();

{n:6,t:"Последний платёж каждого клиента",d:"mid",

sol:`SELECT client_id, paid_at, amount
FROM (
  SELECT l.client_id,
         p.paid_at,
         p.amount,
         ROW_NUMBER() OVER (
           PARTITION BY l.client_id

) t
WHERE rn = 1;`,

FROM payments p
JOIN loans l ON l.id = p.loan_id
ORDER BY l.client_id, p.paid_at;`,

function allIds(){const a=DATA.flatMap(b=>b.topics.map(t=>t.id));
  SQLT.forEach(s=>a.push('sql-'+s.n));
  REQT.forEach((_,i)=>a.push('req-'+i));
  SMARTT.forEach((_,i)=>a.push('sm-'+i));
  return a;}
function bPct(b){
  if(b.type==='sql')return Math.round(SQLT.filter(s=>prog['sql-'+s.n]).length/SQLT.length*100);
  if(b.type==='req')return Math.round(REQT.filter((_,i)=>prog['req-'+i]).length/REQT.length*100);
  if(b.type==='smart')return Math.round(SMARTT.filter((_,i)=>prog['sm-'+i]).length/SMARTT.length*100);
  const t=b.topics.length,d=b.topics.filter(t=>prog[t.id]).length;return t?Math.round(d/t*100):0;
}
function ovStat(){const i=allIds(),d=i.filter(x=>prog[x]).length;return{d,t:i.length,p:i.length?Math.round(d/i.length*100):0};}

// ── Плавное обновление счётчиков ──
function animNum(el,to,suffix){
  if(!el)return;
  const from=parseInt(el.dataset.v||el.textContent)||0;
  if(from===to){el.textContent=to+(suffix||'');return;}
  el.dataset.v=to;
  const dur=650,st=performance.now();
  const tick=(now)=>{
    let k=Math.min(1,(now-st)/dur);
    k=1-Math.pow(1-k,3);
    el.textContent=Math.round(from+(to-from)*k)+(suffix||'');
    if(k<1)requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function toast(msg){
  const t=document.getElementById('toast');if(!t)return;
  t.innerHTML=msg;t.classList.add('on');
  clearTimeout(t._tm);
  t._tm=setTimeout(()=>t.classList.remove('on'),2600);
}

}

// ── Клик по чекбоксу: обновляем точечно, без re-render ──
function toggleDone(id,e){
  e.stopPropagation();
  const on=!prog[id];
  prog[id]=on; if(!on)delete prog[id];
  save();
  const box=e.currentTarget;
  box.classList.toggle('d',on);
  box.classList.remove('burst');void box.offsetWidth;box.classList.add('burst');
  const card=box.closest('.tp')||box.closest('.sqlw');
  if(card){
    card.classList.toggle('dn',on);
    const tt=card.querySelector('.tt'); if(tt)tt.classList.toggle('done-t',on);
    const ts=card.querySelector('.ts'); if(ts)ts.textContent=on?'✓ пройдено':'';
  }
  refreshBars(on);
  if(on){
    const s=ovStat();
    if(s.d===s.t) toast('🏆 Пройден весь курс! Теперь — практика вслух');
    else if(s.p>0&&s.p%25===0) toast('🎉 Пройдено '+s.p+'% курса');
    else{
      const b=DATA.find(x=>x.id===active);
      if(b&&bPct(b)===100) toast('✅ Блок «'+b.title+'» пройден целиком');
    }
  }
}

// Circuit Breaker
let cbState='closed',cbErrCnt=0;
function cbSet(s){cbState=s;const o={closed:'cbClosed',open:'cbOpen',half:'cbHalf'};
  Object.values(o).forEach(id=>{const e=document.getElementById(id);if(e)e.setAttribute('opacity','.3')});
  const el=document.getElementById(o[s]);if(el)el.setAttribute('opacity','1');}
function cbM(t){const e=document.getElementById('cbMsg');if(e)e.textContent=t;}
function cbC(){const e=document.getElementById('cbCnt');if(e)e.textContent='ошибок: '+cbErrCnt+' / 5';}
function cbErr(){
  if(cbState==='open'){cbM('⛔ Предохранитель разомкнут — запрос даже не полетел к сервису. Мгновенный отказ, ресурсы не тратятся.');return;}
  if(cbState==='half'){cbSet('open');cbErrCnt=5;cbC();cbM('💥 Пробный запрос провалился → снова OPEN. Сервис не восстановился, ждём следующий таймаут.');return;}
  cbErrCnt++;cbC();
  if(cbErrCnt>=5){cbSet('open');cbM('🔴 Порог превышен → OPEN. Все запросы отклоняются мгновенно, не занимая потоки и не добивая упавший сервис.');}
  else cbM('⚠️ Ошибка зафиксирована ('+cbErrCnt+' из 5). Предохранитель ещё замкнут, запросы идут.');
}
function cbOk(){
  if(cbState==='open'){cbM('⛔ В состоянии OPEN запросы не проходят вообще — успеха быть не может. Нажми «Подождать 30 сек».');return;}
  if(cbState==='half'){cbSet('closed');cbErrCnt=0;cbC();cbM('✅ Пробный запрос прошёл → CLOSED. Сервис восстановился, работаем штатно.');return;}
  cbErrCnt=0;cbC();cbM('✅ Успех. Счётчик ошибок сброшен.');
}
function cbWait(){
  if(cbState!=='open'){cbM('Таймаут имеет смысл только в состоянии OPEN.');return;}
  cbSet('half');cbM('🟡 HALF-OPEN. Пропускаем ровно один пробный запрос. Нажми «Успешный ответ» или «Ошибка», чтобы увидеть развилку.');
}
function cbRst(){cbErrCnt=0;cbSet('closed');cbC();cbM('Сброшено. Нажимай «Ошибка» 5 раз — увидишь размыкание.');}

// Saga
function sgRun(ok){
  const st=document.getElementById('sgSt'),cp=document.getElementById('sgComp');
  const ids=['sg1','sg2','sg3','sg4'];
  ids.forEach(i=>{const r=document.querySelector('#'+i+' rect');if(r){r.setAttribute('fill','#f1f5f9');r.setAttribute('stroke','#cbd5e1');}});
  if(cp)cp.setAttribute('opacity','0');
  const g=i=>{const r=document.querySelector('#'+i+' rect');if(r){r.setAttribute('fill','#e2f8f5');r.setAttribute('stroke','#00b8a6');}};
  const rd=i=>{const r=document.querySelector('#'+i+' rect');if(r){r.setAttribute('fill','#fff0f3');r.setAttribute('stroke','#f43f5e');}};
  let step=0;
  const tick=()=>{
    step++;
    if(!ok&&step===3){rd('sg3');if(st){st.textContent='💥 Шаг 3 упал! Запускаем компенсации в обратном порядке';st.setAttribute('fill','#f43f5e');}
      setTimeout(()=>{if(cp)cp.setAttribute('opacity','1');
        setTimeout(()=>{rd('sg2');setTimeout(()=>{rd('sg1');if(st)st.textContent='↩️ Компенсации выполнены — система вернулась в согласованное состояние';},700);},700);},500);
      return;}
    if(step<=4){g(ids[step-1]);if(st){st.textContent='✅ Шаг '+step+' выполнен';st.setAttribute('fill','#00776c');}
      if(step<4)setTimeout(tick,700);
      else if(st)setTimeout(()=>{st.textContent='🎉 Сага завершена успешно — займ выдан';},600);}
  };
  if(st){st.textContent='▶ Запуск...';st.setAttribute('fill','#5d7186');}
  setTimeout(tick,300);
}

// Strangler Fig
let stfN=0;
function stfStep(d){
  stfN=Math.max(0,Math.min(4,stfN+d));
  const pct=stfN*25, old=100-pct;
  const bar=(f)=>'█'.repeat(Math.round(f/6.25))+'░'.repeat(16-Math.round(f/6.25));
  const so=document.getElementById('stfOld'),sob=document.getElementById('stfOldB');
  const sn=document.getElementById('stfNew'),snb=document.getElementById('stfNewB');
  const lo=document.getElementById('stfLo'),ln=document.getElementById('stfLn'),m=document.getElementById('stfMsg');
  if(so)so.textContent='осталось функций: '+old+'%';
  if(sob)sob.textContent=bar(old);
  if(sn)sn.textContent='перенесено: '+pct+'%';
  if(snb)snb.textContent=bar(pct);
  if(lo){lo.setAttribute('stroke-width',String(Math.max(0.6,old/40)));lo.setAttribute('stroke',old>0?'#f59e0b':'#cbd5e1');
    if(old>0){lo.classList.add('flowline');lo.removeAttribute('stroke-dasharray');lo.setAttribute('stroke-dasharray','6 6');}else{lo.classList.remove('flowline');lo.setAttribute('stroke-dasharray','3 3');}}
  if(ln){ln.setAttribute('stroke-width',String(Math.max(0.6,pct/40)));ln.setAttribute('stroke',pct>0?'#00b8a6':'#cbd5e1');
    if(pct>0){ln.classList.add('flowline');ln.setAttribute('stroke-dasharray','6 6');}else{ln.classList.remove('flowline');ln.setAttribute('stroke-dasharray','3 3');}}
  const msgs=['Старт: весь трафик в монолит','Вынесли справочники — самое безопасное','Вынесли уведомления — свой профиль нагрузки',
    'Вынесли расчёт долга — ядро домена','Монолит пуст: можно выключать'];
  if(m){m.textContent=msgs[stfN];m.setAttribute('fill',stfN===4?'#046049':(stfN===0?'#8a4a08':'#5d7186'));}
}

  const task=SQLT.find(s=>s.n===n);

        '<div class="sol" id="sol'+t.n+'"><div class="solc">'+t.sol.replace(/</g,'&lt;')+'</div>'+
        '<div class="solx"><b>Разбор:</b> '+t.exp+'</div></div></div></div>';
    });
    h+='<div class="foot">Решённые задачи учитываются в общем прогрессе. Эталон — не единственно верный ответ: если твой запрос даёт тот же результат, он тоже правильный.</div>';
    document.getElementById('main').innerHTML=h;
    return;
  }

  b.topics.forEach(t=>{
    const dn=!!prog[t.id],op=openT.has(t.id);
    h+='<div class="tp '+(op?'open ':'')+(dn?'dn':'')+'"><div class="tp-h" onclick="toggleOpen(\''+t.id+'\')">'+
      '<div class="chk '+(dn?'d':'')+'" onclick="toggleDone(\''+t.id+'\',event)">'+
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>'+
      '<div class="tm"><div class="tt '+(dn?'done-t':'')+'">'+t.title+'</div><div class="ts">'+(dn?'✓ пройдено':'')+'</div></div>'+
      '<div class="cv">▾</div></div><div class="tb"><div class="th">'+t.theory+'</div>';
    if(t.prac) h+='<div class="prac"><div class="prac-h">⚡ Практика — 5 минут</div><div class="prac-b">'+t.prac+'</div></div>';
    if(t.questions&&t.questions.length){
      h+='<div class="ql">Вопросы с собеседований</div>';
      t.questions.forEach((q,i)=>{
        const k=t.id+'-'+i,o=openA.has(k);
        h+='<div class="qi"><div class="qq"><div class="qb">?</div><div>'+q.q+'</div></div>'+
          '<div class="qshort"><b>Как ответить:</b> '+q.short+'</div>';
        if(q.long) h+='<button class="qmore" data-ansbtn="'+k+'" onclick="toggleAns(\''+k+'\')">'+
          (o?'▲ свернуть подробное объяснение':'▼ развернуть подробное объяснение')+'</button>'+
          '<div class="qlong '+(o?'show':'')+'" data-ans="'+k+'">'+q.long+'</div>';
        h+='</div>';
      });
    }
    h+='</div></div>';
  });
  h+='<div class="foot">Чекбокс слева отмечает тему пройденной — шкалы заполняются плавно. Зелёный блок под вопросом — короткий ответ для собеса, ниже разворачивается подробное объяснение. Прогресс сохраняется автоматически.</div>';
  document.getElementById('main').innerHTML=h;
}

function render(){renderNav();renderMain();}
const baseRenderMain=renderMain;
renderMain=function(){
baseRenderMain();
const b=DATA.find(item=>item.id===active);
const guide=document.createElement('section');
guide.className='start-guide';
guide.innerHTML='<strong>Как изучать этот раздел</strong><p>Сначала прочитай объяснение и разбери пример. Затем выполни практику своими словами и сравни решение с разбором.</p><p><b>Проверь понимание.</b> Объясни, какую задачу решает тема «'+b.title+'», приведи пример и назови ограничение решения.</p><a href="index.html#paths">Вернуться к учебному маршруту →</a>';
document.getElementById('main').prepend(guide);
};
const _rm=renderMain;
renderMain=function(){_rm.apply(this,arguments);if(typeof startAuto==='function')setTimeout(startAuto,60);};
document.getElementById('rstBtn').onclick=()=>{
  if(confirm('Сбросить весь прогресс и ответы SQL?')){prog={};sqlAns={};save();saveSql();render();toast('↺ Прогресс сброшен');}
};
load();
if (document.documentElement.hasAttribute('data-embed') && parent !== window) {
  const moduleBody = document.getElementById('main');
  const reportSize = () => parent.postMessage({type:'system-lab-depth-size',height:Math.ceil(moduleBody.getBoundingClientRect().bottom + window.scrollY)}, location.origin === 'null' ? '*' : location.origin);
  new ResizeObserver(reportSize).observe(moduleBody);
  reportSize();
}
</script>
